<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortedWMS</title>
<style>
  :root { --bg: #f3f6f8; --card: #fff; --line: #dde3e8; --ink: #17202a; --dim: #5d6b76; --acc: #1769c2; --ok: #0f7a45; --bad: #b42318; --warn: #9a6700; --chip: #eef2f5; }
  body[data-role="administrator"] { --acc: #3d348b; }
  body[data-role="manager"] { --acc: #1769c2; }
  body[data-role="office"] { --acc: #0f6e56; }
  body[data-role="technician"] { --acc: #9a6700; }
  body[data-role="operator"] { --acc: #9a3412; }
  body[data-role="machine"] { --acc: #1d4e89; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-bottom: 3px solid var(--acc); }
  header h1 { font-size: 18px; margin: 0; }
  header .who { color: var(--dim); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button, button, .btn { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 7px 11px; cursor: pointer; text-decoration: none; }
  nav button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  button.primary { background: var(--acc); color: #fff; border-color: var(--acc); font-weight: 700; }
  main { padding: 16px; max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .hint, .dim { color: var(--dim); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 26px; }
  .kpi span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-size: 12px; }
  .form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 8px 0; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
  textarea { min-height: 64px; width: 100%; }
  .msg { padding: 8px 10px; border-radius: 8px; background: var(--chip); }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 5px; background: var(--chip); font-size: 12px; font-weight: 700; }
  .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .job { font-size: 20px; }
  .scan input { font-size: 20px; padding: 14px; width: 100%; }
  .big button, button.big { min-height: 48px; font-size: 17px; font-weight: 700; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .checks label { flex-direction: row; align-items: center; color: var(--ink); font-size: 14px; }
  a { color: var(--acc); }
  @media (max-width: 720px) { main { padding: 10px; } header h1 { font-size: 16px; } .job { font-size: 18px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">SortedWMS</h1>
  <span class="who" id="who"></span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <a class="btn" href="/admin">Floor</a>
  <a class="btn" href="/handheld">Handheld</a>
  <button id="out" type="button">Sign out</button>
</header>
<main id="main"></main>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HOME = { administrator: 'users', manager: 'floor', office: 'floor', technician: 'sort', operator: 'receive', machine: 'moves' };
  const NAV = {
    administrator: [['users', 'Users'], ['roles', 'Roles'], ['settings', 'Settings'], ['audit', 'Audit'], ['master', 'Master data']],
    manager: [['floor', 'Floor'], ['tasks', 'Tasks'], ['exceptions', 'Exceptions'], ['history', 'History'], ['locations', 'Locations'], ['holders', 'Holders']],
    office: [['floor', 'Office'], ['clients', 'Clients'], ['items', 'Items'], ['inbound', 'Inbound'], ['outbound', 'Outbound'], ['reports', 'Reports'], ['labels', 'Labels']],
    technician: [['sort', 'Auto-sort'], ['defaults', 'Location defaults'], ['series', 'Label series'], ['hardware', 'Hardware']],
    operator: [['receive', 'Receiving'], ['mezzanine', 'Mezzanine'], ['kitting', 'Kitting']],
    machine: [['moves', 'Moves'], ['replenish', 'Replenish'], ['holders', 'License plates']],
  };
  const TITLES = { administrator: 'Administrator', manager: 'Manager / supervisor', office: 'Office', technician: 'Technical', operator: 'Operator', machine: 'Machine operator' };
  let me = null;
  let panel = '';

  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) { location.assign('/login?next=' + encodeURIComponent(location.pathname + location.search)); throw new Error('Sign in required'); }
    const type = res.headers.get('content-type') || '';
    const data = type.includes('json') ? await res.json().catch(() => ({})) : await res.text();
    if (!res.ok) throw new Error((data && data.error) || res.statusText);
    return data;
  }
  const can = (p) => me && me.permissions && me.permissions.includes(p);
  const table = (heads, rows) => `<div style="overflow-x:auto"><table><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td class="dim" colspan="${heads.length}">Nothing here</td></tr>`}</table></div>`;
  const msg = (text, ok) => `<p class="msg ${ok ? 'ok' : 'bad'}">${esc(text)}</p>`;

  function paintNav() {
    document.body.dataset.role = me.role;
    $('#title').textContent = TITLES[me.role] || 'SortedWMS';
    $('#who').textContent = `${me.displayName} · ${me.username}`;
    const items = NAV[me.role] || [['floor', 'Home']];
    if (!panel || (!items.some(([id]) => id === panel) && !PANELS[panel])) panel = HOME[me.role] || items[0][0];
    $('#nav').innerHTML = items.map(([id, label]) => `<button type="button" data-panel="${id}" class="${id === panel ? 'on' : ''}">${label}</button>`).join('');
  }

  async function draw() {
    paintNav();
    const main = $('#main');
    main.innerHTML = '<p class="dim">Loading…</p>';
    try { main.innerHTML = await (PANELS[panel] || PANELS.missing)(); }
    catch (e) { main.innerHTML = msg(e.message, false); }
  }

  const PANELS = {
    async missing() { return msg('This view is not on your role.', false); },
    async receive() {
      const [deliveries, holders] = await Promise.all([api('GET', '/api/deliveries'), api('GET', '/api/holders')]);
      const inbound = holders.filter((h) => h.series === 'INB' || (h.id || '').startsWith('INB'));
      return `<section><h2>Inbound receiving</h2><p class="hint">On foot, with a handheld. A full pallet is labelled PAL and MASTER after it is received. Lower-value lines use an INB plate.</p>
        <form class="form" data-act="issue-plates"><label>Received pallet SSCC<input name="sscc" required placeholder="18 digit SSCC"></label><button class="primary">Issue PAL + MASTER</button></form>
        <form class="form" data-act="issue-series"><input type="hidden" name="series" value="INB"><label>Item<input name="itemNo" value="Y1002"></label><label>Qty<input name="qty" type="number" value="1"></label><label>Location<input name="loc" value="DOCK-IN"></label><button>Issue INB plate</button></form>
        <h3>Open deliveries</h3>${table(['Delivery', 'Supplier', 'ASN', 'Status'], deliveries.map((d) => `<tr><td>${esc(d.id)}</td><td>${esc(d.supplier)}</td><td>${esc(d.asn || d.id)}</td><td>${esc(d.status)}</td></tr>`))}
        <h3>INB plates</h3>${plateTable(inbound)}</section>`;
    },
    async mezzanine() {
      const [locs, holders] = await Promise.all([api('GET', '/api/locations?kind=mezzanine&limit=50'), api('GET', '/api/holders')]);
      const here = holders.filter((h) => (locs.locations || []).some((l) => l.code === h.loc));
      return `<section><h2>Mezzanine picking</h2><p class="hint">Scan the license plate on the mezzanine pick face. This is a walk pick, not a truck move.</p>
        ${table(['Location', 'Name'], (locs.locations || []).map((l) => `<tr><td>${esc(l.code)}</td><td>${esc(l.name || '')}</td></tr>`))}
        ${plateTable(here)}
        <form class="scan" data-act="mezz-scan"><label>Scan plate<input name="code" id="scan" autocomplete="off" placeholder="ST0000001"></label><p class="big"><button class="primary">Confirm pick</button></p></form><div id="scanMsg"></div></section>`;
    },
    async kitting() {
      const val = await api('GET', '/api/val');
      const open = (val.jobs || []).find((j) => j.status === 'open');
      const station = (val.stations[0] && val.stations[0].id) || 'VAL-01';
      return `<section><h2>VAL / kitting</h2><p class="hint">Scan the base product, then each component. Example: add a power plug to a laptop.</p>
        ${val.kits.map((k) => `<p><b>${esc(k.name)}</b> — base ${esc(k.base.itemNo)} × ${k.base.qty}, ${k.components.map((c) => esc(c.itemNo) + ' × ' + c.qty).join(', ')}</p>`).join('') || '<p class="dim">No kits.</p>'}
        <form class="form" data-act="val-start"><label>Station<input name="stationId" value="${esc(station)}"></label><button class="primary">Start kit</button></form>
        ${open ? `<p>Open job #${open.id} ${esc(open.kitName)}. Scanned ${open.got.length} / ${open.need.reduce((n, l) => n + l.qty, 0)}.</p><ul>${open.need.map((n) => `<li>${esc(n.role)} ${esc(n.itemNo)} × ${n.qty}</li>`).join('')}</ul>` : '<p class="dim">No kit in progress.</p>'}
        <form class="scan" data-act="val-scan"><input type="hidden" name="stationId" value="${esc(station)}"><label>Scan component or plate<input name="code" placeholder="NB-14 or PLUG-EU"></label><p class="big"><button class="primary">Scan</button></p></form></section>`;
    },
    async moves() {
      const [tasks, devices] = await Promise.all([api('GET', '/api/tasks'), api('GET', '/api/devices')]);
      const trucks = devices.filter((d) => d.kind !== 'desk');
      const moves = tasks.filter((t) => ['PUTAWAY', 'SHIFT', 'MOVE', 'PICK'].includes(t.type));
      const id = sessionStorage.getItem('device') || (trucks.find((t) => t.operator === me.username) || trucks[0] || {}).id || 'HH01';
      let dev = null;
      try { dev = await api('GET', '/api/devices/' + encodeURIComponent(id)); } catch (e) { dev = null; }
      const ins = dev && dev.instruction || {};
      const asked = (ins.pallet && ins.pallet.sscc) || ins.target || '';
      return `<section><h2>Equipment moves</h2><p class="hint">Reach truck or high-level order picker. The screen is the next move: put-away, replenishment, transfer, pallet move, block lane.</p>
        <form class="form"><label>Truck<select id="devicePick">${trucks.map((t) => `<option ${t.id === id ? 'selected' : ''}>${esc(t.id)}</option>`).join('')}</select></label></form>
        <p class="job">${ins.task ? esc(ins.task.typeLabel) : 'Waiting for the next move'}</p>
        ${ins.targetName ? `<p>Drop at <b>${esc(ins.targetName)}</b></p>` : ''}
        ${ins.pallet ? `<p>Plate / pallet …${esc(ins.pallet.sscc.slice(-6))} ${esc(ins.pallet.itemNo || '')}</p>` : ''}
        <form class="scan" data-act="scan"><label>Scan<input name="code" id="scan" autocomplete="off" placeholder="Pallet, then location"></label><p class="big"><button class="primary">Send</button> <button type="button" id="sim" data-code="${esc(asked)}">Simulate scan</button></p></form>
        <div id="scanMsg"></div></section>
        <section><h2>Move queue</h2>${taskTable(moves.slice(0, 14), false)}</section>`;
    },
    async replenish() {
      const locs = await api('GET', '/api/locations?kind=mezzanine&limit=20');
      return `<section><h2>Replenishment and transfers</h2><p class="hint">Send stock from bulk to a pick face, or consolidate partial pallets at CONSO00.</p>
        <form class="form" data-act="replenish"><label>Item<input name="itemNo" value="Y1001"></label><label>To<input name="to" value="${esc((locs.locations[0] && locs.locations[0].code) || 'MEZZ-A1')}"></label><button class="primary">Replenish</button></form>
        <form class="form" data-act="consolidate"><label>PAL plates<textarea name="pals" placeholder="PAL0000001 PAL0000002"></textarea></label><label>At<input name="at" value="CONSO00"></label><label>Keep MASTER<input name="master" placeholder="blank = earliest"></label><button>Consolidate</button></form>
        <p class="hint">The earliest MASTER survives unless you name another MASTER already on these pallets. The other MASTER plates are retired and their numbers are not reused.</p></section>`;
    },
    async sort() {
      const tech = await api('GET', '/api/technical');
      const s = tech.autoSort || {};
      const rules = (s.rules || []).map((r) => `${r.category || ''}: ${r.putaway || ''}`).join('\n');
      return `<section><h2>Auto-sort</h2><p class="hint">Parameters the WMS technical team owns. Stock administration does not change these.</p>
        <form data-act="tech-sort"><label>Strategy<select name="strategy"><option ${s.strategy === 'fefo' ? 'selected' : ''}>fefo</option><option ${s.strategy === 'fifo' ? 'selected' : ''}>fifo</option><option ${s.strategy === 'nearest' ? 'selected' : ''}>nearest</option></select></label>
        <label><input type="checkbox" name="enabled" ${s.enabled !== false ? 'checked' : ''}> Enabled</label>
        <label><input type="checkbox" name="sameBatchTogether" ${s.sameBatchTogether !== false ? 'checked' : ''}> Keep the same batch together</label>
        <label><input type="checkbox" name="groundForNextOut" ${s.groundForNextOut !== false ? 'checked' : ''}> Next-out stock to ground</label>
        <label>Rules, one per line (CATEGORY: instruction)<textarea name="rules">${esc(rules)}</textarea></label>
        <p><button class="primary">Save auto-sort</button></p></form></section>`;
    },
    async defaults() {
      const tech = await api('GET', '/api/technical');
      const d = tech.locationDefaults || {};
      const row = (kind) => {
        const x = d[kind] || {};
        return `<tr><td>${kind}</td><td><input name="${kind}.heightMm" type="number" value="${x.heightMm == null ? '' : esc(x.heightMm)}"></td><td><input name="${kind}.widthMm" type="number" value="${x.widthMm == null ? '' : esc(x.widthMm)}"></td><td><input name="${kind}.depthMm" type="number" value="${x.depthMm == null ? '' : esc(x.depthMm)}"></td><td><input name="${kind}.maxWeightKg" type="number" value="${x.maxWeightKg == null ? '' : esc(x.maxWeightKg)}"></td></tr>`;
      };
      return `<section><h2>Location defaults</h2><p class="hint">Dimension and capacity defaults by location type. Virtual locations such as CONSO00 have no physical size unless you set one.</p>
        <form data-act="tech-defaults"><table><tr><th>Type</th><th>H mm</th><th>W mm</th><th>D mm</th><th>Max kg</th></tr>${['rack', 'bin', 'mezzanine', 'virtual'].map(row).join('')}</table>
        <p><button class="primary">Save defaults</button></p></form>
        <p class="dim">Types: zone, aisle, rack, level, bin, mezzanine, virtual (consolidation, staging), block lane.</p></section>`;
    },
    async series() {
      const tech = await api('GET', '/api/technical');
      const rows = Object.entries(tech.holderSeries || {}).map(([k, s]) => `<tr><td>${esc(k)}</td><td><input name="prefix.${k}" value="${esc(s.prefix)}"></td><td><input name="pad.${k}" type="number" min="1" max="12" value="${esc(s.pad)}"></td><td>${esc(s.prefix)}${String(s.next).padStart(s.pad, '0')}</td><td>${esc(s.next)}</td></tr>`).join('');
      return `<section><h2>License plate series</h2><p class="hint">PAL and MASTER for full pallets. ST, INB and OUT for lower-value stock. Numbers only increase and are never reused.</p>
        <form data-act="tech-series"><table><tr><th>Series</th><th>Prefix</th><th>Pad</th><th>Next id</th><th>Counter</th></tr>${rows}</table>
        <p><button class="primary">Save format</button></p></form></section>${await PANELS.hardware()}`;
    },
    async history() {
      const [users, movements] = await Promise.all([can('users.read') ? api('GET', '/api/users') : { users: [] }, api('GET', '/api/movements')]);
      return `<section><h2>Movement history</h2><p class="hint">Every move stores the person, the license plate, from, to, time and quantity.</p>
        <form class="form" data-act="history"><label>User<select name="user"><option value="">Anyone</option>${(users.users || []).map((u) => `<option>${esc(u.username)}</option>`).join('')}</select></label><label>Plate or SSCC<input name="holder" placeholder="PAL0000001"></label><button class="primary">Show</button></form>
        <div id="historyOut">${moveTable(movements)}</div></section>`;
    },
    async users() {
      const { users } = await api('GET', '/api/users');
      const roles = ['administrator', 'manager', 'office', 'technician', 'operator', 'machine'];
      const opts = (sel) => roles.map((r) => `<option ${r === sel ? 'selected' : ''}>${r}</option>`).join('');
      return `<section><h2>Users and roles</h2><p class="hint">Assign one of the six roles. The last administrator stays an administrator.</p>
        <form class="form" data-act="user-create"><label>Username<input name="username" required></label><label>Name<input name="displayName" required></label><label>Password<input name="password" type="password" required minlength="8"></label><label>Role<select name="role">${opts('operator')}</select></label><button class="primary">Add user</button></form>
        ${table(['User', 'Name', 'Role', 'Active', ''], users.map((u) => `<tr><td>${esc(u.username)}</td><td>${esc(u.displayName)}</td><td><select data-role-for="${u.id}">${opts(u.role)}</select></td><td>${u.active ? 'yes' : 'no'}</td><td><button type="button" data-act="user-save" data-id="${u.id}">Save</button> <button type="button" data-act="user-off" data-id="${u.id}">${u.active ? 'Disable' : 'Enable'}</button></td></tr>`))}</section>
        <section><h2>Recent sign-in activity</h2>${await auditBits(8)}</section>`;
    },
    async roles() {
      const cat = await api('GET', '/api/roles');
      const role = new URLSearchParams(location.hash.split('?')[1] || '').get('role') || 'office';
      const current = cat.roles.find((r) => r.id === role) || cat.roles[1];
      const boxes = cat.permissions.map((p) => `<label><input type="checkbox" name="perm" value="${esc(p.id)}" ${current.permissions.includes(p.id) ? 'checked' : ''} ${current.fixed ? 'disabled' : ''}> ${esc(p.label)}</label>`).join('');
      return `<section><h2>Permissions</h2><p class="hint">Administrator always has every permission. Other roles start from a default you can narrow or widen.</p>
        <form data-act="role-save"><label>Role<select name="role" id="rolePick">${cat.roles.map((r) => `<option value="${r.id}" ${r.id === current.id ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></label>
        <div class="checks">${boxes}</div><p><button class="primary" ${current.fixed ? 'disabled' : ''}>Save ${esc(current.label)}</button></p></form></section>`;
    },
    async settings() {
      const [summary, hw] = await Promise.all([api('GET', '/api/summary'), api('GET', '/api/hardware')]);
      return `<section><h2>System settings</h2><p class="hint">Dispatch and device mode. Printer addresses still live in the site file.</p>
        <form class="form" data-act="config"><label>Trucks per aisle<input name="aisleCap" type="number" min="1" value="${esc(summary.config.aisleCap)}"></label><button class="primary">Save</button></form>
        <form class="form" data-act="hw-mode"><label>Scanner<select name="scanner">${hw.modes.scanner.map((m) => `<option ${m === hw.settings.scanner ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
        <label>Printer<select name="printer">${hw.modes.printer.map((m) => `<option ${m === hw.settings.printer ? 'selected' : ''}>${m}</option>`).join('')}</select></label><button class="primary">Save devices</button></form>
        <p class="dim">One-way aisles ${summary.config.oneWay ? 'on' : 'off'} · naming ${esc(summary.naming)}</p>
        <p><a href="/setup">Open the setup wizard</a> to change the warehouse type, category features and location codes.</p></section>`;
    },
    async audit() { return `<section><h2>Audit log</h2><p class="hint">Warehouse commands and sign-in events. The journal is also how the warehouse is rebuilt.</p>${await auditBits(80)}</section>`; },
    async master() {
      return `<section><h2>Master data</h2><p class="hint">Office owns clients and items. The manager owns locations and holders. You can use the same screens.</p>
        <p><a href="/app#clients">Clients</a> · <a href="/app#items">Items</a> · <a href="/app#locations">Locations</a> · <a href="/app#holders">Holders</a> · <a href="/app#labels">Labels</a></p></section>${await PANELS.clients()}`;
    },
    async floor() {
      if (me.role === 'office') return PANELS.office();
      const [summary, users, tasks, ex] = await Promise.all([api('GET', '/api/summary'), can('users.read') ? api('GET', '/api/users') : { users: [] }, api('GET', '/api/tasks?status=open'), api('GET', '/api/exceptions')]);
      const k = summary;
      return `<section><h2>Shift</h2><div class="kpis">
        <div class="kpi"><b>${k.openJobs}</b><span>Open jobs</span></div>
        <div class="kpi"><b>${k.activeJobs}</b><span>Active</span></div>
        <div class="kpi"><b>${k.orders}</b><span>Open orders</span></div>
        <div class="kpi"><b>${k.pallets}</b><span>Pallets in stock</span></div>
        <div class="kpi"><b>${k.cantShip}</b><span>Cannot ship</span></div>
        <div class="kpi"><b>${ex.faults.length}</b><span>Open faults</span></div>
      </div></section>
      <div class="grid"><section><h2>Staff</h2>${table(['Name', 'Role', 'User'], (users.users || []).filter((u) => u.active).map((u) => `<tr><td>${esc(u.displayName)}</td><td>${esc(u.roleLabel || u.role)}</td><td>${esc(u.username)}</td></tr>`))}
        <form class="form" data-act="assign"><label>Device<input name="id" value="HH01" required></label><label>Person<input name="operator" placeholder="operator"></label><button class="primary">Assign</button></form></section>
        <section><h2>Exceptions</h2><p>${ex.held.length} held jobs · ${ex.blocked.length} blocked pallets · ${ex.lost.length} location unknown · ${ex.quality.length} quality holds</p>
        ${ex.faults.map((f) => `<p class="tag bad">Fault</p> ${esc(f.equipmentId)}: ${esc(f.summary)}`).join('') || '<p class="dim">No open equipment faults.</p>'}</section></div>
      <section><h2>Open tasks</h2>${taskTable(tasks.slice(0, 12), true)}</section>`;
    },
    async tasks() {
      const tasks = await api('GET', '/api/tasks');

  function plateTable(holders) {
    return table(['Plate', 'Series', 'Where', 'Under', 'Qty'], (holders || []).map((h) => `<tr><td>${esc(h.id)}</td><td>${esc(h.series || h.type || '')}</td><td>${esc(h.loc || '')}</td><td>${esc(h.parentId || ((h.children || []).length ? h.children.join(', ') : ''))}</td><td>${(h.contents || []).map((c) => esc(c.qty)).join(', ')}</td></tr>`));
  }
  function moveTable(rows) {
    return table(['When', 'Who', 'Plate', 'Event', 'From', 'To', 'Qty'], (rows || []).map((m) => `<tr><td>${new Date(m.t).toLocaleString()}</td><td>${esc(m.by)}</td><td>${esc(m.holder || m.sscc || '')}</td><td>${esc(m.event)}</td><td>${esc(m.from || '')}</td><td>${esc(m.to || '')}</td><td>${m.qty == null ? '' : esc(m.qty)}</td></tr>`));
  }
  function taskTable(tasks, actions) {
    return table(['Job', 'Type', 'Status', 'From', 'To', ''], (tasks || []).map((t) => `<tr><td>#${t.id}</td><td>${esc(t.typeLabel)}</td><td>${t.urgent ? '<span class="tag warn">urgent</span> ' : ''}${esc(t.status)}</td><td>${esc(t.fromName || '')}</td><td>${esc(t.toName || '')}</td><td>${actions && t.status === 'open' ? `<button type="button" data-act="urgent" data-id="${t.id}">Urgent</button>` : ''}</td></tr>`));
  }
  function faultTable(faults) {
    return table(['Id', 'Equipment', 'Summary', 'Status'], (faults || []).map((f) => `<tr><td>${f.id}</td><td>${esc(f.equipmentId)}</td><td>${esc(f.summary)}</td><td>${esc(f.status)}</td></tr>`));
  }
  async function auditBits(limit) {
    const [journal, authLog] = await Promise.all([api('GET', '/api/journal?limit=' + limit), api('GET', '/api/auth-log?limit=' + limit)]);
    const rows = [
      ...journal.map((j) => ({ t: j.t, who: j.by, what: j.op })),
      ...authLog.map((j) => ({ t: j.t, who: j.by, what: 'account: ' + j.action })),
    ].sort((a, b) => b.t - a.t).slice(0, limit);
    return table(['When', 'Who', 'What'], rows.map((r) => `<tr><td>${new Date(r.t).toLocaleString()}</td><td>${esc(r.who || '')}</td><td>${esc(r.what)}</td></tr>`));
  }
  async function operatorWork(queueOnly) {
    const devices = await api('GET', '/api/devices');
    const trucks = devices.filter((d) => d.kind !== 'desk');
    const id = sessionStorage.getItem('device') || (trucks[0] && trucks[0].id) || 'HH01';
    const dev = await api('GET', '/api/devices/' + encodeURIComponent(id));
    const tasks = await api('GET', '/api/tasks?status=open');
    const ins = dev.instruction || {};
    const job = ins.task;
    if (queueOnly) return `<section><h2>Task queue</h2>${taskTable(tasks, false)}</section>`;
    const asked = (ins.pallet && ins.pallet.sscc) || ins.target || '';
    return `<section class="big"><h2>${esc(dev.id)} · ${esc(dev.mode)}</h2>
      <p class="dim">${dev.operator ? 'Assigned to ' + esc(dev.operator) : 'No person assigned'}${dev.categories ? ' · ' + esc(dev.categories.join(', ')) : ''}</p>
      <form class="form"><label>Handheld<select id="devicePick">${trucks.map((t) => `<option ${t.id === id ? 'selected' : ''}>${esc(t.id)}</option>`).join('')}</select></label></form>
      <p class="job">${job ? `${esc(job.typeLabel)} ${job.orderId ? 'order ' + esc(job.orderId) : ''}` : esc(ins.kind || 'Idle')}</p>
      <p>${dev.message ? esc(dev.message.text) : ''}</p>
      ${ins.targetName ? `<p>Go to <b>${esc(ins.targetName)}</b></p>` : ''}
      ${ins.pallet ? `<p>Pallet …${esc(ins.pallet.sscc.slice(-6))} ${esc(ins.pallet.itemNo || '')} batch ${esc(ins.pallet.batch || '')}</p>` : ''}
      <div class="form">${(dev.modes || []).map((m) => `<button type="button" data-act="mode" data-mode="${esc(m.id)}" class="${m.id === dev.mode ? 'primary' : ''}">${esc(m.label)}</button>`).join('')}</div>
      <form class="scan" data-act="scan"><label>Scan<input name="code" id="scan" autocomplete="off" placeholder="Wedge ends with Enter"></label><input type="hidden" name="source" value="manual"><p><button class="primary">Send</button> <button type="button" id="sim" data-code="${esc(asked)}">Simulate scan</button></p></form>
      <div id="scanMsg"></div></section>
      <section><h2>Queue for this floor</h2>${taskTable(tasks.slice(0, 8), false)}</section>`;
  }

  $('#nav').onclick = (e) => {
    const b = e.target.closest('[data-panel]');
    if (!b) return;
    panel = b.dataset.panel;
    history.replaceState(null, '', '/app#' + panel);
    draw();
  };
  $('#out').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.assign('/login'); };
  $('#main').onclick = async (e) => {
    const b = e.target.closest('[data-act], #sim, #stationPick, #devicePick');
    if (!b) return;
    try {
      if (b.id === 'devicePick') return;
      if (b.id === 'stationPick') { sessionStorage.setItem('station', b.value); return draw(); }
      if (b.id === 'sim') { await sendScan(b.dataset.code, 'simulated', sessionStorage.getItem('device') || 'HH01'); return; }
      if (b.dataset.act === 'sim-station') {
        const code = prompt('Simulated scan code');
        if (code) await sendStation(code, 'simulated');
        return;
      }
      const act = b.dataset.act;
      if (act === 'user-save' || act === 'user-off') {
        const id = b.dataset.id;
        const role = document.querySelector(`[data-role-for="${id}"]`).value;
        const users = (await api('GET', '/api/users')).users;
        const u = users.find((x) => String(x.id) === String(id));
        await api('POST', '/api/users/' + id, { role, active: act === 'user-off' ? !u.active : u.active });
        return draw();
      }
      if (act === 'item-archive') { await api('POST', '/api/items/' + encodeURIComponent(b.dataset.id) + '/archive', {}); return draw(); }
      if (act === 'loc-del') { await api('POST', '/api/locations/' + encodeURIComponent(b.dataset.id) + '/delete', {}); return draw(); }
      if (act === 'holder-del') { await api('POST', '/api/holders/' + encodeURIComponent(b.dataset.id) + '/remove', {}); return draw(); }
      if (act === 'urgent') { await api('POST', '/api/tasks/' + b.dataset.id + '/urgent', { urgent: true }); return draw(); }
      if (act === 'mode') { await api('POST', '/api/devices/' + encodeURIComponent(sessionStorage.getItem('device') || 'HH01') + '/mode', { mode: b.dataset.mode }); return draw(); }
    } catch (err) { $('#main').insertAdjacentHTML('afterbegin', msg(err.message, false)); }
  };
  $('#main').onchange = (e) => {
    if (e.target.id === 'devicePick') { sessionStorage.setItem('device', e.target.value); draw(); }
    if (e.target.id === 'stationPick') { sessionStorage.setItem('station', e.target.value); draw(); }
    if (e.target.id === 'rolePick') { location.hash = 'roles?role=' + e.target.value; panel = 'roles'; draw(); }
  };
  $('#main').onsubmit = async (e) => {
    const form = e.target;
    if (!form.dataset.act) return;
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      if (form.dataset.act === 'history') {
      const q = new URLSearchParams();
      if (data.user) q.set('user', data.user);
      if (data.holder) q.set('holder', data.holder);
      document.getElementById('historyOut').innerHTML = moveTable(await api('GET', '/api/movements?' + q.toString()));
      return;
    }
    if (form.dataset.act === 'mezz-scan') {
      await api('POST', '/api/holders/' + encodeURIComponent(data.code) + '/pick', {});
      const el = document.getElementById('scanMsg');
      if (el) el.innerHTML = msg('Picked ' + data.code, true);
      return;
    }
    if (form.dataset.act === 'scan') return sendScan(data.code, wedgeBurst ? 'wedge' : 'manual', sessionStorage.getItem('device') || 'HH01');
      if (form.dataset.act === 'station-scan') return sendStation(data.code, wedgeBurst ? 'wedge' : 'manual');
      await act(form.dataset.act, data);
      form.reset();
      draw();
    } catch (err) { form.insertAdjacentHTML('beforebegin', msg(err.message, false)); }
  };

  let wedgeBurst = false;
  let lastKey = 0;
  document.addEventListener('keydown', (ev) => {
    const scan = document.getElementById('scan');
    if (!scan || document.activeElement !== scan) return;
    const now = Date.now();
    if (ev.key === 'Enter') return;
    if (ev.key.length === 1) wedgeBurst = now - lastKey < 40;
    lastKey = now;
  });

  async function sendScan(code, source, deviceId) {
    if (!code) throw new Error('Nothing to scan');
    const out = await api('POST', '/api/hardware/scan', { code, source, deviceId });
    const text = (out.result && (out.result.text || out.result.message)) || 'Scanned';
    const el = document.getElementById('scanMsg');
    if (el) el.innerHTML = msg(`${source}: ${text}`, out.result ? out.result.ok !== false : true);
    else draw();
    setTimeout(draw, 400);
  }
  async function sendStation(code, source) {
    const stationId = sessionStorage.getItem('station') || 'PRESS';
    const out = await api('POST', '/api/hardware/scan', { code, source, stationId });
    const text = (out.result && out.result.text) || 'Scanned';
    const el = document.getElementById('scanMsg');
    if (el) el.innerHTML = msg(`${source}: ${text}`, out.result ? out.result.ok !== false : true);
  }
  async function act(name, data) {
    if (name === 'user-create') return api('POST', '/api/users', data);
    if (name === 'role-save') {
      const permissions = [...document.querySelectorAll('input[name=perm]:checked')].map((n) => n.value);
      return api('POST', '/api/roles/' + data.role, { permissions });
    }
    if (name === 'config') return api('POST', '/api/config', { aisleCap: Number(data.aisleCap) });
    if (name === 'hw-mode') return api('POST', '/api/hardware/mode', data);
    if (name === 'assign') return api('POST', '/api/devices/' + encodeURIComponent(data.id) + '/operator', { operator: data.operator });
    if (name === 'client-add') return api('POST', '/api/clients', data);
    if (name === 'item-add') return api('POST', '/api/items', { ...data, palletQty: Number(data.palletQty || 1), lengthMm: num(data.lengthMm), widthMm: num(data.widthMm), heightMm: num(data.heightMm), weightKg: num(data.weightKg), clientId: data.clientId || null, gtin: data.gtin || null });
    if (name === 'asn') return api('POST', '/api/deliveries', { ...data, pallets: Number(data.pallets || 1), clientId: data.clientId || null });
    if (name === 'order') return api('POST', '/api/orders', { id: data.id, customer: data.customer, lane: data.lane, lines: [{ itemNo: data.itemNo, pallets: Number(data.pallets || 1) }] });
    if (name === 'pack') return api('POST', '/api/orders/' + encodeURIComponent(data.id) + '/pack', { note: data.note });
    if (name === 'label-pallet' || name === 'label-master') {
      const path = name === 'label-master' ? '/api/labels/master' : '/api/labels/pallet';
      const body = name === 'label-master' ? { title: data.title, children: String(data.children || '').split(/\s+/).filter(Boolean) } : { ...data, qty: data.qty ? Number(data.qty) : undefined };
      const label = await api('POST', path, body);
      const slot = document.getElementById('labelOut');
      if (slot) slot.innerHTML = `<p class="msg ok">Label ${esc(label.sscc)}</p><p><a href="/api/labels/${label.id}/html" target="_blank">Open printable label</a> · <a href="/api/labels/${label.id}/zpl" target="_blank">ZPL</a></p>`;
      return label;
    }
    if (name === 'loc-add') return api('POST', '/api/locations', cleanNums(data));
    if (name === 'loc-cap') return api('POST', '/api/locations/' + encodeURIComponent(data.code) + '/capacity', cleanNums(data));
    if (name === 'holder-add') return api('POST', '/api/holders', data);
    if (name === 'holder-move') return api('POST', '/api/holders/' + encodeURIComponent(data.id) + '/move', { loc: data.loc });
    if (name === 'holder-load') return api('POST', '/api/holders/' + encodeURIComponent(data.id) + '/load', { itemNo: data.itemNo || undefined, qty: data.qty ? Number(data.qty) : undefined, sscc: data.sscc || undefined });
    if (name === 'fault') return api('POST', '/api/equipment/' + encodeURIComponent(data.equipmentId) + '/fault', data);
    if (name === 'fault-close') return api('POST', '/api/faults/' + encodeURIComponent(data.id) + '/close', { note: data.note });
    if (name === 'maint') return api('POST', '/api/equipment/' + encodeURIComponent(data.equipmentId) + '/maintenance', data);
    if (name === 'test-print') return api('POST', '/api/hardware/print', { printer: 'SIM', zpl: data.zpl, html: '<p>SortedWMS test</p>', kind: 'test' });
    if (name === 'plan-counts') return api('POST', '/api/plan/counts', { limit: Number(data.limit || 3) });
    if (name === 'issue-plates') return api('POST', '/api/holders/issue', { sscc: data.sscc });
    if (name === 'issue-series') return api('POST', '/api/holders/series', { series: data.series, itemNo: data.itemNo, qty: Number(data.qty), loc: data.loc });
    if (name === 'replenish') return api('POST', '/api/replenish', data);
    if (name === 'consolidate') return api('POST', '/api/consolidate', { pals: String(data.pals || '').split(/\s+/).filter(Boolean), at: data.at, master: data.master || null });
    if (name === 'val-start') return api('POST', '/api/val/start', data);
    if (name === 'val-scan') return api('POST', '/api/val/scan', data);
    if (name === 'tech-sort') {
      const rules = String(data.rules || '').split(/\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const i = line.indexOf(':');
        return { category: (i < 0 ? line : line.slice(0, i)).trim(), putaway: i < 0 ? '' : line.slice(i + 1).trim() };
      });
      return api('POST', '/api/technical', { autoSort: { strategy: data.strategy, enabled: data.enabled === 'on', sameBatchTogether: data.sameBatchTogether === 'on', groundForNextOut: data.groundForNextOut === 'on', rules } });
    }
    if (name === 'tech-defaults') {
      const locationDefaults = {};
      for (const kind of ['rack', 'bin', 'mezzanine', 'virtual']) {
        locationDefaults[kind] = { heightMm: num(data[kind + '.heightMm']), widthMm: num(data[kind + '.widthMm']), depthMm: num(data[kind + '.depthMm']), maxWeightKg: num(data[kind + '.maxWeightKg']) };
      }
      return api('POST', '/api/technical', { locationDefaults });
    }
    if (name === 'tech-series') {
      const holderSeries = {};
      for (const series of ['PAL', 'MASTER', 'ST', 'INB', 'OUT']) holderSeries[series] = { prefix: data['prefix.' + series], pad: Number(data['pad.' + series]) };
      return api('POST', '/api/technical', { holderSeries });
    }
    throw new Error('Unknown action');
  }
  const num = (v) => (v === '' || v == null ? null : Number(v));
  function cleanNums(data) {
    const out = { ...data };
    for (const k of ['heightMm', 'widthMm', 'depthMm', 'maxWeightKg', 'stacks', 'stackHeight']) if (k in out) out[k] = num(out[k]);
    return out;
  }

  api('GET', '/api/session').then((r) => { me = r.user; panel = (location.hash || '#').slice(1).split('?')[0]; draw(); }).catch(() => {});
  window.addEventListener('hashchange', () => { panel = location.hash.slice(1).split('?')[0]; if (me) draw(); });
})();
</script>
</body>
</html>
