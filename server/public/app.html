<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortedWMS</title>
<style>
  :root { --bg: #f3f6f8; --card: #fff; --line: #dde3e8; --ink: #17202a; --dim: #5d6b76; --acc: #1769c2; --ok: #0f7a45; --bad: #b42318; --warn: #9a6700; --chip: #eef2f5; }
  body[data-role="administrator"] { --acc: #3d348b; }
  body[data-role="manager"] { --acc: #1769c2; }
  body[data-role="office"] { --acc: #0f6e56; }
  body[data-role="technician"] { --acc: #9a6700; }
  body[data-role="inbound"] { --acc: #1d4e89; }
  body[data-role="picker"] { --acc: #9a3412; }
  body[data-role="stock"] { --acc: #5b3f8c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-bottom: 3px solid var(--acc); }
  header h1 { font-size: 18px; margin: 0; }
  header .who { color: var(--dim); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button, button, .btn { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 7px 11px; cursor: pointer; text-decoration: none; }
  nav button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  button.primary { background: var(--acc); color: #fff; border-color: var(--acc); font-weight: 700; }
  main { padding: 16px; max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .hint, .dim { color: var(--dim); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 26px; }
  .kpi span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-size: 12px; }
  .form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 8px 0; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
  textarea { min-height: 64px; width: 100%; }
  .msg { padding: 8px 10px; border-radius: 8px; background: var(--chip); }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 5px; background: var(--chip); font-size: 12px; font-weight: 700; }
  .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .job { font-size: 20px; }
  .scan input { font-size: 20px; padding: 14px; width: 100%; }
  .big button, button.big { min-height: 48px; font-size: 17px; font-weight: 700; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .checks label { flex-direction: row; align-items: center; color: var(--ink); font-size: 14px; }
  a { color: var(--acc); }
  @media (max-width: 720px) { main { padding: 10px; } header h1 { font-size: 16px; } .job { font-size: 18px; } }
</style>
<script src="camera.js"></script>
</head>
<body>
<header>
  <h1 id="title">SortedWMS</h1>
  <span class="who" id="who"></span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <label id="siteLabel" class="who">Warehouse <select id="sitePick"></select></label>
  <a class="btn" href="/admin" id="floorLink">Floor</a>
  <a class="btn" href="/handheld" id="handheldLink">Handheld</a>
  <button id="out" type="button">Sign out</button>
</header>
<main id="main"></main>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HOME = { administrator: 'users', manager: 'floor', office: 'floor', technician: 'sort', inbound: 'receive', picker: 'cases', stock: 'stockctl', client: 'items' };
  const NAV = {
    administrator: [['users', 'Users'], ['roles', 'Roles'], ['sites', 'Warehouses'], ['settings', 'Settings'], ['audit', 'Audit'], ['master', 'Master data']],
    manager: [['floor', 'Floor'], ['tasks', 'Tasks'], ['exceptions', 'Exceptions'], ['tariff', 'Tariff'], ['history', 'History'], ['locations', 'Locations'], ['bins', 'Bins'], ['waves', 'Pick waves'], ['holders', 'Holders']],
    office: [['floor', 'Office'], ['clients', 'Clients'], ['tariff', 'Tariff'], ['items', 'Items'], ['bins', 'Bins'], ['inbound', 'Inbound'], ['outbound', 'Outbound'], ['waves', 'Pick waves'], ['stockctl', 'Stock checks'], ['pack', 'Packing'], ['returns', 'Returns'], ['reports', 'Reports'], ['labels', 'Labels']],
    technician: [['sort', 'Auto-sort'], ['profiles', 'Profiles'], ['defaults', 'Location defaults'], ['series', 'Label series'], ['hardware', 'Hardware']],
    inbound: [['receive', 'Receiving'], ['moves', 'Put-away'], ['bins', 'Bins']],
    picker: [['cases', 'Pallet and box picks'], ['bins', 'Bin picks'], ['moves', 'Truck'], ['mezzanine', 'Mezzanine'], ['kitting', 'Kitting']],
    stock: [['stockctl', 'Stock control'], ['bins', 'Bins'], ['moves', 'Auto-Shift and counts'], ['replenish', 'Replenish'], ['holders', 'License plates'], ['history', 'History']],
    client: [['items', 'Items'], ['stock', 'Stock'], ['orders', 'Orders']],
  };
  const TITLES = { administrator: 'Administrator', manager: 'Manager / supervisor', office: 'Office', technician: 'Technical', inbound: 'Inbound', picker: 'Picker', stock: 'Stock / inventory', client: 'Client' };
  const DUTY = { inbound: 'Inbound', picking: 'Picking', inventory: 'Stock and inventory' };
  const DUTY_OF = { inbound: 'inbound', picker: 'picking', stock: 'inventory' };
  const GEAR = { reach: 'Reach truck', manup: 'Man-up order picker', ept: 'Electric pallet truck', cart: 'Picking cart' };
  // Screens that belong to a module disappear while it is off.
  const PANEL_MODULE = { cases: 'waves', waves: 'waves', kitting: 'kitting', tariff: 'billing', clients: 'clients', sites: 'sites', moves: 'trucks' };
  // Simple screens: one short list for whoever signs in, for a person running the place alone.
  const SIMPLE_NAV = [['bins', 'Bins and shelves', 'stock.read'], ['receive', 'Receiving', 'inbound.write'], ['items', 'Items', 'items.read'], ['outbound', 'Orders', 'orders.read'], ['pack', 'Packing', 'outbound.write'], ['stockctl', 'Stock control', 'stock.read'], ['reports', 'Reports', 'reports.read'], ['labels', 'Labels', 'labels.print'], ['users', 'Users', 'users.read'], ['settings', 'Settings', 'settings.write']];
  let MODS = null;
  const modOn = (id) => !id || !MODS || (MODS.modules.find((m) => m.id === id) || {}).on !== false;
  let me = null;
  let panel = '';

  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) { location.assign('/login?next=' + encodeURIComponent(location.pathname + location.search)); throw new Error('Sign in required'); }
    const type = res.headers.get('content-type') || '';
    const data = type.includes('json') ? await res.json().catch(() => ({})) : await res.text();
    if (!res.ok) throw new Error((data && data.error) || res.statusText);
    return data;
  }
  const can = (p) => me && me.permissions && me.permissions.includes(p);
  const table = (heads, rows) => `<div style="overflow-x:auto"><table><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td class="dim" colspan="${heads.length}">Nothing here</td></tr>`}</table></div>`;
  const msg = (text, ok) => `<p class="msg ${ok ? 'ok' : 'bad'}">${esc(text)}</p>`;

  function paintNav() {
    document.body.dataset.role = me.role;
    $('#title').textContent = TITLES[me.role] || 'SortedWMS';
    $('#who').textContent = `${me.displayName} · ${me.username}`;
    const simple = MODS && MODS.simple && me.role !== 'client';
    const listed = simple ? SIMPLE_NAV.filter(([, , perm]) => can(perm)).map(([id, label]) => [id, label]) : (NAV[me.role] || [['floor', 'Home']]);
    const shown = listed.filter(([id]) => modOn(PANEL_MODULE[id]));
    const items = shown.length ? shown : listed;
    const home = simple ? items[0][0] : HOME[me.role];
    if (!panel || (!items.some(([id]) => id === panel) && !PANELS[panel]) || !modOn(PANEL_MODULE[panel])) panel = items.some(([id]) => id === home) ? home : items[0][0];
    const hh = document.getElementById('handheldLink');
    if (hh) hh.style.display = modOn('trucks') ? '' : 'none';
    const floor = document.getElementById('floorLink');
    if (floor) floor.style.display = simple ? 'none' : '';
    $('#nav').innerHTML = items.map(([id, label]) => `<button type="button" data-panel="${id}" class="${id === panel ? 'on' : ''}">${label}</button>`).join('');
  }

  async function draw() {
    paintNav();
    const main = $('#main');
    main.innerHTML = '<p class="dim">Loading…</p>';
    try { main.innerHTML = await (PANELS[panel] || PANELS.missing)(); }
    catch (e) { main.innerHTML = msg(e.message, false); }
  }

  const PANELS = {
    async missing() { return msg('This view is not on your role.', false); },
    async receive() {
      const [deliveries, holders] = await Promise.all([api('GET', '/api/deliveries'), api('GET', '/api/holders')]);
      const inbound = holders.filter((h) => h.series === 'INB' || (h.id || '').startsWith('INB'));
      return `<section><h2>Inbound receiving</h2><p class="hint">On foot, with a handheld. A full pallet is labelled PAL and MASTER after it is received. Lower-value lines use an INB plate.</p>
        <form class="form" data-act="issue-plates"><label>Received pallet SSCC<input name="sscc" required placeholder="18 digit SSCC"></label><button class="primary">Issue PAL + MASTER</button></form>
        <form class="form" data-act="issue-series"><input type="hidden" name="series" value="INB"><label>Item<input name="itemNo" value="Y1002"></label><label>Qty<input name="qty" type="number" value="1"></label><label>Location<input name="loc" value="DOCK-IN"></label><button>Issue INB plate</button></form>
        <h3>Open deliveries</h3>${table(['Delivery', 'Supplier', 'ASN', 'Status'], deliveries.map((d) => `<tr><td>${esc(d.id)}</td><td>${esc(d.supplier)}</td><td>${esc(d.asn || d.id)}</td><td>${esc(d.status)}</td></tr>`))}
        <h3>INB plates</h3>${plateTable(inbound)}</section>
        ${can('putaway.execute') ? `<section><h2>Put away by hand</h2><p class="hint">${modOn('trucks') ? 'For a pallet the trucks are not taking.' : 'No trucks here: put received pallets away yourself.'} Scan the pallet to see where the system would put it, then scan that slot, or another one.</p>
        <form class="form" data-act="putaway-suggest"><label>Pallet SSCC<input name="sscc" required autocomplete="off"></label><button>Where does it go?</button></form>
        <form class="form" data-act="putaway"><label>Pallet SSCC<input name="sscc" id="paSscc" required autocomplete="off"></label><label>Slot<input name="to" id="paTo" autocomplete="off" placeholder="the suggested slot"></label><button class="primary">Put away</button></form><div id="paOut"></div></section>` : ''}`;
    },
    async mezzanine() {
      const [locs, holders] = await Promise.all([api('GET', '/api/locations?kind=mezzanine&limit=50'), api('GET', '/api/holders')]);
      const here = holders.filter((h) => (locs.locations || []).some((l) => l.code === h.loc));
      return `<section><h2>Mezzanine picking</h2><p class="hint">Scan the license plate on the mezzanine pick face. This is a walk pick, not a truck move.</p>
        ${table(['Location', 'Name'], (locs.locations || []).map((l) => `<tr><td>${esc(l.code)}</td><td>${esc(l.name || '')}</td></tr>`))}
        ${plateTable(here)}
        <form class="scan" data-act="mezz-pick"><label>Order<input name="orderId" placeholder="4501"></label><label>Plate<input name="code" id="scan" autocomplete="off" placeholder="ST0000001"></label><label>Qty<input name="qty" type="number" min="1" placeholder="all"></label><p class="big"><button class="primary">Confirm pick</button></p></form>
        <p class="hint">A pick against an order consumes that sales-order line. Leave the order blank to record the plate only.</p><div id="scanMsg"></div></section>`;
    },
    async waves() {
      const [waves, q] = await Promise.all([api('GET', '/api/waves'), api('GET', '/api/waves/queue')]);
      const st = q.settings;
      const queueRows = q.queue.map((o) => `<tr><td>${esc(o.orderId)}</td><td>${esc(o.customer)}</td><td>${o.waitedMin} min</td><td>${o.clean ? '<span class="tag">drops cleanly</span>' : o.due ? '<span class="tag bad">waited long enough, opens a box</span>' : `opens a box, waits up to ${st.maxWaitMin} min`}</td><td class="${o.short.length ? 'bad' : ''}">${o.short.map((s) => `${esc(s.itemNo)} × ${s.qty}`).join(', ') || '—'}</td></tr>`);
      const rows = waves.map((w) => {
        const open = w.tasks.filter((t) => t.status === 'open');
        const cases = w.tasks.filter((t) => t.kind !== 'bin');
        const bins = w.tasks.filter((t) => t.kind === 'bin');
        const short = w.short.map((s) => `${s.orderId} ${s.itemNo} × ${s.qty}`).join('<br>');
        return `<tr><td><b>${esc(w.id)}</b><br><span class="dim">${esc(w.orders.join(', '))}</span></td><td>${cases.length} · ${cases.reduce((n, t) => n + t.qty, 0)} units</td><td>${bins.length} · ${bins.reduce((n, t) => n + t.qty, 0)} units</td><td>${open.length ? `${open.length} open` : 'done'}</td><td class="${short ? 'bad' : ''}">${short || '—'}</td><td>${open.length && can('orders.write') ? `<form class="form" data-act="wave-cancel"><input type="hidden" name="id" value="${esc(w.id)}"><button>Cancel</button></form>` : ''}</td></tr>`;
      });
      return `<section><h2>Pick waves</h2><p class="hint">Each piece line is picked as whole pallets first (straight to the dock), then whole boxes off the rack pallets, then the small rest: from the bins when they hold all of it, else from a box that is already open, and only then from a new box. Reach trucks never pick from bins.</p>
        <p>${q.active ? `Active wave <b>${esc(q.active)}</b>. The queue drops into the next wave when it is done.` : st.auto ? 'No active wave. The queue drops on the next clock tick.' : 'Automatic waves are off: plan them here.'}</p>
        ${can('orders.write') ? `<form class="form" data-act="wave-plan"><label>Orders<input name="orders" placeholder="all queued orders, or 4501, 4502" size="28"></label><button class="primary">Plan wave now</button></form><p class="hint">Planning by hand takes the named orders now, even when they open a box.</p>
        <form class="form" data-act="wave-config"><label><input type="checkbox" name="auto" ${st.auto ? 'checked' : ''}> Automatic</label><label>Wait at most (min)<input name="maxWaitMin" type="number" min="0" value="${st.maxWaitMin}"></label><label>Orders per wave<input name="maxOrders" type="number" min="1" value="${st.maxOrders}"></label><label>Post-pick lane<input name="postPick" value="${esc(st.postPick || '')}" placeholder="STAGE01"></label><button>Save</button></form>` : ''}</section>
        <section><h2>Queue</h2><p class="hint">Oldest first. An order joins the next wave when it drops cleanly, without opening a new box, or when it has waited the maximum time.</p>${table(['Order', 'Customer', 'Waiting', 'Next wave', 'Short'], queueRows)}</section>
        <section><h2>Recent waves</h2>${table(['Wave', 'Pallet and box picks', 'Bin picks', 'Status', 'Short', ''], rows)}</section>
        <section><h2>Open tasks</h2>${taskList(await api('GET', '/api/waves/tasks'), false)}</section>`;
    },
    async cases() {
      const [pallets, boxes] = await Promise.all([api('GET', '/api/waves/tasks?kind=pallet'), api('GET', '/api/waves/tasks?kind=case')]);
      return `<section><h2>Whole pallets</h2><p class="hint">Straight to the dock lane named on the task. Scan the pallet to confirm.</p>${taskList(pallets, true)}</section>
        ${can('stock.check') ? `<section><h2>Something wrong?</h2><form class="form" data-act="check-raise"><label>Location<input name="loc" required></label><label>What<input name="note" required size="28" placeholder="Wrong colour on the pallet"></label><button>Hold for a check</button></form></section>` : ''}
        <section><h2>Box picks</h2><p class="hint">Man-up or high-level order picker. Take whole boxes off the pallet, or the pieces from the box that is already open; the pallet stays in its slot. Drop at the post-pick lane.</p>${taskList(boxes, true)}</section>`;
    },
    async stockctl() {
      const checks = await api('GET', '/api/checks');
      const raise = can('stock.check') ? `<form class="form" data-act="check-raise"><label>Location<input name="loc" required autocomplete="off"></label><label>Order<input name="orderId" placeholder="optional"></label><label>Item<input name="itemNo" placeholder="optional"></label><label>What to check<input name="note" required size="30" placeholder="Customer got the wrong item in order 4501"></label><button class="primary">Hold for a check</button></form><p class="hint">Nothing at that location can be picked or moved until stock control has checked it. Open picks there are planned again from other stock.</p>` : '';
      const checkRows = checks.map((c) => `<section class="check"><h3>${esc(c.id)} · <b>${esc(c.loc)}</b></h3><p>${esc(c.note)}${c.orderId ? ` · order ${esc(c.orderId)}` : ''} <span class="dim">— ${esc(c.raisedBy)}</span></p>
        ${table(['Booked here', 'Item', 'Qty', can('stock.delete') ? 'Correct the item' : ''], c.stock.map((s) => `<tr><td>${s.kind === 'pallet' ? `pallet …${esc(s.sscc.slice(-6))}${s.plate ? ` <span class="dim">${esc(s.plate)}</span>` : ''}` : s.kind === 'plate' ? esc(s.plate) : 'loose in the bin'}</td><td>${esc(s.itemNo)} <span class="dim">${esc(s.name)}</span></td><td>${esc(s.qty)}</td><td>${can('stock.delete') ? `<form class="form" data-act="check-correct"><input type="hidden" name="target" value="${esc(s.kind === 'pallet' ? s.sscc : s.kind === 'plate' ? s.plate : c.loc)}"><input type="hidden" name="fromItem" value="${esc(s.kind === 'bin' ? s.itemNo : '')}"><label>Right item<input name="itemNo" required size="10" autocomplete="off"></label><label>Counted<input name="qty" type="number" min="1" value="${esc(s.qty)}" style="width:6em"></label><button class="primary">Correct</button></form>` : ''}</td></tr>`))}
        ${can('stock.adjust') ? `<form class="form" data-act="check-ok"><input type="hidden" name="id" value="${esc(c.id)}"><label>Note<input name="note" placeholder="optional" size="24"></label><button>Stock is right, release</button></form>` : ''}</section>`).join('');
      if (!can('stock.adjust') && !can('stock.create')) {
        return `<section><h2>Stock checks</h2>${raise}</section><section><h2>Open checks</h2>${checks.length ? checks.map((c) => `<p><b>${esc(c.loc)}</b> ${esc(c.note)} <span class="dim">${esc(c.id)}</span></p>`).join('') : '<p class="dim">None open</p>'}</section>`;
      }
      const reasons = '<option>recount</option><option>found</option><option>damage</option><option>expiry</option><option>correction</option><option>other</option>';
      return `<section><h2>Checks to do</h2>${checkRows || '<p class="dim">No location is held for a check.</p>'}${raise}<p class="hint">Correcting replaces the wrong item with the right one at the same place, on a new ST plate: the report shows the wrong item out and the right one in, under one correction number. <a href="/api/reports/stock-changes.csv">Stock changes CSV</a></p></section>
        <section><h2>Stock control</h2><p class="hint">Cycle counts, corrections, creating and deleting stock, stock checks, location lookups and transfers. Auto-Shift and counts run on the truck screen.</p>
        <form class="form" data-act="bin-find"><label>Pallet, item, barcode, bin or location<input name="q" required autocomplete="off"></label><button class="primary">Check</button></form><div id="binOut"></div></section>
        <div class="grid">
        ${can('moves.execute') ? `<section><h2>Transfer</h2><p class="hint">Record where a pallet really stands.</p><form class="form" data-act="stock-transfer"><label>Pallet SSCC<input name="sscc" required></label><label>To<input name="to" required></label><button class="primary">Transfer</button></form></section>` : ''}
        ${can('stock.adjust') ? `<section><h2>Correct a quantity</h2><form class="form" data-act="stock-adjust"><label>Pallet SSCC<input name="sscc" required></label><label>Quantity<input name="qty" type="number" min="0" required></label><label>Reason<select name="reason">${reasons}</select></label><button class="primary">Correct</button></form></section>` : ''}
        ${can('stock.create') ? `<section><h2>Create stock</h2><p class="hint">Stock that was found, or missed at receiving.</p><form class="form" data-act="stock-create"><label>Location<input name="code" required></label><label>Item<input name="itemNo" required></label><label>Quantity<input name="qty" type="number" min="1" required></label><label>Batch<input name="batch"></label><label>Best before<input name="expiry" type="date"></label><label>Reason<select name="reason"><option>found</option><option>correction</option><option>recount</option><option>other</option></select></label><button class="primary">Create</button></form></section>` : ''}
        ${can('stock.delete') ? `<section><h2>Delete stock</h2><p class="hint">Takes the pallet out of stock for good. The record and its history stay.</p><form class="form" data-act="stock-delete"><label>Pallet SSCC<input name="sscc" required></label><label>Reason<select name="reason"><option>damage</option><option>expiry</option><option>correction</option><option>other</option></select></label><button class="primary">Delete</button></form></section>` : ''}
        ${can('counts.execute') ? `<section><h2>Cycle counts</h2><p class="hint">Plan count jobs for the stock trucks: places with corrections and lost pallets first, then the longest since a count.</p><form class="form" data-act="plan-counts-stock"><label>How many<input name="limit" type="number" min="1" value="5"></label><button class="primary">Plan counts</button></form></section>` : ''}
        </div>`;
    },
    async bins() {
      const [list, picks] = await Promise.all([api('GET', '/api/bins'), can('picks.execute') && modOn('waves') ? api('GET', '/api/waves/tasks?kind=bin') : []]);
      const unit = '<label>Unit<input name="unit" placeholder="piece, box…" size="7"></label>';
      const what = '<label>Item or barcode<input name="code" required autocomplete="off"></label>';
      const forms = [];
      if (can('inbound.write')) forms.push(`<section><h2>Put away</h2><form class="form" data-act="bin-put"><label>Bin<input name="loc" required autocomplete="off"></label>${what}<label>Qty<input name="qty" type="number" min="1" value="1"></label>${unit}<label>Batch<input name="batch" placeholder="optional"></label><label>Best before<input name="expiry" type="date"></label><button class="primary">Put away</button></form><p class="hint">Scanning a box barcode puts in a whole box.</p></section>`);

      let dev = null;
      try { dev = await api('GET', '/api/devices/' + encodeURIComponent(id)); } catch (e) { dev = null; }
      const ins = dev && dev.instruction || {};
      const asked = (ins.pallet && ins.pallet.sscc) || ins.target || '';

        }).join('');

  function plateTable(holders) {

  }
  function taskTable(tasks, actions) {
    return table(['Job', 'Type', 'Status', 'From', 'To', ''], (tasks || []).map((t) => `<tr><td>#${t.id}</td><td>${esc(t.typeLabel)}</td><td>${t.urgent ? '<span class="tag warn">urgent</span> ' : ''}${esc(t.status)}</td><td>${esc(t.fromName || '')}</td><td>${esc(t.toName || '')}</td><td>${actions && t.status === 'open' ? `<button type="button" data-act="urgent" data-id="${t.id}">Urgent</button>` : ''}</td></tr>`));
  }
  function faultTable(faults) {
    return table(['Id', 'Equipment', 'Summary', 'Status'], (faults || []).map((f) => `<tr><td>${f.id}</td><td>${esc(f.equipmentId)}</td><td>${esc(f.summary)}</td><td>${esc(f.status)}</td></tr>`));
  }
  async function auditBits(limit) {
    const [journal, authLog] = await Promise.all([api('GET', '/api/journal?limit=' + limit), api('GET', '/api/auth-log?limit=' + limit)]);
    const rows = [
      ...journal.map((j) => ({ t: j.t, who: j.by, what: j.op })),
      ...authLog.map((j) => ({ t: j.t, who: j.by, what: 'account: ' + j.action })),
    ].sort((a, b) => b.t - a.t).slice(0, limit);
    return table(['When', 'Who', 'What'], rows.map((r) => `<tr><td>${esc(r.local || new Date(r.t).toISOString())}</td><td>${esc(r.who || '')}</td><td>${esc(r.what)}</td></tr>`));
  }
  async function operatorWork(queueOnly) {
    const devices = await api('GET', '/api/devices');
    const trucks = devices.filter((d) => d.kind !== 'desk');
    const id = sessionStorage.getItem('device') || (trucks[0] && trucks[0].id) || 'HH01';
    const dev = await api('GET', '/api/devices/' + encodeURIComponent(id));
    const tasks = await api('GET', '/api/tasks?status=open');
    const ins = dev.instruction || {};
    const job = ins.task;
    if (queueOnly) return `<section><h2>Task queue</h2>${taskTable(tasks, false)}</section>`;
    const asked = (ins.pallet && ins.pallet.sscc) || ins.target || '';
    return `<section class="big"><h2>${esc(dev.id)} · ${esc(dev.mode)}</h2>
      <p class="dim">${dev.operator ? 'Assigned to ' + esc(dev.operator) : 'No person assigned'}${dev.categories ? ' · ' + esc(dev.categories.join(', ')) : ''}</p>

      ${ins.targetName ? `<p>Go to <b>${esc(ins.targetName)}</b></p>` : ''}

      <div class="form">${(dev.modes || []).map((m) => `<button type="button" data-act="mode" data-mode="${esc(m.id)}" class="${m.id === dev.mode ? 'primary' : ''}">${esc(m.label)}</button>`).join('')}</div>
      <form class="scan" data-act="scan"><label>Scan<input name="code" id="scan" autocomplete="off" placeholder="Wedge ends with Enter"></label><input type="hidden" name="source" value="manual"><p><button class="primary">Send</button> <button type="button" id="sim" data-code="${esc(asked)}">Simulate scan</button></p></form>
      <div id="scanMsg"></div></section>
      <section><h2>Queue for this floor</h2>${taskTable(tasks.slice(0, 8), false)}</section>`;
  }

    if (name === 'tariff-save') {
      const body = { minimum: data.minimum, seasons: [] };
      if (data.effectiveFrom) body.effectiveFrom = data.effectiveFrom;
      if (data.minimumMode) body.minimumMode = data.minimumMode;
      if (data.tierScope) body.tierScope = data.tierScope;
      if (data.asNew !== '1' && data.versionId) body.versionId = data.versionId;
      for (const c of ['storage', 'inbound', 'outbound', 'val']) {
        if (c !== 'val') body[c + 'Basis'] = data[c + 'Basis'];
        body[c + 'Rate'] = data[c + 'Rate'];
        if (data[c + 'TierMode']) body[c + 'TierMode'] = data[c + 'TierMode'];
        const tiers = [];
        for (let i = 0; i < 3; i++) {
          const rate = data[c + 'Rate' + i];
          if (rate === '' || rate == null) continue;
          const upTo = data[c + 'UpTo' + i];
          tiers.push({ upTo: upTo === '' || upTo == null ? null : Number(upTo), rate: Number(rate) });
        }
        if (tiers.length) body[c + 'Tiers'] = tiers;
      }
      for (let i = 0; i < 4; i++) {
        if (!data['season' + i + 'Label']) continue;
        const row = { label: data['season' + i + 'Label'], charge: data['season' + i + 'Charge'], effect: data['season' + i + 'Effect'] };
        if (data['season' + i + 'Kind'] === 'months') row.months = String(data['season' + i + 'Months'] || '').split(/[^0-9]+/).filter(Boolean).map(Number);
        else { row.from = data['season' + i + 'From']; row.to = data['season' + i + 'To']; }
        if (row.effect === 'override' || row.effect === 'each') row.rate = data['season' + i + 'Rate'];
        else row.percent = data['season' + i + 'Percent'];
        if (row.effect === 'each') row.amount = data['season' + i + 'Rate'];
        body.seasons.push(row);
      }
      history.replaceState(null, '', '/app#tariff?client=' + encodeURIComponent(data.clientId));
      panel = 'tariff';
      return api('POST', '/api/clients/' + encodeURIComponent(data.clientId) + '/tariff', body);
    }
    if (name === 'pick-face') return api('POST', '/api/pick-faces', { code: data.code, itemNo: data.itemNo, min: Number(data.min), max: Number(data.max), trigger: data.trigger === '' ? null : Number(data.trigger), mode: data.mode });
    if (name === 'profile') return api('POST', '/api/location-profiles', data);
    if (name === 'bulk') return api('POST', '/api/locations/bulk', data);
    if (name === 'tech-sort') {
      const rules = String(data.rules || '').split(/\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const i = line.indexOf(':');
        return { category: (i < 0 ? line : line.slice(0, i)).trim(), putaway: i < 0 ? '' : line.slice(i + 1).trim() };
      });
      return api('POST', '/api/technical', { autoSort: { strategy: data.strategy, enabled: data.enabled === 'on', sameBatchTogether: data.sameBatchTogether === 'on', groundForNextOut: data.groundForNextOut === 'on', rules } });
    }
    if (name === 'tech-defaults') {
      const locationDefaults = {};
      for (const kind of ['rack', 'bin', 'mezzanine', 'virtual']) {
        locationDefaults[kind] = { heightMm: num(data[kind + '.heightMm']), widthMm: num(data[kind + '.widthMm']), depthMm: num(data[kind + '.depthMm']), maxWeightKg: num(data[kind + '.maxWeightKg']) };
      }
      return api('POST', '/api/technical', { locationDefaults });
    }
    if (name === 'tech-series') {
      const holderSeries = {};
      for (const series of ['PAL', 'MASTER', 'ST', 'INB', 'OUT']) holderSeries[series] = { prefix: data['prefix.' + series], pad: Number(data['pad.' + series]) };
      return api('POST', '/api/technical', { holderSeries });
    }
    throw new Error('Unknown action');
  }
  const num = (v) => (v === '' || v == null ? null : Number(v));
  function cleanNums(data) {
    const out = { ...data };
    for (const k of ['heightMm', 'widthMm', 'depthMm', 'maxWeightKg', 'stacks', 'stackHeight']) if (k in out) out[k] = num(out[k]);
    return out;
  }

  const DEMO_NAV_ROLES = ['administrator', 'manager', 'office', 'technician', 'inbound', 'picker', 'stock'];
  function demoUser(role) {
    const permissions = {
      administrator: ['users.read', 'users.write', 'roles.read', 'roles.write', 'settings.read', 'settings.write', 'sites.write', 'sites.switch', 'wms.read', 'wms.write', 'reports.read', 'orders.read', 'orders.write', 'outbound.read', 'outbound.write', 'inbound.read', 'inbound.write', 'picks.execute', 'putaway.execute', 'val.execute', 'labels.print', 'holders.read', 'holders.write', 'moves.execute', 'clients.read', 'tariff.write'],
      manager: ['wms.read', 'wms.write', 'reports.read', 'sites.switch', 'orders.read', 'tasks.read', 'clients.read', 'tariff.write'],
      office: ['wms.read', 'wms.write', 'reports.read', 'sites.switch', 'orders.read', 'orders.write', 'outbound.write', 'inbound.write', 'labels.print', 'clients.read', 'clients.write', 'tariff.write', 'items.read'],
      technician: ['wms.read', 'sites.switch', 'technical.write', 'labels.print'],
      inbound: ['wms.read', 'sites.switch', 'inbound.read', 'inbound.write', 'putaway.execute', 'scans.execute', 'labels.print', 'holders.write'],
      picker: ['wms.read', 'sites.switch', 'picks.execute', 'val.execute', 'outbound.write', 'orders.read', 'scans.execute', 'labels.print'],
      stock: ['wms.read', 'sites.switch', 'counts.execute', 'moves.execute', 'stock.adjust', 'stock.create', 'stock.delete', 'replenish.execute', 'movements.read', 'holders.write', 'labels.print'],
    };
    return { username: 'demo-' + role, displayName: 'Demo ' + (TITLES[role] || role), role, permissions: permissions[role] || ['wms.read'], mustChangePassword: false };
  }
  async function loadSites() {
    const pick = document.getElementById('sitePick');
    if (!pick) return;
    try {
      const data = window.SORTED_DEMO ? { current: 'MAIN', sites: [{ id: 'MAIN', name: 'Demo warehouse' }] } : await api('GET', '/api/sites');
      const label = document.getElementById('siteLabel');
      if (label) label.style.display = !modOn('sites') && (data.sites || []).length < 2 ? 'none' : '';
      pick.innerHTML = (data.sites || []).map((s) => `<option value="${esc(s.id)}" ${s.id === data.current ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
      pick.onchange = async () => {
        if (window.SORTED_DEMO) return;
        await api('POST', '/api/sites/switch', { id: pick.value });
        draw();
      };
    } catch (e) { pick.innerHTML = '<option>MAIN</option>'; }
  }
  function showDemoBar() {
    if (!window.SORTED_DEMO || document.getElementById('demoBar')) return;
    const bar = document.createElement('div');
    bar.id = 'demoBar';
    bar.style.cssText = 'background:#9a6700;color:#fff;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center';
    const role = new URLSearchParams(location.search).get('as') || 'administrator';
    bar.innerHTML = `<b>Demo</b> <span>Not a signed-in warehouse. Pick a role to look around.</span> ` + DEMO_NAV_ROLES.map((r) => `<button type="button" data-demo="${r}" style="background:${r === role ? '#fff' : 'transparent'};color:${r === role ? '#9a6700' : '#fff'};border:1px solid #fff;border-radius:8px;padding:4px 8px">${TITLES[r]}</button>`).join('');
    bar.onclick = (e) => {
      const b = e.target.closest('[data-demo]');
      if (!b) return;
      const url = new URL(location.href);
      url.searchParams.set('as', b.dataset.demo);
      location.assign(url.pathname + url.search + location.hash);
    };
    document.body.prepend(bar);
  }
  async function start() {
    if (window.SORTED_DEMO) {
      const role = new URLSearchParams(location.search).get('as') || 'administrator';
      me = demoUser(DEMO_NAV_ROLES.includes(role) ? role : 'administrator');
      showDemoBar();
      panel = (location.hash || '#').slice(1).split('?')[0];
      await draw();
      return loadSites();
    }
    const session = await api('GET', '/api/session');
    me = session.user;
    me.features = session.features || {};
    me.itemApproval = Boolean(session.itemApproval);
    if (me.mustChangePassword) {
      document.body.dataset.role = me.role;
      $('#title').textContent = 'Change password';
      $('#who').textContent = me.displayName;
      $('#main').innerHTML = `<section><h2>Choose a new password</h2><p class="hint">An administrator reset this account. The next screen opens after the password changes.</p><form class="form" id="pw"><label>Current password<input name="current" type="password" required></label><label>New password<input name="next" type="password" required minlength="8"></label><button class="primary">Save password</button></form></section>`;
      document.getElementById('pw').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        await api('POST', '/api/password', data);
        location.assign('/app');
      };
      return;
    }
    try { MODS = await api('GET', '/api/modules'); } catch (e) { MODS = null; } // a client login sees every screen it owns
    panel = (location.hash || '#').slice(1).split('?')[0];
    await draw();
    loadSites();
  }
  const realApi = api;
  api = window.SORTED_DEMO ? async function (method, path, body) {
    if (!window.SortedLocal) throw new Error('Demo data is not loaded');
    const out = await window.SortedLocal.fetch(method, path, body, { operator: me && me.username || 'demo' });
    if (out.status >= 400) throw new Error((out.body && out.body.error) || 'Request failed');
    return out.body;
  } : realApi;
  start().catch((e) => { if (!window.SORTED_DEMO) return; $('#main').innerHTML = msg(e.message, false); });
  window.addEventListener('hashchange', () => { panel = location.hash.slice(1).split('?')[0]; if (me) draw(); });
})();
</script>
</body>
