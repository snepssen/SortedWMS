<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortedWMS</title>
<style>
  :root { --bg: #f3f6f8; --card: #fff; --line: #dde3e8; --ink: #17202a; --dim: #5d6b76; --acc: #1769c2; --ok: #0f7a45; --bad: #b42318; --warn: #9a6700; --chip: #eef2f5; }
  body[data-role="administrator"] { --acc: #3d348b; }
  body[data-role="manager"] { --acc: #1769c2; }
  body[data-role="office"] { --acc: #0f6e56; }
  body[data-role="technician"] { --acc: #9a6700; }
  body[data-role="operator"] { --acc: #9a3412; }
  body[data-role="machine"] { --acc: #1d4e89; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-bottom: 3px solid var(--acc); }
  header h1 { font-size: 18px; margin: 0; }
  header .who { color: var(--dim); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button, button, .btn { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 7px 11px; cursor: pointer; text-decoration: none; }
  nav button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  button.primary { background: var(--acc); color: #fff; border-color: var(--acc); font-weight: 700; }
  main { padding: 16px; max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .hint, .dim { color: var(--dim); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 26px; }
  .kpi span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-size: 12px; }
  .form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 8px 0; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
  textarea { min-height: 64px; width: 100%; }
  .msg { padding: 8px 10px; border-radius: 8px; background: var(--chip); }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 5px; background: var(--chip); font-size: 12px; font-weight: 700; }
  .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .job { font-size: 20px; }
  .scan input { font-size: 20px; padding: 14px; width: 100%; }
  .big button, button.big { min-height: 48px; font-size: 17px; font-weight: 700; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .checks label { flex-direction: row; align-items: center; color: var(--ink); font-size: 14px; }
  a { color: var(--acc); }
  @media (max-width: 720px) { main { padding: 10px; } header h1 { font-size: 16px; } .job { font-size: 18px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">SortedWMS</h1>
  <span class="who" id="who"></span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <label id="siteLabel" class="who">Warehouse <select id="sitePick"></select></label>
  <a class="btn" href="/admin">Floor</a>
  <a class="btn" href="/handheld">Handheld</a>
  <button id="out" type="button">Sign out</button>
</header>
<main id="main"></main>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HOME = { administrator: 'users', manager: 'floor', office: 'floor', technician: 'sort', operator: 'receive', machine: 'moves' };
  const NAV = {
    administrator: [['users', 'Users'], ['roles', 'Roles'], ['sites', 'Warehouses'], ['settings', 'Settings'], ['audit', 'Audit'], ['master', 'Master data']],
    manager: [['floor', 'Floor'], ['tasks', 'Tasks'], ['exceptions', 'Exceptions'], ['tariff', 'Tariff'], ['history', 'History'], ['locations', 'Locations'], ['holders', 'Holders']],
    office: [['floor', 'Office'], ['clients', 'Clients'], ['tariff', 'Tariff'], ['items', 'Items'], ['inbound', 'Inbound'], ['outbound', 'Outbound'], ['pack', 'Packing'], ['returns', 'Returns'], ['reports', 'Reports'], ['labels', 'Labels']],
    technician: [['sort', 'Auto-sort'], ['defaults', 'Location defaults'], ['series', 'Label series'], ['hardware', 'Hardware']],
    operator: [['receive', 'Receiving'], ['mezzanine', 'Mezzanine'], ['kitting', 'Kitting']],
    machine: [['moves', 'Moves'], ['replenish', 'Replenish'], ['holders', 'License plates']],
  };
  const TITLES = { administrator: 'Administrator', manager: 'Manager / supervisor', office: 'Office', technician: 'Technical', operator: 'Operator', machine: 'Machine operator' };
  let me = null;
  let panel = '';

  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) { location.assign('/login?next=' + encodeURIComponent(location.pathname + location.search)); throw new Error('Sign in required'); }
    const type = res.headers.get('content-type') || '';
    const data = type.includes('json') ? await res.json().catch(() => ({})) : await res.text();
    if (!res.ok) throw new Error((data && data.error) || res.statusText);
    return data;
  }
  const can = (p) => me && me.permissions && me.permissions.includes(p);
  const table = (heads, rows) => `<div style="overflow-x:auto"><table><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td class="dim" colspan="${heads.length}">Nothing here</td></tr>`}</table></div>`;
  const msg = (text, ok) => `<p class="msg ${ok ? 'ok' : 'bad'}">${esc(text)}</p>`;

  function paintNav() {
    document.body.dataset.role = me.role;
    $('#title').textContent = TITLES[me.role] || 'SortedWMS';
    $('#who').textContent = `${me.displayName} · ${me.username}`;
    const items = NAV[me.role] || [['floor', 'Home']];
    if (!panel || (!items.some(([id]) => id === panel) && !PANELS[panel])) panel = HOME[me.role] || items[0][0];
    $('#nav').innerHTML = items.map(([id, label]) => `<button type="button" data-panel="${id}" class="${id === panel ? 'on' : ''}">${label}</button>`).join('');
  }

  async function draw() {
    paintNav();
    const main = $('#main');
    main.innerHTML = '<p class="dim">Loading…</p>';
    try { main.innerHTML = await (PANELS[panel] || PANELS.missing)(); }
    catch (e) { main.innerHTML = msg(e.message, false); }
  }

  const PANELS = {
    async missing() { return msg('This view is not on your role.', false); },
    async receive() {
      const [deliveries, holders] = await Promise.all([api('GET', '/api/deliveries'), api('GET', '/api/holders')]);
      const inbound = holders.filter((h) => h.series === 'INB' || (h.id || '').startsWith('INB'));
      return `<section><h2>Inbound receiving</h2><p class="hint">On foot, with a handheld. A full pallet is labelled PAL and MASTER after it is received. Lower-value lines use an INB plate.</p>
        <form class="form" data-act="issue-plates"><label>Received pallet SSCC<input name="sscc" required placeholder="18 digit SSCC"></label><button class="primary">Issue PAL + MASTER</button></form>
        <form class="form" data-act="issue-series"><input type="hidden" name="series" value="INB"><label>Item<input name="itemNo" value="Y1002"></label><label>Qty<input name="qty" type="number" value="1"></label><label>Location<input name="loc" value="DOCK-IN"></label><button>Issue INB plate</button></form>
        <h3>Open deliveries</h3>${table(['Delivery', 'Supplier', 'ASN', 'Status'], deliveries.map((d) => `<tr><td>${esc(d.id)}</td><td>${esc(d.supplier)}</td><td>${esc(d.asn || d.id)}</td><td>${esc(d.status)}</td></tr>`))}
        <h3>INB plates</h3>${plateTable(inbound)}</section>`;
    },
    async mezzanine() {
      const [locs, holders] = await Promise.all([api('GET', '/api/locations?kind=mezzanine&limit=50'), api('GET', '/api/holders')]);
      const here = holders.filter((h) => (locs.locations || []).some((l) => l.code === h.loc));
      return `<section><h2>Mezzanine picking</h2><p class="hint">Scan the license plate on the mezzanine pick face. This is a walk pick, not a truck move.</p>
        ${table(['Location', 'Name'], (locs.locations || []).map((l) => `<tr><td>${esc(l.code)}</td><td>${esc(l.name || '')}</td></tr>`))}
        ${plateTable(here)}
        <form class="scan" data-act="mezz-pick"><label>Order<input name="orderId" placeholder="4501"></label><label>Plate<input name="code" id="scan" autocomplete="off" placeholder="ST0000001"></label><label>Qty<input name="qty" type="number" min="1" placeholder="all"></label><p class="big"><button class="primary">Confirm pick</button></p></form>
        <p class="hint">A pick against an order consumes that sales-order line. Leave the order blank to record the plate only.</p><div id="scanMsg"></div></section>`;
    },
    async kitting() {
      const val = await api('GET', '/api/val');
      const open = (val.jobs || []).find((j) => j.status === 'open');
      const station = (val.stations[0] && val.stations[0].id) || 'VAL-01';
      return `<section><h2>VAL / kitting</h2><p class="hint">Scan the base product, then each component. Example: add a power plug to a laptop.</p>
        ${val.kits.map((k) => `<p><b>${esc(k.name)}</b> — base ${esc(k.base.itemNo)} × ${k.base.qty}, ${k.components.map((c) => esc(c.itemNo) + ' × ' + c.qty).join(', ')}</p>`).join('') || '<p class="dim">No kits.</p>'}
        <form class="form" data-act="work-order"><label>Work order<input name="id" placeholder="WO-1"></label><label>Kit<input name="kitId" value="${esc((val.kits[0] && val.kits[0].id) || '')}"></label><label>Qty<input name="qty" type="number" value="1"></label><label>Order<input name="orderId" placeholder="optional"></label><button>Create work order</button></form>
        <form class="form" data-act="val-start"><label>Station<input name="stationId" value="${esc(station)}"></label><label>Work order<input name="workOrderId" placeholder="optional"></label><button class="primary">Start kit</button></form>
        ${open ? `<p>Open job #${open.id} ${esc(open.kitName)}. Scanned ${open.got.length} / ${open.need.reduce((n, l) => n + l.qty, 0)}.</p><ul>${open.need.map((n) => `<li>${esc(n.role)} ${esc(n.itemNo)} × ${n.qty}</li>`).join('')}</ul>` : '<p class="dim">No kit in progress.</p>'}
        <form class="scan" data-act="val-scan"><input type="hidden" name="stationId" value="${esc(station)}"><label>Scan component or plate<input name="code" placeholder="NB-14 or PLUG-EU"></label><p class="big"><button class="primary">Scan</button></p></form></section>`;
    },
    async pack() {
      const orders = await api('GET', '/api/orders');
      const open = orders.filter((o) => o.status !== 'shipped');
      return `<section><h2>Packing bench</h2><p class="hint">Scan a pick into an OUT carton, record the size and weight, then send the closed cartons to dispatch.</p>
        <form class="form" data-act="open-carton"><label>Order<input name="orderId" required placeholder="4501"></label><button class="primary">Open carton</button></form>
        <form class="form" data-act="pack-into"><label>Carton<input name="carton" placeholder="OUT0000001" required></label><label>Picked plate<input name="code" required></label><label>Qty<input name="qty" type="number" value="1"></label><button>Pack</button></form>
        <form class="form" data-act="close-carton"><label>Carton<input name="carton" required></label><label>L mm<input name="lengthMm" type="number" value="400"></label><label>W mm<input name="widthMm" type="number" value="300"></label><label>H mm<input name="heightMm" type="number" value="200"></label><label>kg<input name="weightKg" type="number" value="2.5" step="0.1"></label><button>Close and print</button></form>
        <form class="form" data-act="dispatch-cartons"><label>Order<input name="orderId" required></label><button>Dispatch cartons</button></form>
        <h3>One shipment</h3><p class="hint">Pallets and cartons on the same order share one delivery note and one load manifest. Scan every holder, then dispatch.</p>
        <form class="form" data-act="stage-ship"><label>Order<input name="orderId" required></label><label>Truck<input name="truck" placeholder="HH01"></label><button class="primary">Stage shipment</button></form>
        <form class="form" data-act="scan-ship"><label>Order<input name="orderId" required></label><label>Holder<input name="code" required placeholder="SSCC or OUT plate"></label><button>Confirm on load</button></form>
        <form class="form" data-act="dispatch-ship"><label>Order<input name="orderId" required></label><button>Dispatch shipment</button></form>
        ${table(['Order', 'Customer', 'Status'], open.slice(0, 12).map((o) => `<tr><td>${esc(o.id)}</td><td>${esc(o.customer)}</td><td>${esc(o.status)}</td></tr>`))}</section>`;
    },
    async returns() {
      const [rows, orders] = await Promise.all([api('GET', '/api/returns'), api('GET', '/api/orders')]);
      return `<section><h2>Returns</h2><p class="hint">Receive against an order at a virtual return location, then grade the goods: restock, quarantine or scrap.</p>
        <form class="form" data-act="return-receive"><label>RMA<input name="id" required placeholder="RMA-1"></label><label>Order<input name="orderId" required></label><label>Item<input name="itemNo" required></label><label>Qty<input name="qty" type="number" value="1"></label><label>At<input name="loc" value="RETURNS"></label><button class="primary">Receive</button></form>
        <form class="form" data-act="return-grade"><label>RMA<input name="id" required></label><label>Grade<select name="grade"><option>restock</option><option>quarantine</option><option>scrap</option></select></label><label>To<input name="to" placeholder="location, except scrap"></label><button>Grade</button></form>
        ${table(['RMA', 'Order', 'Item', 'Qty', 'Status'], (rows || []).map((r) => `<tr><td>${esc(r.id)}</td><td>${esc(r.orderId)}</td><td>${esc(r.itemNo)}</td><td>${esc(r.qty)}</td><td>${esc(r.status)}</td></tr>`))}
        <p class="dim">${orders.filter((o) => o.status === 'shipped').length} shipped order(s) can take a return.</p></section>`;
    },
    async sites() {
      const data = await api('GET', '/api/sites');
      return `<section><h2>Warehouses</h2><p class="hint">Each site has its own stock and its own plate counters. People can be limited to some sites. Shipping a transfer parks the original plate at IN-TRANSIT until the other site receives it.</p>
        <p>Current warehouse: <b>${esc(data.current)}</b></p>
        ${table(['Id', 'Name'], (data.sites || []).map((s) => `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td></tr>`))}
        <form class="form" data-act="site-add"><label>Id<input name="id" required placeholder="NORTH"></label><label>Name<input name="name" placeholder="North store"></label><label>Country<input name="country" value="BE" maxlength="2"></label><label>Timezone<input name="timeZone" value="Europe/Brussels"></label><label>Preset<select name="preset"><option value="">none</option><option>chilled-dc</option><option>high-value</option><option>home-garage</option><option>small-maker</option></select></label><button class="primary">Add warehouse</button></form>
        <form class="form" data-act="site-transfer"><label>Item<input name="itemNo" required></label><label>Qty<input name="qty" type="number" value="1"></label><label>To<input name="to" required placeholder="NORTH"></label><button>Ship in transit</button></form>
        <form class="form" data-act="site-receive"><label>Transfer<input name="id" required placeholder="TR1"></label><label>From<input name="from" value="MAIN"></label><label>To<input name="to" required></label><button>Receive</button></form>
        <form class="form" data-act="site-cancel"><label>Transfer<input name="id" required></label><button>Refuse and return</button></form>
        <p class="hint">A refusal puts the quantity back on the original plate. Nothing new is minted on the source.</p></section>`;
    },
    async moves() {
      const [tasks, devices] = await Promise.all([api('GET', '/api/tasks'), api('GET', '/api/devices')]);
      const trucks = devices.filter((d) => d.kind !== 'desk');
      const moves = tasks.filter((t) => ['PUTAWAY', 'SHIFT', 'MOVE', 'PICK'].includes(t.type));
      const id = sessionStorage.getItem('device') || (trucks.find((t) => t.operator === me.username) || trucks[0] || {}).id || 'HH01';
      let dev = null;
      try { dev = await api('GET', '/api/devices/' + encodeURIComponent(id)); } catch (e) { dev = null; }
      const ins = dev && dev.instruction || {};
      const asked = (ins.pallet && ins.pallet.sscc) || ins.target || '';
      return `<section><h2>Equipment moves</h2><p class="hint">Reach truck or high-level order picker. The screen is the next move: put-away, replenishment, transfer, pallet move, block lane.</p>
        <form class="form"><label>Truck<select id="devicePick">${trucks.map((t) => `<option ${t.id === id ? 'selected' : ''}>${esc(t.id)}</option>`).join('')}</select></label></form>
        <p class="job">${ins.task ? esc(ins.task.typeLabel) : 'Waiting for the next move'}</p>
        ${ins.targetName ? `<p>Drop at <b>${esc(ins.targetName)}</b></p>` : ''}
        ${ins.pallet ? `<p>Plate / pallet …${esc(ins.pallet.sscc.slice(-6))} ${esc(ins.pallet.itemNo || '')}</p>` : ''}
        <form class="scan" data-act="scan"><label>Scan<input name="code" id="scan" autocomplete="off" placeholder="Pallet, then location"></label><p class="big"><button class="primary">Send</button> <button type="button" id="sim" data-code="${esc(asked)}">Simulate scan</button></p></form>
        <div id="scanMsg"></div></section>
        <section><h2>Move queue</h2>${taskTable(moves.slice(0, 14), false)}</section>`;
    },
    async replenish() {
      const locs = await api('GET', '/api/locations?kind=mezzanine&limit=20');
      return `<section><h2>Replenishment and transfers</h2><p class="hint">Send stock from bulk to a pick face, or consolidate partial pallets at CONSO00.</p>
        <form class="form" data-act="pick-face"><label>Pick face<input name="code" value="${esc((locs.locations[0] && locs.locations[0].code) || 'MEZZ-A1')}"></label><label>Item<input name="itemNo" value="Y1001"></label><label>Min<input name="min" type="number" value="2"></label><label>Trigger<input name="trigger" type="number" value="4"></label><label>Max<input name="max" type="number" value="12"></label><label>Mode<select name="mode"><option value="units">units to max</option><option value="pallet">whole pallet</option></select></label><button>Save min / max</button></form>
        <form class="form" data-act="plan-replen"><button class="primary">Queue replenishment</button></form>
        <form class="form" data-act="replenish"><label>Item<input name="itemNo" value="Y1001"></label><label>To<input name="to" value="${esc((locs.locations[0] && locs.locations[0].code) || 'MEZZ-A1')}"></label><button>Replenish one pallet</button></form>
        <form class="form" data-act="consolidate"><label>PAL plates<textarea name="pals" placeholder="PAL0000001 PAL0000002"></textarea></label><label>At<input name="at" value="CONSO00"></label><label>Keep MASTER<input name="master" placeholder="blank = earliest"></label><button>Consolidate</button></form>
        <p class="hint">The earliest MASTER survives unless you name another MASTER already on these pallets. The other MASTER plates are retired and their numbers are not reused.</p></section>`;
    },
    async sort() {
      const tech = await api('GET', '/api/technical');
      const s = tech.autoSort || {};
      const rules = (s.rules || []).map((r) => `${r.category || ''}: ${r.putaway || ''}`).join('\n');
      return `<section><h2>Auto-sort</h2><p class="hint">Parameters the WMS technical team owns. Stock administration does not change these.</p>
        <form data-act="tech-sort"><label>Strategy<select name="strategy"><option ${s.strategy === 'fefo' ? 'selected' : ''}>fefo</option><option ${s.strategy === 'fifo' ? 'selected' : ''}>fifo</option><option ${s.strategy === 'nearest' ? 'selected' : ''}>nearest</option></select></label>
        <label><input type="checkbox" name="enabled" ${s.enabled !== false ? 'checked' : ''}> Enabled</label>
        <label><input type="checkbox" name="sameBatchTogether" ${s.sameBatchTogether !== false ? 'checked' : ''}> Keep the same batch together</label>
        <label><input type="checkbox" name="groundForNextOut" ${s.groundForNextOut !== false ? 'checked' : ''}> Next-out stock to ground</label>
        <label>Rules, one per line (CATEGORY: instruction)<textarea name="rules">${esc(rules)}</textarea></label>
        <p><button class="primary">Save auto-sort</button></p></form></section>`;
    },
    async defaults() {
      const tech = await api('GET', '/api/technical');
      const d = tech.locationDefaults || {};
      const row = (kind) => {
        const x = d[kind] || {};
        return `<tr><td>${kind}</td><td><input name="${kind}.heightMm" type="number" value="${x.heightMm == null ? '' : esc(x.heightMm)}"></td><td><input name="${kind}.widthMm" type="number" value="${x.widthMm == null ? '' : esc(x.widthMm)}"></td><td><input name="${kind}.depthMm" type="number" value="${x.depthMm == null ? '' : esc(x.depthMm)}"></td><td><input name="${kind}.maxWeightKg" type="number" value="${x.maxWeightKg == null ? '' : esc(x.maxWeightKg)}"></td></tr>`;
      };
      return `<section><h2>Location defaults</h2><p class="hint">Dimension and capacity defaults by location type. Virtual locations such as CONSO00 have no physical size unless you set one.</p>
        <form data-act="tech-defaults"><table><tr><th>Type</th><th>H mm</th><th>W mm</th><th>D mm</th><th>Max kg</th></tr>${['rack', 'bin', 'mezzanine', 'virtual'].map(row).join('')}</table>
        <p><button class="primary">Save defaults</button></p></form>
        <p class="dim">Types: zone, aisle, rack, level, bin, mezzanine, virtual (consolidation, staging), block lane.</p></section>`;
    },
    async series() {
      const tech = await api('GET', '/api/technical');
      const rows = Object.entries(tech.holderSeries || {}).map(([k, s]) => `<tr><td>${esc(k)}</td><td><input name="prefix.${k}" value="${esc(s.prefix)}"></td><td><input name="pad.${k}" type="number" min="1" max="12" value="${esc(s.pad)}"></td><td>${esc(s.prefix)}${String(s.next).padStart(s.pad, '0')}</td><td>${esc(s.next)}</td></tr>`).join('');
      return `<section><h2>License plate series</h2><p class="hint">PAL and MASTER for full pallets. ST, INB and OUT for lower-value stock. Numbers only increase and are never reused.</p>
        <form data-act="tech-series"><table><tr><th>Series</th><th>Prefix</th><th>Pad</th><th>Next id</th><th>Counter</th></tr>${rows}</table>
        <p><button class="primary">Save format</button></p></form></section>${await PANELS.hardware()}`;
    },
    async history() {
      const [users, movements] = await Promise.all([can('users.read') ? api('GET', '/api/users') : { users: [] }, api('GET', '/api/movements')]);

    async tariff() {
      const clients = await api('GET', '/api/clients?archived=1');
      const params = new URLSearchParams((location.hash.split('?')[1]) || '');
      const clientId = params.get('client') || (clients.find((c) => c.status !== 'archived') || clients[0] || {}).id || '';
      const client = clientId ? await api('GET', '/api/clients/' + encodeURIComponent(clientId)) : null;
      const versions = (client && client.tariffVersions) || [];
      const latest = versions[versions.length - 1] || null;
      const editing = Boolean(latest && !latest.readOnly);
      const today = new Date().toISOString().slice(0, 10);
      const from = params.get('from') || (today.slice(0, 8) + '01');
      const to = params.get('to') || today;
      const card = latest || {};
      const writable = can('tariff.write');
      const opt = (values, current) => values.map((v) => `<option value="${esc(v.id)}" ${v.id === current ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
      const basis = (name, values, current) => `<label>Basis<select name="${name}Basis">${values.map((v) => `<option ${v === (current || values[0]) ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`;
      const tierRows = (charge) => {
        const tiers = card[charge + 'Tiers'] || [];
        return [0, 1, 2].map((i) => {
          const tier = tiers[i] || {};
          const upTo = tier.upTo == null || tier.rate == null ? '' : tier.upTo;
          const rate = tier.rate == null ? '' : tier.rate;
          return `<tr><td><input name="${charge}UpTo${i}" type="number" min="0" step="0.01" value="${esc(upTo)}" placeholder="${i === 2 ? 'and above' : ''}"></td><td><input name="${charge}Rate${i}" type="number" min="0" step="0.01" value="${esc(rate)}"></td></tr>`;
        }).join('');
      };
      const chargeBlock = (title, charge, bases) => {
        const mode = card[charge + 'TierMode'] || '';
        const rateName = charge === 'val' ? 'valRate' : charge + 'Rate';
        const rate = card[rateName] == null ? '' : card[rateName];
        return `<h3>${title}</h3><div class="form">${bases ? basis(charge, bases, card[charge + 'Basis']) : ''}<label>Flat rate<input name="${rateName}" type="number" min="0" step="0.01" value="${esc(rate)}"></label><label>Tiers<select name="${charge}TierMode"><option value="" ${mode ? '' : 'selected'}>Flat rate</option><option value="all" ${mode === 'all' ? 'selected' : ''}>All units at the tier rate</option><option value="graduated" ${mode === 'graduated' ? 'selected' : ''}>Graduated bands</option></select></label></div><table><tr><th>Up to</th><th>Rate</th></tr>${tierRows(charge)}</table>`;
      };
      const seasonCharge = (s) => {
        const keys = Object.keys((s && s.charges) || {});
        if (keys.length === 4) return 'all';
        return keys[0] || 'storage';
      };
      const seasonRows = [0, 1, 2, 3].map((i) => {
        const s = (card.seasons || [])[i] || {};
        const charge = seasonCharge(s.charges ? s : null);
        const spec = (s.charges && (s.charges[charge === 'all' ? 'storage' : charge])) || {};
        const kind = s.months ? 'months' : 'dates';
        const effectValue = spec.amount != null ? 'each' : (spec.effect === 'override' ? 'override' : 'surcharge');
        return `<tr>
          <td><input name="season${i}Label" autocomplete="off" value="${esc(s.label || '')}" placeholder="Name"></td>
          <td><select name="season${i}Charge">${opt([{ id: 'storage', label: 'Storage' }, { id: 'inbound', label: 'Inbound' }, { id: 'outbound', label: 'Outbound' }, { id: 'val', label: 'VAL' }, { id: 'all', label: 'All charges' }], s.label ? charge : 'storage')}</select></td>
          <td><select name="season${i}Kind"><option value="dates" ${kind === 'dates' ? 'selected' : ''}>Dates</option><option value="months" ${kind === 'months' ? 'selected' : ''}>Months each year</option></select></td>
          <td><input name="season${i}From" type="date" value="${esc(s.from || '')}"></td>
          <td><input name="season${i}To" type="date" value="${esc(s.to || '')}"></td>
          <td><input name="season${i}Months" autocomplete="off" value="${esc((s.months || []).join(', '))}" placeholder="1–12"></td>
          <td><select name="season${i}Effect"><option value="surcharge" ${effectValue === 'surcharge' ? 'selected' : ''}>Surcharge %</option><option value="each" ${effectValue === 'each' ? 'selected' : ''}>Surcharge per unit</option><option value="override" ${effectValue === 'override' ? 'selected' : ''}>Replace rate</option></select></td>
          <td><input name="season${i}Percent" type="number" min="0" step="0.01" value="${esc(spec.percent == null ? '' : spec.percent)}"></td>
          <td><input name="season${i}Rate" type="number" min="0" step="0.01" value="${esc(spec.rate == null ? '' : spec.rate)}"></td>
        </tr>`;
      }).join('');
      let preview = '';
      if (params.get('preview') === '1' && clientId) {
        try {
          const q = new URLSearchParams({ clientId });
          if (from) q.set('from', from);
          if (to) q.set('to', to);
          const inv = await api('GET', '/api/reports/invoice?' + q.toString());
          preview = `<h3>Preview ${esc(inv.periodFrom || '')} to ${esc(inv.periodTo || '')}</h3>${table(['Charge', 'Qty', 'Rate', 'Tier', 'Season', 'Version', 'Amount'], inv.lines.map((l) => `<tr><td>${esc(l.label)}</td><td>${esc(l.qty)}</td><td>${esc(l.rate)}</td><td>${esc(l.tier || '')}</td><td>${esc(l.season || '')}</td><td>${esc(l.version || '')}</td><td>${esc(l.amount)}</td></tr>`))}<p>Subtotal ${esc(inv.subtotal)}. Minimum ${esc(inv.minimum)}${inv.minimumVersion ? ` (${esc(inv.minimumVersion)})` : ''}. <b>Total ${esc(inv.total)}</b></p>`;
        } catch (e) { preview = msg(e.message, false); }
      }
      const tooWide = latest && (['storage', 'inbound', 'outbound', 'val'].some((c) => (latest[c + 'Tiers'] || []).length > 3) || (latest.seasons || []).length > 4);
      const versionTable = table(['Version', 'Effective', 'Saved by', 'Status'], versions.map((v) => `<tr><td>${esc(v.id)}</td><td>${esc(v.effectiveFrom || 'From the start')}</td><td>${esc(v.updatedBy || v.createdBy || '')}</td><td>${v.readOnly ? '<span class="tag">Read-only</span>' : '<span class="tag">Current</span>'}</td></tr>`));
      const editor = writable ? `<form data-act="tariff-save" autocomplete="off">

  }
  function taskTable(tasks, actions) {
    return table(['Job', 'Type', 'Status', 'From', 'To', ''], (tasks || []).map((t) => `<tr><td>#${t.id}</td><td>${esc(t.typeLabel)}</td><td>${t.urgent ? '<span class="tag warn">urgent</span> ' : ''}${esc(t.status)}</td><td>${esc(t.fromName || '')}</td><td>${esc(t.toName || '')}</td><td>${actions && t.status === 'open' ? `<button type="button" data-act="urgent" data-id="${t.id}">Urgent</button>` : ''}</td></tr>`));

    return table(['Id', 'Equipment', 'Summary', 'Status'], (faults || []).map((f) => `<tr><td>${f.id}</td><td>${esc(f.equipmentId)}</td><td>${esc(f.summary)}</td><td>${esc(f.status)}</td></tr>`));
  }
  async function auditBits(limit) {
    const [journal, authLog] = await Promise.all([api('GET', '/api/journal?limit=' + limit), api('GET', '/api/auth-log?limit=' + limit)]);
    const rows = [
      ...journal.map((j) => ({ t: j.t, who: j.by, what: j.op })),
      ...authLog.map((j) => ({ t: j.t, who: j.by, what: 'account: ' + j.action })),
    ].sort((a, b) => b.t - a.t).slice(0, limit);
    return table(['When', 'Who', 'What'], rows.map((r) => `<tr><td>${esc(r.local || new Date(r.t).toISOString())}</td><td>${esc(r.who || '')}</td><td>${esc(r.what)}</td></tr>`));

  async function operatorWork(queueOnly) {
    const devices = await api('GET', '/api/devices');
    const trucks = devices.filter((d) => d.kind !== 'desk');
    const id = sessionStorage.getItem('device') || (trucks[0] && trucks[0].id) || 'HH01';
    const dev = await api('GET', '/api/devices/' + encodeURIComponent(id));
    const tasks = await api('GET', '/api/tasks?status=open');
    const ins = dev.instruction || {};
    const job = ins.task;
    if (queueOnly) return `<section><h2>Task queue</h2>${taskTable(tasks, false)}</section>`;
    const asked = (ins.pallet && ins.pallet.sscc) || ins.target || '';
    return `<section class="big"><h2>${esc(dev.id)} · ${esc(dev.mode)}</h2>
      <p class="dim">${dev.operator ? 'Assigned to ' + esc(dev.operator) : 'No person assigned'}${dev.categories ? ' · ' + esc(dev.categories.join(', ')) : ''}</p>

      <section><h2>Queue for this floor</h2>${taskTable(tasks.slice(0, 8), false)}</section>`;

  $('#nav').onclick = (e) => {
    const b = e.target.closest('[data-panel]');
    if (!b) return;
    panel = b.dataset.panel;
    history.replaceState(null, '', '/app#' + panel);
    draw();
  };
  $('#out').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.assign('/login'); };
  $('#main').onclick = async (e) => {
    const b = e.target.closest('[data-act], #sim, #stationPick, #devicePick');
    if (!b) return;
    try {
      if (b.id === 'devicePick') return;
      if (b.id === 'stationPick') { sessionStorage.setItem('station', b.value); return draw(); }
      if (b.id === 'sim') { await sendScan(b.dataset.code, 'simulated', sessionStorage.getItem('device') || 'HH01'); return; }
      if (b.dataset.act === 'sim-station') {
        const code = prompt('Simulated scan code');
        if (code) await sendStation(code, 'simulated');
        return;
      }
      const act = b.dataset.act;
      if (act === 'user-save' || act === 'user-off') {
        const id = b.dataset.id;
        const role = document.querySelector(`[data-role-for="${id}"]`).value;
        const users = (await api('GET', '/api/users')).users;
        const u = users.find((x) => String(x.id) === String(id));
        await api('POST', '/api/users/' + id, { role, active: act === 'user-off' ? !u.active : u.active });
        return draw();
      }
      if (act === 'user-reset') {
        const reset = await api('POST', '/api/users/' + b.dataset.id + '/reset-password', {});
        $('#main').insertAdjacentHTML('afterbegin', msg(`Temporary password for ${reset.username}: ${reset.temporaryPassword}. They must change it at the next sign-in.`, true));
        return;
      }
      if (act === 'item-archive') { await api('POST', '/api/items/' + encodeURIComponent(b.dataset.id) + '/archive', {}); return draw(); }
      if (act === 'loc-del') { await api('POST', '/api/locations/' + encodeURIComponent(b.dataset.id) + '/delete', {}); return draw(); }
      if (act === 'holder-del') { await api('POST', '/api/holders/' + encodeURIComponent(b.dataset.id) + '/remove', {}); return draw(); }
      if (act === 'urgent') { await api('POST', '/api/tasks/' + b.dataset.id + '/urgent', { urgent: true }); return draw(); }
      if (act === 'mode') { await api('POST', '/api/devices/' + encodeURIComponent(sessionStorage.getItem('device') || 'HH01') + '/mode', { mode: b.dataset.mode }); return draw(); }
    } catch (err) { $('#main').insertAdjacentHTML('afterbegin', msg(err.message, false)); }
  };
  $('#main').onchange = (e) => {
    if (e.target.id === 'devicePick') { sessionStorage.setItem('device', e.target.value); draw(); }
    if (e.target.id === 'stationPick') { sessionStorage.setItem('station', e.target.value); draw(); }
    if (e.target.id === 'rolePick') { location.hash = 'roles?role=' + e.target.value; panel = 'roles'; draw(); }
    if (e.target.id === 'tariffClient') { history.replaceState(null, '', '/app#tariff?client=' + encodeURIComponent(e.target.value)); panel = 'tariff'; draw(); }
    if (e.target.id === 'countryPick') {
      const zone = e.target.selectedOptions[0] && e.target.selectedOptions[0].dataset.zone;
      const field = document.getElementById('timeZone');
      if (zone && field) field.value = zone;
    }
  };
  $('#main').onsubmit = async (e) => {
    const form = e.target;
    if (!form.dataset.act) return;
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      if (form.dataset.act === 'tariff-preview') {
        const q = new URLSearchParams({ client: data.clientId, from: data.from || '', to: data.to || '', preview: '1' });
        history.replaceState(null, '', '/app#tariff?' + q.toString());
        panel = 'tariff';
        draw();
        return;
      }
      if (form.dataset.act === 'tariff-save') data.asNew = (e.submitter && e.submitter.dataset.new) || '';
      if (form.dataset.act === 'history') {
      const q = new URLSearchParams();
      if (data.user) q.set('user', data.user);
      if (data.holder) q.set('holder', data.holder);
      document.getElementById('historyOut').innerHTML = moveTable(await api('GET', '/api/movements?' + q.toString()));
      return;
    }
    if (form.dataset.act === 'mezz-scan') {
      await api('POST', '/api/holders/' + encodeURIComponent(data.code) + '/pick', {});
      const el = document.getElementById('scanMsg');
      if (el) el.innerHTML = msg('Picked ' + data.code, true);
      return;
    }
    if (form.dataset.act === 'scan') return sendScan(data.code, wedgeBurst ? 'wedge' : 'manual', sessionStorage.getItem('device') || 'HH01');
      if (form.dataset.act === 'station-scan') return sendStation(data.code, wedgeBurst ? 'wedge' : 'manual');
      await act(form.dataset.act, data);
      form.reset();
      draw();
    } catch (err) { form.insertAdjacentHTML('beforebegin', msg(err.message, false)); }
  };

  let wedgeBurst = false;
  let lastKey = 0;
  document.addEventListener('keydown', (ev) => {
    const scan = document.getElementById('scan');
    if (!scan || document.activeElement !== scan) return;
    const now = Date.now();
    if (ev.key === 'Enter') return;
    if (ev.key.length === 1) wedgeBurst = now - lastKey < 40;
    lastKey = now;
  });

  async function sendScan(code, source, deviceId) {
    if (!code) throw new Error('Nothing to scan');
    const out = await api('POST', '/api/hardware/scan', { code, source, deviceId });
    const text = (out.result && (out.result.text || out.result.message)) || 'Scanned';
    const el = document.getElementById('scanMsg');
    if (el) el.innerHTML = msg(`${source}: ${text}`, out.result ? out.result.ok !== false : true);
    else draw();
    setTimeout(draw, 400);
  }
  async function sendStation(code, source) {
    const stationId = sessionStorage.getItem('station') || 'PRESS';
    const out = await api('POST', '/api/hardware/scan', { code, source, stationId });
    const text = (out.result && out.result.text) || 'Scanned';
    const el = document.getElementById('scanMsg');
    if (el) el.innerHTML = msg(`${source}: ${text}`, out.result ? out.result.ok !== false : true);
  }
  async function act(name, data) {
    if (name === 'user-create') return api('POST', '/api/users', data);
    if (name === 'role-save') {
      const permissions = [...document.querySelectorAll('input[name=perm]:checked')].map((n) => n.value);
      return api('POST', '/api/roles/' + data.role, { permissions });
    }
    if (name === 'config') return api('POST', '/api/config', { aisleCap: Number(data.aisleCap) });
    if (name === 'place') return api('POST', '/api/config', { country: data.country, timeZone: data.timeZone });
    if (name === 'hw-mode') return api('POST', '/api/hardware/mode', data);
    if (name === 'assign') return api('POST', '/api/devices/' + encodeURIComponent(data.id) + '/operator', { operator: data.operator });
    if (name === 'client-add') return api('POST', '/api/clients', data);
    if (name === 'item-add') return api('POST', '/api/items', { ...data, palletQty: Number(data.palletQty || 1), lengthMm: num(data.lengthMm), widthMm: num(data.widthMm), heightMm: num(data.heightMm), weightKg: num(data.weightKg), clientId: data.clientId || null, gtin: data.gtin || null });
    if (name === 'asn') return api('POST', '/api/deliveries', { ...data, pallets: Number(data.pallets || 1), clientId: data.clientId || null });
    if (name === 'order') return api('POST', '/api/orders', { id: data.id, customer: data.customer, lane: data.lane, lines: [{ itemNo: data.itemNo, pallets: Number(data.pallets || 1) }] });
    if (name === 'pack') return api('POST', '/api/orders/' + encodeURIComponent(data.id) + '/pack', { note: data.note });
    if (name === 'label-pallet' || name === 'label-master') {
      const path = name === 'label-master' ? '/api/labels/master' : '/api/labels/pallet';
      const body = name === 'label-master' ? { title: data.title, children: String(data.children || '').split(/\s+/).filter(Boolean) } : { ...data, qty: data.qty ? Number(data.qty) : undefined };
      const label = await api('POST', path, body);
      const slot = document.getElementById('labelOut');
      if (slot) slot.innerHTML = `<p class="msg ok">Label ${esc(label.sscc)}</p><p><a href="/api/labels/${label.id}/html" target="_blank">Open printable label</a> · <a href="/api/labels/${label.id}/zpl" target="_blank">ZPL</a></p>`;
      return label;
    }
    if (name === 'loc-add') return api('POST', '/api/locations', cleanNums(data));
    if (name === 'loc-cap') return api('POST', '/api/locations/' + encodeURIComponent(data.code) + '/capacity', cleanNums(data));
    if (name === 'holder-add') return api('POST', '/api/holders', data);
    if (name === 'holder-move') return api('POST', '/api/holders/' + encodeURIComponent(data.id) + '/move', { loc: data.loc });
    if (name === 'holder-load') return api('POST', '/api/holders/' + encodeURIComponent(data.id) + '/load', { itemNo: data.itemNo || undefined, qty: data.qty ? Number(data.qty) : undefined, sscc: data.sscc || undefined });
    if (name === 'fault') return api('POST', '/api/equipment/' + encodeURIComponent(data.equipmentId) + '/fault', data);
    if (name === 'fault-close') return api('POST', '/api/faults/' + encodeURIComponent(data.id) + '/close', { note: data.note });
    if (name === 'maint') return api('POST', '/api/equipment/' + encodeURIComponent(data.equipmentId) + '/maintenance', data);
    if (name === 'test-print') return api('POST', '/api/hardware/print', { printer: 'SIM', zpl: data.zpl, html: '<p>SortedWMS test</p>', kind: 'test' });
    if (name === 'plan-counts') return api('POST', '/api/plan/counts', { limit: Number(data.limit || 3) });
    if (name === 'issue-plates') return api('POST', '/api/holders/issue', { sscc: data.sscc });
    if (name === 'issue-series') return api('POST', '/api/holders/series', { series: data.series, itemNo: data.itemNo, qty: Number(data.qty), loc: data.loc });
    if (name === 'replenish') return api('POST', '/api/replenish', data);
    if (name === 'consolidate') return api('POST', '/api/consolidate', { pals: String(data.pals || '').split(/\s+/).filter(Boolean), at: data.at, master: data.master || null });
    if (name === 'val-start') return api('POST', '/api/val/start', { stationId: data.stationId, workOrderId: data.workOrderId || null });
    if (name === 'val-scan') return api('POST', '/api/val/scan', data);
    if (name === 'work-order') return api('POST', '/api/work-orders', { id: data.id, kitId: data.kitId, qty: Number(data.qty || 1), orderId: data.orderId || null });
    if (name === 'mezz-pick') return api('POST', '/api/holders/' + encodeURIComponent(data.code) + '/pick', { orderId: data.orderId || null, qty: data.qty ? Number(data.qty) : null });
    if (name === 'open-carton') return api('POST', '/api/orders/' + encodeURIComponent(data.orderId) + '/carton', {});
    if (name === 'pack-into') return api('POST', '/api/cartons/' + encodeURIComponent(data.carton) + '/pack', { code: data.code, qty: Number(data.qty || 1) });
    if (name === 'close-carton') return api('POST', '/api/cartons/' + encodeURIComponent(data.carton) + '/close', { lengthMm: Number(data.lengthMm), widthMm: Number(data.widthMm), heightMm: Number(data.heightMm), weightKg: Number(data.weightKg) });
    if (name === 'dispatch-cartons') return api('POST', '/api/orders/' + encodeURIComponent(data.orderId) + '/dispatch-cartons', {});
    if (name === 'plan-replen') return api('POST', '/api/replenishment/plan', {});
    if (name === 'return-receive') return api('POST', '/api/returns', { id: data.id, orderId: data.orderId, itemNo: data.itemNo, qty: Number(data.qty), loc: data.loc });
    if (name === 'return-grade') return api('POST', '/api/returns/' + encodeURIComponent(data.id) + '/grade', { grade: data.grade, to: data.to || null });
    if (name === 'site-add') return api('POST', '/api/sites', { id: data.id, name: data.name, preset: data.preset || null, country: data.country || null, timeZone: data.timeZone || null });
    if (name === 'space') {
      const spaces = data.scope ? [{ scope: data.scope, cell: data.cell, aisle: data.aisle, bay: data.bay, pos: data.pos, level: data.level, fee: Number(data.fee || 0) }] : [];
      history.replaceState(null, '', '/app#tariff?client=' + encodeURIComponent(data.clientId));
      panel = 'tariff';
      return api('POST', '/api/clients/' + encodeURIComponent(data.clientId) + '/space', { spaces });
    }
    if (name === 'site-transfer') return api('POST', '/api/sites/transfer', { itemNo: data.itemNo, qty: Number(data.qty), to: data.to });
    if (name === 'site-receive') return api('POST', '/api/sites/transfers/' + encodeURIComponent(data.id) + '/receive', { from: data.from, to: data.to });
    if (name === 'site-cancel') return api('POST', '/api/sites/transfers/' + encodeURIComponent(data.id) + '/cancel', {});
    if (name === 'stage-ship') return api('POST', '/api/orders/' + encodeURIComponent(data.orderId) + '/shipment', { truck: data.truck || null });
    if (name === 'scan-ship') return api('POST', '/api/orders/' + encodeURIComponent(data.orderId) + '/shipment/scan', { code: data.code });
    if (name === 'dispatch-ship') return api('POST', '/api/orders/' + encodeURIComponent(data.orderId) + '/shipment/dispatch', {});
    if (name === 'tariff') return api('POST', '/api/clients/' + encodeURIComponent(data.clientId) + '/tariff', data);
    if (name === 'tariff-save') {
      const body = { minimum: data.minimum, seasons: [] };
      if (data.effectiveFrom) body.effectiveFrom = data.effectiveFrom;
      if (data.minimumMode) body.minimumMode = data.minimumMode;
      if (data.tierScope) body.tierScope = data.tierScope;
      if (data.asNew !== '1' && data.versionId) body.versionId = data.versionId;
      for (const c of ['storage', 'inbound', 'outbound', 'val']) {
        if (c !== 'val') body[c + 'Basis'] = data[c + 'Basis'];
        body[c + 'Rate'] = data[c + 'Rate'];
        if (data[c + 'TierMode']) body[c + 'TierMode'] = data[c + 'TierMode'];
        const tiers = [];
        for (let i = 0; i < 3; i++) {
          const rate = data[c + 'Rate' + i];
          if (rate === '' || rate == null) continue;
          const upTo = data[c + 'UpTo' + i];
          tiers.push({ upTo: upTo === '' || upTo == null ? null : Number(upTo), rate: Number(rate) });
        }
        if (tiers.length) body[c + 'Tiers'] = tiers;
      }
      for (let i = 0; i < 4; i++) {
        if (!data['season' + i + 'Label']) continue;
        const row = { label: data['season' + i + 'Label'], charge: data['season' + i + 'Charge'], effect: data['season' + i + 'Effect'] };
        if (data['season' + i + 'Kind'] === 'months') row.months = String(data['season' + i + 'Months'] || '').split(/[^0-9]+/).filter(Boolean).map(Number);
        else { row.from = data['season' + i + 'From']; row.to = data['season' + i + 'To']; }
        if (row.effect === 'override' || row.effect === 'each') row.rate = data['season' + i + 'Rate'];
        else row.percent = data['season' + i + 'Percent'];
        if (row.effect === 'each') row.amount = data['season' + i + 'Rate'];
        body.seasons.push(row);
      }
      history.replaceState(null, '', '/app#tariff?client=' + encodeURIComponent(data.clientId));
      panel = 'tariff';
      return api('POST', '/api/clients/' + encodeURIComponent(data.clientId) + '/tariff', body);
    }
    if (name === 'pick-face') return api('POST', '/api/pick-faces', { code: data.code, itemNo: data.itemNo, min: Number(data.min), max: Number(data.max), trigger: data.trigger === '' ? null : Number(data.trigger), mode: data.mode });
    if (name === 'tech-sort') {
      const rules = String(data.rules || '').split(/\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const i = line.indexOf(':');
        return { category: (i < 0 ? line : line.slice(0, i)).trim(), putaway: i < 0 ? '' : line.slice(i + 1).trim() };
      });
      return api('POST', '/api/technical', { autoSort: { strategy: data.strategy, enabled: data.enabled === 'on', sameBatchTogether: data.sameBatchTogether === 'on', groundForNextOut: data.groundForNextOut === 'on', rules } });
    }
    if (name === 'tech-defaults') {
      const locationDefaults = {};
      for (const kind of ['rack', 'bin', 'mezzanine', 'virtual']) {
        locationDefaults[kind] = { heightMm: num(data[kind + '.heightMm']), widthMm: num(data[kind + '.widthMm']), depthMm: num(data[kind + '.depthMm']), maxWeightKg: num(data[kind + '.maxWeightKg']) };
      }
      return api('POST', '/api/technical', { locationDefaults });
    }
    if (name === 'tech-series') {
      const holderSeries = {};
      for (const series of ['PAL', 'MASTER', 'ST', 'INB', 'OUT']) holderSeries[series] = { prefix: data['prefix.' + series], pad: Number(data['pad.' + series]) };
      return api('POST', '/api/technical', { holderSeries });
    }
    throw new Error('Unknown action');
  }
  const num = (v) => (v === '' || v == null ? null : Number(v));
  function cleanNums(data) {
    const out = { ...data };
    for (const k of ['heightMm', 'widthMm', 'depthMm', 'maxWeightKg', 'stacks', 'stackHeight']) if (k in out) out[k] = num(out[k]);
    return out;
  }

  const DEMO_NAV_ROLES = ['administrator', 'manager', 'office', 'technician', 'operator', 'machine'];
  function demoUser(role) {
    const permissions = {
      administrator: ['users.read', 'users.write', 'roles.read', 'roles.write', 'settings.read', 'settings.write', 'sites.write', 'sites.switch', 'wms.read', 'wms.write', 'reports.read', 'orders.read', 'orders.write', 'outbound.read', 'outbound.write', 'inbound.read', 'inbound.write', 'picks.execute', 'putaway.execute', 'val.execute', 'labels.print', 'holders.read', 'holders.write', 'moves.execute', 'clients.read', 'tariff.write'],
      manager: ['wms.read', 'wms.write', 'reports.read', 'sites.switch', 'orders.read', 'tasks.read', 'clients.read', 'tariff.write'],
      office: ['wms.read', 'wms.write', 'reports.read', 'sites.switch', 'orders.read', 'orders.write', 'outbound.write', 'inbound.write', 'labels.print', 'clients.read', 'clients.write', 'tariff.write', 'items.read'],
      technician: ['wms.read', 'sites.switch', 'technical.write', 'labels.print'],
      operator: ['wms.read', 'sites.switch', 'picks.execute', 'val.execute', 'inbound.write', 'outbound.write', 'orders.read', 'labels.print', 'holders.write'],
      machine: ['wms.read', 'sites.switch', 'putaway.execute', 'moves.execute', 'labels.print'],
    };
    return { username: 'demo-' + role, displayName: 'Demo ' + (TITLES[role] || role), role, permissions: permissions[role] || ['wms.read'], mustChangePassword: false };
  }
  async function loadSites() {
    const pick = document.getElementById('sitePick');
    if (!pick) return;
    try {
      const data = window.SORTED_DEMO ? { current: 'MAIN', sites: [{ id: 'MAIN', name: 'Demo warehouse' }] } : await api('GET', '/api/sites');
      pick.innerHTML = (data.sites || []).map((s) => `<option value="${esc(s.id)}" ${s.id === data.current ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
      pick.onchange = async () => {
        if (window.SORTED_DEMO) return;
        await api('POST', '/api/sites/switch', { id: pick.value });
        draw();
      };
    } catch (e) { pick.innerHTML = '<option>MAIN</option>'; }
  }
  function showDemoBar() {
    if (!window.SORTED_DEMO || document.getElementById('demoBar')) return;
    const bar = document.createElement('div');
    bar.id = 'demoBar';
    bar.style.cssText = 'background:#9a6700;color:#fff;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center';
    const role = new URLSearchParams(location.search).get('as') || 'administrator';
    bar.innerHTML = `<b>Demo</b> <span>Not a signed-in warehouse. Pick a role to look around.</span> ` + DEMO_NAV_ROLES.map((r) => `<button type="button" data-demo="${r}" style="background:${r === role ? '#fff' : 'transparent'};color:${r === role ? '#9a6700' : '#fff'};border:1px solid #fff;border-radius:8px;padding:4px 8px">${TITLES[r]}</button>`).join('');
    bar.onclick = (e) => {
      const b = e.target.closest('[data-demo]');
      if (!b) return;
      const url = new URL(location.href);
      url.searchParams.set('as', b.dataset.demo);
      location.assign(url.pathname + url.search + location.hash);
    };
    document.body.prepend(bar);
  }
  async function start() {
    if (window.SORTED_DEMO) {
      const role = new URLSearchParams(location.search).get('as') || 'administrator';
      me = demoUser(DEMO_NAV_ROLES.includes(role) ? role : 'administrator');
      showDemoBar();
      panel = (location.hash || '#').slice(1).split('?')[0];
      await draw();
      return loadSites();
    }
    const session = await api('GET', '/api/session');
    me = session.user;
    if (me.mustChangePassword) {
      document.body.dataset.role = me.role;
      $('#title').textContent = 'Change password';
      $('#who').textContent = me.displayName;
      $('#main').innerHTML = `<section><h2>Choose a new password</h2><p class="hint">An administrator reset this account. The next screen opens after the password changes.</p><form class="form" id="pw"><label>Current password<input name="current" type="password" required></label><label>New password<input name="next" type="password" required minlength="8"></label><button class="primary">Save password</button></form></section>`;
      document.getElementById('pw').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        await api('POST', '/api/password', data);
        location.assign('/app');
      };
      return;
    }
    panel = (location.hash || '#').slice(1).split('?')[0];
    await draw();
    loadSites();
  }
  const realApi = api;
  api = window.SORTED_DEMO ? async function (method, path, body) {
    if (!window.SortedLocal) throw new Error('Demo data is not loaded');
    const out = await window.SortedLocal.fetch(method, path, body, { operator: me && me.username || 'demo' });
    if (out.status >= 400) throw new Error((out.body && out.body.error) || 'Request failed');
    return out.body;
  } : realApi;
  start().catch((e) => { if (!window.SORTED_DEMO) return; $('#main').innerHTML = msg(e.message, false); });
  window.addEventListener('hashchange', () => { panel = location.hash.slice(1).split('?')[0]; if (me) draw(); });
})();
</script>
</body>
</html>
