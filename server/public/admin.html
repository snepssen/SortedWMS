<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortedWMS office</title>
<style>
  :root { --bg: #f4f6f8; --card: #fff; --line: #dde3e8; --ink: #17202a; --dim: #66737f; --acc: #1769c2; --ok: #138a4a; --bad: #c62f28; --warn: #a96500; --chip: #eef2f5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1316; --card: #182026; --line: #2a343d; --ink: #e9eef2; --dim: #93a1ad; --acc: #59a9ff; --ok: #3ccf7a; --bad: #ff6b63; --warn: #ffb020; --chip: #222c34; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 7px 11px; border-radius: 8px; color: var(--dim); font-weight: 600; }
  nav button.on { background: var(--chip); color: var(--ink); }
  main { padding: 16px; max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .hint { color: var(--dim); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary, a.btn { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  a.btn { border-radius: 8px; padding: 6px 12px; text-decoration: none; }
  button.small { padding: 2px 8px; font-size: 12px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 8px; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td.wrap { white-space: normal; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 24px; }
  .kpi span { color: var(--dim); font-size: 12px; }
  .out { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--chip); white-space: pre-wrap; font-size: 13px; }
  .out.bad { color: var(--bad); }
  .out.ok { color: var(--ok); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 5px; background: var(--chip); font-size: 12px; font-weight: 600; }
  .tag.urgent, .tag.held, .tag.warn { color: var(--warn); }
  .tag.bad { color: var(--bad); }
  @media (max-width: 600px) { main { padding: 10px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>SortedWMS office</h1>
  <nav id="nav"></nav>
  <span class="hint">Screens: <a href="station.html">Station</a> · <a href="desk.html">Receiving desk</a> · <a href="card.html">Command card</a> · <a href="kit.html">Demo kit</a></span>
  <span class="hint" id="status"></span>
</header>
<main id="main"></main>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ls = { get: (k) => { try { return localStorage.getItem('adm.' + k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem('adm.' + k, v); } catch (e) { /* ignore */ } } };
  let token = ls.get('token') || new URLSearchParams(location.search).get('token') || '';
  let user = ls.get('user') || '';
  let tab = ls.get('tab') || 'floor';
  let S = null; // summary
  let orderLine = () => ''; // one order line's inputs, set when the Orders tab is drawn
  const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const when = (t) => new Date(t).toLocaleString([], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dmy = (iso) => (iso ? iso.split('-').reverse().join('-') : '');
  const short = (s) => (s ? '…' + s.slice(-6) : '–');

  async function api(method, path, body) {
    if (window.SortedLocal) { // GitHub Pages: the WMS runs in this browser
      const r = await window.SortedLocal.fetch(method, path, body, { operator: user || 'office' });
      if (r.status >= 400) throw new Error(r.body.error);
      return r.body;
    }
    const res = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-token': token, 'x-operator': user || 'office' }, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }
  // Run an action and show the result in the box next to it.
  async function act(outId, fn) {
    const out = $(outId);
    try { const r = await fn(); if (out) { out.className = 'out ok'; out.textContent = typeof r === 'string' ? r : JSON.stringify(r, null, 1); } await refresh(); }
    catch (e) { if (out) { out.className = 'out bad'; out.textContent = e.message; } }
  }
  const val = (id) => ($(id).value || '').trim();
  const catOptions = (sel, none) => (none ? `<option value="">no category</option>` : '') + Object.entries(S.categories).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const table = (heads, rows) => `<div class="table"><table><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td colspan="${heads.length}" class="hint">Nothing here</td></tr>`}</table></div>`;
  function csv(text) {
    const lines = text.trim().split(/\r?\n/).filter(Boolean);
    const split = (l) => l.split(/[;,\t]/).map((c) => c.trim().replace(/^"|"$/g, ''));
    const head = split(lines.shift());
    return lines.map((l) => { const c = split(l); const o = {}; head.forEach((h, i) => { if (c[i] !== undefined && c[i] !== '') o[h] = /^-?\d+(\.\d+)?$/.test(c[i]) && !/^(sscc|batch|code|codes|gtin|unitGtin|itemNo|orderId|lane)$/i.test(h) ? Number(c[i]) : c[i]; }); return o; });
  }

  // A pasted delivery list: sscc, item (number or EAN), batch, best-before, quantity. A header row is skipped.
  function isoDate(v) {
    const t = String(v || '').trim();
    let m;
    if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t))) return t;
    if ((m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/.exec(t))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    if ((m = /^(\d{2})(\d{2})(\d{4})$/.exec(t))) return `${m[3]}-${m[2]}-${m[1]}`;
    throw new Error(`Best-before "${t}" is not a date (use 09-11-2026)`);
  }
  function deliveryList(text) {
    const rows = text.trim().split(/\r?\n/).map((l) => l.split(/[;,\t]/).map((c) => c.trim())).filter((r) => r.join(''));
    if (rows.length && !/^\(?0?0?\)?\d{18}$/.test(rows[0][0].replace(/^\(00\)/, ''))) rows.shift();
    if (!rows.length) return null;
    return rows.map(([sscc, item, batch, bb, qty], i) => {
      const s = sscc.replace(/^\(00\)/, '').replace(/^00(?=\d{18}$)/, '');
      if (!/^\d{18}$/.test(s)) throw new Error(`Row ${i + 1}: "${sscc}" is not an SSCC`);
      return { sscc: s, itemNo: item, batch, expiry: isoDate(bb), qty: Number(qty) || undefined };
    });
  }

  const TABS = {
    floor: { label: 'Floor', render: renderFloor },
    locations: { label: 'Locations', render: renderLocations },
    stock: { label: 'Stock & trace', render: renderStock },
    recalls: { label: 'Batch recalls', render: renderRecalls },
    quarantine: { label: 'Quarantine', render: renderQuarantine },
    orders: { label: 'Orders & deliveries', render: renderOrders },
    imports: { label: 'Import', render: renderImports },
    audit: { label: 'Audit', render: renderAudit },
    settings: { label: 'Settings', render: renderSettings },
  };

  function renderNav() {
    $('#nav').innerHTML = Object.entries(TABS).map(([k, t]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${t.label}</button>`).join('');
    document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; ls.set('tab', tab); renderNav(); draw(); }));
  }

  // ---- Floor: trucks, jobs ------------------------------------------------------------

  async function renderFloor() {
    const [devices, tasks] = await Promise.all([api('GET', '/api/devices'), api('GET', '/api/tasks')]);
    const kpi = (n, l) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`;
    return `<div class="kpis">${kpi(S.openJobs, 'open jobs')}${kpi(S.activeJobs, 'in progress')}${kpi(S.heldJobs, 'held')}${kpi(S.orders, 'open orders')}${kpi(S.pallets, 'pallets in stock')}${kpi(S.cantShip, "pallets can't ship")}${kpi(S.lost, 'location unknown')}${kpi(S.inProcess, 'in a process')}</div>
      <section><h2>Handhelds</h2>${table(['ID', 'Mode', 'Categories', 'Now', 'Last message'], devices.map((d) => `<tr>
        <td><b>${esc(d.id)}</b> <span class="hint">${d.kind}</span></td>
        <td>${d.kind === 'truck' ? `<select data-dev-mode="${esc(d.id)}">${d.modes.map((m) => `<option value="${m.id}" ${m.id === d.mode ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</select>` : ''}</td>
        <td>${d.kind === 'truck' ? Object.entries(S.categories).map(([k, v]) => `<label class="hint" style="white-space:nowrap"><input type="checkbox" data-cat-dev="${esc(d.id)}" value="${esc(k)}" ${!d.categories || d.categories.includes(k) ? 'checked' : ''}> ${esc(v)}</label>`).join(' ') : 'all'}</td>
        <td class="wrap">${d.instruction.task ? `${esc(d.instruction.task.typeLabel)} #${d.instruction.task.id} ${esc(d.instruction.targetName || '')}` : esc(d.instruction.kind)}</td>
        <td class="wrap">${d.message ? `<span style="color:var(--${d.message.ok ? 'ok' : 'bad'})">${esc(d.message.text)}</span>` : ''}</td></tr>`))}</section>
      <section><h2>Jobs</h2><div class="out" id="taskOut" style="display:none"></div>${table(['#', 'Job', 'Pallet', 'From', 'To', 'Truck', 'Status', 'Why', ''], tasks.sort((a, b) => b.urgent - a.urgent || a.id - b.id).map((t) => `<tr>
        <td>${t.id}</td><td>${esc(t.typeLabel)}${t.orderId ? ` · ${esc(t.orderId)}` : ''}</td><td class="mono">${short(t.sscc)}</td>
        <td>${esc(t.fromName || '')}</td><td>${esc(t.toName || 'auto slot')}</td><td>${esc(t.truckId || '')}</td>
        <td><span class="tag ${t.urgent ? 'urgent' : ''} ${t.status}">${t.urgent ? 'urgent ' : ''}${t.status}</span>${t.heldReason ? `<div class="hint">${esc(t.heldReason)}</div>` : ''}</td>
        <td class="wrap hint">${esc(t.why || '')}</td>
        <td>${t.status === 'held' ? `<button class="small" data-task="release" data-id="${t.id}">Release</button>` : `<button class="small" data-task="urgent" data-id="${t.id}" data-on="${!t.urgent}">${t.urgent ? 'Not urgent' : 'Urgent'}</button>`}
            ${t.status !== 'active' ? `<button class="small" data-task="cancel" data-id="${t.id}">Cancel</button>` : ''}</td></tr>`))}</section>`;
  }

  // ---- Locations: template ranges, lookup, transfers, lost pallets ---------------------------

  async function renderLocations() {
    const [lost, transfers, blocked, counts] = await Promise.all([api('GET', '/api/lost'), api('GET', '/api/transfers'), api('GET', '/api/blocked'), api('GET', '/api/counts')]);
    const RESULT = { ok: '<span class="tag">OK</span>', corrected: '<span class="tag warn">corrected</span>', missing: '<span class="tag bad">missing</span>' };
    return `<div class="grid">
      <section><h2>Location template: set a category on a range</h2>
        <p class="hint">Either naming works: <span class="mono">AA01A1</span> → <span class="mono">AH10E3</span>, a partial range like <span class="mono">AA</span> → <span class="mono">AD</span> (whole racks), or <span class="mono">31</span> → <span class="mono">34</span> (whole aisles). Pallets left in the wrong category get Auto-Shift relocation jobs.</p>
        <div class="form"><label>From <input id="tFrom" size="9" value="${esc(ls.get('tFrom') || 'AA01A1')}"></label><label>To <input id="tTo" size="9" value="${esc(ls.get('tTo') || 'AH10E3')}"></label>
          <label>Category <select id="tCat">${catOptions(ls.get('tCat') ?? Object.keys(S.categories)[0], true)}</select></label>
          <button id="tPrev">Preview</button><button class="primary" id="tApply" disabled>Apply</button></div>
        <div class="out" id="tOut">Preview first, then apply.</div></section>
      <section><h2>Stock check</h2>
        <p class="hint">A pallet: where it is and where it belongs. A location: what's in it. An item number or EAN: every pallet with its location and SSCC, next to ship first.</p>
        <div class="form"><input id="lkIn" placeholder="SSCC, AA03C2, 38-02-0-10, item no. or EAN" style="flex:1"><button id="lkGo">Check</button></div>
        <div class="out" id="lkOut" style="display:none"></div></section>
      <section><h2>Office transfer</h2>
        <p class="hint">Record where a pallet really stands. A pallet the system had in that spot goes on the unknown-location list. Drivers do the same on the handheld in Transfer mode: scan pallet, scan location.</p>
        <div class="form"><label>Pallet SSCC <input id="trS" size="20"></label><label>Now at <input id="trTo" size="11"></label><button class="primary" id="trGo">Record</button></div>
        <div class="out" id="trOut" style="display:none"></div></section>
      <section><h2>Location unknown (${lost.length})</h2><p class="hint">Reported missing, or pushed out by a transfer. Scan one anywhere in Transfer mode to put it back on the map.</p>
        ${table(['Pallet', 'Item', 'Batch', 'Last known'], lost.map((p) => `<tr><td class="mono">${esc(p.sscc)}</td><td>${esc(p.itemNo)}</td><td>${esc(p.batch)}</td><td>${esc(p.missingFromName || '')}</td></tr>`))}</section>
      <section><h2>Blocked (${blocked.pallets.length + blocked.locations.length})</h2><p class="hint">Pallets reported damaged, expired on arrival or blocked here; locations reported blocked by a driver. They don't ship or take pallets until released.</p>
        ${table(['Pallet / location', 'Why', ''], [
          ...blocked.pallets.map((p) => `<tr><td class="mono">${short(p.sscc)} ${esc(p.itemNo)} · ${esc(p.locName || '')}</td><td>${esc(p.blockReason || 'Blocked')}</td><td><button class="small" data-pact="release" data-s="${esc(p.sscc)}">Release</button></td></tr>`),
          ...blocked.locations.map((l) => `<tr><td>${esc(l.name)}</td><td>Location blocked</td><td><button class="small" data-lact="${esc(l.code)}">Unblock</button></td></tr>`)])}</section>
      <section style="grid-column:1/-1"><h2>Stock counts</h2>
        <p class="hint">Inventory control without stopping work. Count jobs go to trucks with nothing else to do: scan the location, scan what's in it (or the location again if it's empty). The handheld doesn't say what to expect. A difference corrects the system on the spot and shows here. Leave the range empty and the system picks the locations that need it most: where corrections happened, where lost pallets were last seen, then the longest since a count.</p>
        <div class="form"><label>From <input id="cnFrom" size="9" placeholder="optional"></label><label>To <input id="cnTo" size="9" placeholder="optional"></label><label>How many <input id="cnN" size="3" value="10"></label><button class="primary" id="cnGo">Plan counts</button></div>
        <div class="out" id="cnOut" style="display:none"></div>
        <p><b>${counts.open}</b> count job(s) open · <b>${counts.done}</b> done${counts.accuracy == null ? '' : ` · system right <b>${counts.accuracy}%</b> of the time`}</p>
        ${table(['When', 'Location', 'System had', 'Found', 'Result', 'By'], counts.results.slice(0, 50).map((c) => `<tr><td>${when(c.t)}</td><td>${esc(c.name)}</td><td class="mono">${c.expected ? short(c.expected) : 'empty'}</td><td class="mono">${c.found ? short(c.found) : 'empty'}</td><td>${RESULT[c.result] || esc(c.result)}</td><td>${esc(c.by)}</td></tr>`))}</section>
      <section style="grid-column:1/-1"><h2>Recent transfers</h2>${table(['When', 'Pallet', 'From', 'To', 'By'], transfers.slice(0, 50).map((t) => `<tr><td>${when(t.t)}</td><td class="mono">${short(t.sscc)}</td><td>${esc(t.fromName)}</td><td>${esc(t.toName)}</td><td>${esc(t.by)}</td></tr>`))}</section>
    </div>`;
  }

  // ---- Stock and trace ----------------------------------------------------------------

  async function renderStock() {
    const stock = await api('GET', '/api/stock');
    const quality = await api('GET', '/api/quality');
    const routes = await api('GET', '/api/routes');
    return `<div class="grid">
      <section style="grid-column:1/-1"><h2>Stock per item</h2>${table(['Item', 'Name', 'Category', 'Can ship', 'Cases', 'Batches', 'Short-dated', 'Blocked', 'Next out', 'Min. days', ''], stock.map((r) => `<tr>
        <td>${esc(r.item.itemNo)}</td><td>${esc(r.item.name)}</td><td>${esc(S.categories[r.item.category] || r.item.category)}</td>
        <td>${r.available}</td><td>${r.qty}</td><td>${r.batches}</td><td>${r.short ? `<span class="tag held">${r.short}</span>` : 0}</td><td>${r.blocked ? `<span class="tag bad">${r.blocked}</span>` : 0}</td>
        <td>${r.next ? `${esc(r.next.batch)} · ${dmy(r.next.expiry)} · ${esc(r.next.locName || '')}` : ''}</td>
        <td><input data-minship="${esc(r.item.itemNo)}" value="${r.item.minShipDays}" size="3"></td><td><button class="small" data-minship-save="${esc(r.item.itemNo)}">Save</button></td></tr>`))}</section>
      <section><h2>Send a pallet to a process</h2>
        <p class="hint">For work that isn't on an order, e.g. hole forming. The trucks move it from station to station as Auto jobs; the station screens run the steps. (On an order line, choose the process there instead.)</p>
        <div class="form"><label>Pallet SSCC <input id="prS" size="20"></label><label>Process <select id="prR">${routes.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select></label>
          <button class="primary" id="prGo">Start</button></div><div class="out" id="prOut" style="display:none"></div></section>
      <section style="grid-column:1/-1"><h2>Temperature inspection</h2>
        <form id="qualityForm" class="form">
          <label>Pallet SSCC <input id="qSscc" required></label>
          <label>Measured C <input id="qTemperature" type="number" step="any" required></label>
          <label>Minimum C <input id="qMin" type="number" step="any" required></label>
          <label>Maximum C <input id="qMax" type="number" step="any" required></label>
          <label>Inspection note <input id="qReason" required></label>
          <button type="submit">Record inspection</button>
        </form><div id="qualityOut" class="out" style="display:none"></div>
        <h3>Quality holds</h3><label>Release reason <input id="qReleaseReason"></label>
        ${table(['Pallet', 'Batch', 'Location', 'Measured C', 'Limits C', 'Reason', ''], quality.filter((p) => p.qualityHold).map((p) => `<tr><td class="mono">${esc(p.sscc)}</td><td>${esc(p.batch)}</td><td>${esc(p.locName || 'On truck')}</td><td>${p.qualityHold.temperature}</td><td>${p.qualityHold.min} to ${p.qualityHold.max}</td><td>${esc(p.qualityHold.reason)}</td><td><button data-quality-release="${esc(p.sscc)}">Release hold</button></td></tr>`))}
        <h3>Inspection & release history</h3>${table(['When', 'Pallet', 'Action', 'Measured C', 'Limits C', 'Reason', 'By'], quality.flatMap((p) => p.qualityHistory.map((e) => ({ p, e }))).sort((a, b) => b.e.t - a.e.t).map(({ p, e }) => `<tr><td>${when(e.t)}</td><td class="mono">${esc(p.sscc)}</td><td>${e.kind === 'release' ? 'Released' : e.outside ? 'Quality hold' : 'Reading recorded'}</td><td>${e.temperature == null ? '' : e.temperature}</td><td>${e.min == null ? '' : `${e.min} to ${e.max}`}</td><td>${esc(e.reason)}</td><td>${esc(e.by)}</td></tr>`))}
      </section>
      <section><h2>Batch trace (recall)</h2><div class="form"><input id="trcIn" placeholder="Batch number" style="flex:1"><button id="trcGo">Trace</button></div><div id="trcOut"></div></section>
    </div>`;
  }

  // ---- Orders and deliveries ------------------------------------------------------------

  function recallReport(r) {
    return `<p><b>${esc(r.itemNo)} / ${esc(r.batch)}</b> <span class="tag ${r.active ? 'bad' : ''}">${r.active ? 'Recall hold active' : 'No active recall hold'}</span></p>
      <p>${r.inStock.length} pallet(s) in warehouse (${r.inStock.reduce((n, p) => n + p.qty, 0)} cases). ${r.shipped.length} shipped (${r.shipped.reduce((n, p) => n + p.qty, 0)} cases).</p>
      <h3>Warehouse stock</h3>${table(['SSCC', 'Location', 'Cases', 'Order', 'Shipping eligibility'], r.inStock.map((p) => `<tr><td class="mono">${esc(p.sscc)}</td><td>${esc(p.locName || (p.status === 'missing' ? 'Location unknown' : 'On truck'))}</td><td>${p.qty}</td><td>${esc(p.orderId || '')}</td><td>${esc(p.holdReason || p.shipState)}</td></tr>`))}

  // ---- Wiring ------------------------------------------------------------------------

  function bind() {
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    document.querySelectorAll('[data-cat-dev]').forEach((c) => (c.onchange = () => {
      const id = c.dataset.catDev;
      const boxes = [...document.querySelectorAll(`[data-cat-dev="${id}"]`)];
      const on = boxes.filter((b) => b.checked).map((b) => b.value);
      act(null, () => api('POST', `/api/devices/${id}/categories`, { categories: on.length && on.length < boxes.length ? on : null }));
    }));
    document.querySelectorAll('[data-dev-mode]').forEach((s) => (s.onchange = () => act(null, () => api('POST', `/api/devices/${s.dataset.devMode}/mode`, { mode: s.value }))));
    document.querySelectorAll('[data-task]').forEach((b) => (b.onclick = () => {
      const id = b.dataset.id;
      if (b.dataset.task === 'cancel' && !confirm(`Cancel job #${id}?`)) return;
      $('#taskOut').style.display = '';
      act('#taskOut', () => api('POST', `/api/tasks/${id}/${b.dataset.task}`, b.dataset.task === 'urgent' ? { urgent: b.dataset.on === 'true' } : {}));
    }));
    // Template
    on('#tPrev', async () => {
      ls.set('tFrom', val('#tFrom')); ls.set('tTo', val('#tTo')); ls.set('tCat', $('#tCat').value);
      try {
        const p = await api('GET', `/api/template/preview?${new URLSearchParams({ from: val('#tFrom'), to: val('#tTo'), category: $('#tCat').value })}`);
        const from = Object.entries(p.from).map(([k, n]) => `${n} from ${S.categories[k] || k}`).join(', ');
        $('#tOut').className = 'out';
        $('#tOut').textContent = `${p.locations} locations: ${p.first.join(', ')} … ${p.last.join(', ')}\n${p.changed} change category${from ? ` (${from})` : ''}. ${p.palletsHere} hold a pallet, ${p.palletsToMove} of them will need relocating.`;
        $('#tApply').disabled = !p.locations;
      } catch (e) { $('#tOut').className = 'out bad'; $('#tOut').textContent = e.message; }
    });
    on('#tApply', () => {
      const cat = $('#tCat').value;
      if (!confirm(`Set ${val('#tFrom')} to ${val('#tTo')} to ${cat ? S.categories[cat] : 'no category'}?`)) return;
      act('#tOut', async () => { const r = await api('POST', '/api/template/apply', { from: val('#tFrom'), to: val('#tTo'), category: cat || null }); return `Done: ${r.changed} of ${r.locations} locations changed. ${r.moves || 0} relocation job(s) created for Auto-Shift.`; });
    });
    // Stock check, with what the coordinator can do about the answer: block or release a pallet, let a short-dated one ship, unblock a location.
    const runCheck = async () => {
      const out = $('#lkOut');
      out.style.display = '';
      try {
        const r = await api('GET', `/api/lookup/${encodeURIComponent(val('#lkIn'))}`);
        const acts = [];
        if (r.kind === 'pallet' && r.pallet) {
          const p = r.pallet;
          if (p.status === 'blocked') acts.push(`<button class="small" data-pact="release" data-s="${esc(p.sscc)}">Release (unblock)</button>`);
          else if (p.status === 'available') acts.push(`<button class="small" data-pact="block" data-s="${esc(p.sscc)}">Block</button>`);
          if (p.shipState === 'short') acts.push(`<button class="small" data-pact="short" data-s="${esc(p.sscc)}">Let this one ship short-dated</button>`);
        }
        if (r.kind === 'location' && r.location && r.location.blocked) acts.push(`<button class="small" data-lact="${esc(r.location.code)}">Unblock location</button>`);
        out.className = 'out';
        out.innerHTML = `<div>${esc(r.text)}</div>${acts.length ? `<div class="form" style="margin-top:8px">${acts.join(' ')}</div>` : ''}`;
        bindStockActions();
      } catch (e) { out.className = 'out bad'; out.textContent = e.message; }
    };
    on('#lkGo', runCheck);
    if ($('#lkIn')) $('#lkIn').onkeydown = (e) => { if (e.key === 'Enter') runCheck(); };
    function bindStockActions() {
      const after = async () => {
        const q = $('#lkIn') ? val('#lkIn') : '';
        await draw(); // the tab redraws with the new state; the last check is asked again
        if (q && $('#lkIn')) { $('#lkIn').value = q; runCheck(); }
      };
      document.querySelectorAll('[data-pact]').forEach((b) => (b.onclick = async () => {
        const s = b.dataset.s;
        try {
          if (b.dataset.pact === 'short') await api('POST', `/api/pallets/${s}/allow-short`);
          else await api('POST', `/api/pallets/${s}/status`, b.dataset.pact === 'block' ? { status: 'blocked', reason: `Blocked in the office${user ? ` by ${user}` : ''}` } : { status: 'available' });
        } catch (e) { alert(e.message); }
        after();
      }));
      document.querySelectorAll('[data-lact]').forEach((b) => (b.onclick = async () => {
        try { await api('POST', `/api/locations/${encodeURIComponent(b.dataset.lact)}/unblock`); } catch (e) { alert(e.message); }
        after();
      }));
    }
    bindStockActions();
    on('#cnGo', () => { $('#cnOut').style.display = ''; act('#cnOut', async () => `${await api('POST', '/api/plan/counts', { from: val('#cnFrom'), to: val('#cnTo'), limit: Number(val('#cnN')) || 10 })} count job(s) planned`); });
    on('#trGo', () => { $('#trOut').style.display = ''; act('#trOut', async () => { const r = await api('POST', '/api/transfer', { sscc: val('#trS').replace(/^00/, ''), to: val('#trTo') }); if (!r.ok) throw new Error(r.text); return r.text; }); });
    // Stock
    const qualityAction = async (fn) => {
      let message = 'Recorded', ok = true;
      try { await fn(); await draw(); } catch (e) { message = e.message; ok = false; }
      const out = $('#qualityOut');
      if (out) { out.style.display = ''; out.className = `out ${ok ? 'ok' : 'bad'}`; out.textContent = message; }
    };
    if ($('#qualityForm')) $('#qualityForm').onsubmit = (e) => {
      e.preventDefault();
      qualityAction(() => api('POST', `/api/pallets/${encodeURIComponent($('#qSscc').value.trim())}/temperature`, { temperature: Number($('#qTemperature').value), min: Number($('#qMin').value), max: Number($('#qMax').value), reason: $('#qReason').value }));
    };
    document.querySelectorAll('[data-quality-release]').forEach((b) => (b.onclick = () => qualityAction(() => api('POST', `/api/pallets/${b.dataset.qualityRelease}/quality-release`, { reason: $('#qReleaseReason').value }))));
    document.querySelectorAll('[data-minship-save]').forEach((b) => (b.onclick = () => act(null, () => api('POST', `/api/items/${b.dataset.minshipSave}/min-ship-days`, { days: Number($(`[data-minship="${b.dataset.minshipSave}"]`).value) }))));
    on('#trcGo', async () => {
      try {
        const r = await api('GET', `/api/trace/${encodeURIComponent(val('#trcIn'))}`);
        $('#trcOut').innerHTML = `<p><b>${esc(r.batch)}</b>: ${r.inStock.length} pallet(s) in stock, received in ${r.received.map((d) => `${esc(d.id)} (${esc(d.supplier)})`).join(', ') || 'opening stock'}.
          Shipped to: <b>${esc(r.customers.join(', ') || 'nobody yet')}</b></p>
          ${table(['Pallet', 'Item', 'Where', 'Status'], r.inStock.map((p) => `<tr><td class="mono">${short(p.sscc)}</td><td>${esc(p.itemNo)}</td><td>${esc(p.locName || '')}</td><td>${esc(p.status)}</td></tr>`))}
          ${r.shipped.length ? table(['Shipped', 'Pallet', 'Order', 'Customer'], r.shipped.map((s) => `<tr><td>${when(s.t)}</td><td class="mono">${short(s.sscc)}</td><td>${esc(s.orderId)}</td><td>${esc(s.customer)}</td></tr>`)) : ''}`;
      } catch (e) { $('#trcOut').innerHTML = `<div class="out bad">${esc(e.message)}</div>`; }
    });
    // Batch recalls
    const recallAction = async (fn) => {
      let message = 'Decision recorded', ok = true;
      try { await fn(); await draw(); } catch (e) { message = e.message; ok = false; }
      const out = $('#recallOut');
      if (out) { out.style.display = ''; out.className = `out ${ok ? 'ok' : 'bad'}`; out.textContent = message; }
    };
    if ($('#recallForm')) {
      let previewScope = null;
      const scope = () => ({ itemNo: $('#rItem').value, batch: $('#rBatch').value.trim() });
      $('#recallForm').onsubmit = async (e) => {
        e.preventDefault();
        const requested = scope();
        $('#rHold').disabled = true;
        try {
          const r = await api('GET', `/api/recalls/preview?${new URLSearchParams(requested)}`);
          if (JSON.stringify(requested) !== JSON.stringify(scope())) return;
          $('#recallPreview').innerHTML = recallReport(r);
          previewScope = requested;
          $('#rHold').disabled = r.active;
        } catch (err) { $('#recallPreview').innerHTML = `<div class="out bad">${esc(err.message)}</div>`; }
      };
      for (const id of ['#rItem', '#rBatch']) $(id).oninput = () => { previewScope = null; $('#rHold').disabled = true; $('#recallPreview').innerHTML = ''; };
      on('#rHold', () => {
        if (!previewScope || JSON.stringify(previewScope) !== JSON.stringify(scope())) return;
        recallAction(() => api('POST', '/api/recalls', { ...previewScope, reason: $('#rReason').value }));
      });
    }
    document.querySelectorAll('[data-recall-release]').forEach((b) => (b.onclick = () => recallAction(() => api('POST', '/api/recalls/release', { itemNo: b.dataset.item, batch: b.dataset.batch, reason: $(`#rRelease-${b.dataset.recallRelease}`).value }))));
    // Physical quarantine
    const quarantineAction = async (path, body) => {
      let message = 'Decision recorded', ok = true;
      try { await api('POST', path, body); await draw(); } catch (e) { message = e.message; ok = false; }
      const out = $('#quarantineOut');
      if (out) { out.style.display = ''; out.className = `out ${ok ? 'ok' : 'bad'}`; out.textContent = message; }
    };
    if ($('#quarantineZoneForm')) $('#quarantineZoneForm').onsubmit = (e) => {
      e.preventDefault();
      quarantineAction('/api/quarantine/locations', { from: $('#zFrom').value.trim(), to: $('#zTo').value.trim(), enabled: $('#zEnabled').checked, reason: $('#zReason').value });
    };
    if ($('#quarantineRequestForm')) $('#quarantineRequestForm').onsubmit = (e) => {
      e.preventDefault();
      quarantineAction('/api/quarantine/request', { sscc: $('#zSscc').value.trim(), reason: $('#zRequestReason').value });
    };
    document.querySelectorAll('[data-quarantine-release]').forEach((b) => (b.onclick = () => quarantineAction('/api/quarantine/release', { sscc: b.dataset.quarantineRelease, reason: $(`#zRelease-${b.dataset.index}`).value })));
    // Orders
    on('#prGo', () => { $('#prOut').style.display = ''; act('#prOut', async () => {
      const sscc = val('#prS').replace(/^\(00\)/, '').replace(/^00(?=\d{18}$)/, '');
      await api('POST', `/api/pallets/${encodeURIComponent(sscc)}/process`, { route: $('#prR').value });
      return `…${sscc.slice(-6)} sent to ${$('#prR').selectedOptions[0].textContent}: a truck takes it to the first station`;
    }); });
    on('#oGo', () => { $('#oOut').style.display = ''; act('#oOut', async () => {
      const lines = [...document.querySelectorAll('#oLines .oline')].map((row) => {
        const line = { itemNo: row.querySelector('.oItem').value, pallets: Number(row.querySelector('.oPal').value) || 1 };
        if (row.querySelector('.oProc').value) line.process = row.querySelector('.oProc').value;
        return line;
      });
      await api('POST', '/api/orders', { id: val('#oId'), customer: val('#oCust'), lane: $('#oLane').value, lines, verifyLoading: $('#oVerify').checked });
      return `Order ${val('#oId')} added: ${lines.length} line(s)`;
    }); });
    const bindLines = () => document.querySelectorAll('#oLines .oDel').forEach((b) => (b.onclick = () => { if (document.querySelectorAll('#oLines .oline').length > 1) b.closest('.oline').remove(); }));
    on('#oAdd', () => { $('#oLines').insertAdjacentHTML('beforeend', orderLine()); bindLines(); });
    bindLines();
    on('#dGo', () => { $('#dOut').style.display = ''; act('#dOut', async () => {
      const list = deliveryList($('#dList').value);
      await api('POST', '/api/deliveries', { id: val('#dId'), supplier: val('#dSup'), category: $('#dCat').value, pallets: list ? list.length : Number(val('#dPal')) || 1, at: $('#dAt').value, list });
      return `Delivery ${val('#dId')} announced${list ? ` with its list: ${list.length} pallets, one scan each` : ''}`;
    }); });
    document.querySelectorAll('[data-ship]').forEach((b) => (b.onclick = () => act(null, () => api('POST', `/api/orders/${encodeURIComponent(b.dataset.ship)}/ship`))));
    // Imports
    document.querySelectorAll('[data-import]').forEach((b) => (b.onclick = () => {
      const k = b.dataset.import;
      $(`#imOut-${k}`).style.display = '';
      act(`#imOut-${k}`, () => api('POST', `/api/import/${k}`, { rows: csv($(`#im-${k}`).value) }));
    }));
    // Audit
    on('#auGo', () => { ls.set('auBy', val('#auBy')); ls.set('auOp', val('#auOp')); draw(); });
    // Settings
    on('#cSave', () => { $('#cOut').style.display = ''; act('#cOut', async () => {
      await api('POST', '/api/config', {
        priority: val('#cPrio').split(/[,\s]+/).filter(Boolean).map((s) => s.toUpperCase()), aisleCap: Number(val('#cCap')), escalateAfterMin: Number(val('#cEsc')),
        groundNextPerItem: Number(val('#cGround')), travelOptimise: $('#cNear').checked, oneWay: $('#cOne').checked, checkAfterPick: $('#cCheck').checked,
        blockLaneBatches: Number(val('#cLaneB')), buriedStock: $('#cBuried').value,
        enabled: Object.fromEntries([...document.querySelectorAll('[data-jobon]')].map((b) => [b.dataset.jobon, b.checked])),
      });
      return 'Saved';
    }); });
    on('#nSave', () => act(null, () => api('POST', '/api/naming', { show: $('#nShow').value })));
    on('#pGroup', () => { $('#pOut').style.display = ''; act('#pOut', async () => `${JSON.stringify(await api('POST', '/api/plan/grouping'))} job(s) planned`); });
    on('#pDig', () => { $('#pOut').style.display = ''; act('#pOut', async () => `${JSON.stringify(await api('POST', '/api/plan/dig-out'))} job(s) planned`); });
    document.querySelectorAll('[data-pstatus]').forEach((b) => (b.onclick = async () => {
      const cell = document.getElementById(`ps-${b.dataset.pstatus}`);
      cell.textContent = 'Asking…';
      try {
        const r = await api('GET', `/api/printers/${encodeURIComponent(b.dataset.pstatus)}/status`);
        cell.innerHTML = r.ok ? '<span class="tag">ready</span>' : `<span class="tag bad">${esc(r.problems.join(', '))}</span>`;
      } catch (e) { cell.innerHTML = `<span class="tag bad">${esc(e.message)}</span>`; }
    }));
    on('#uSave', () => { user = val('#uName'); token = val('#uTok'); ls.set('user', user); ls.set('token', token); refresh(); });
  }

  // Redraw the current tab. Inputs being typed in are kept: the floor tab refreshes on its own, the others on demand.
  async function draw() {
    try {
      S = await api('GET', '/api/summary');
      $('#status').textContent = `${S.openJobs} open · ${S.activeJobs} active · ${hhmm(Date.now())}`;
      $('#main').innerHTML = await TABS[tab].render();
      bind();
    } catch (e) {
      $('#status').textContent = e.message;
      if (/Token/.test(e.message)) { $('#main').innerHTML = `<section><h2>Token required</h2><div class="form"><input id="uTok" type="password"><button id="uSave">Save</button></div></section>`; $('#uSave').onclick = () => { token = val('#uTok'); ls.set('token', token); draw(); }; }
    }
  }
  async function refresh() {
    if (tab === 'floor') return draw();
    try { S = await api('GET', '/api/summary'); $('#status').textContent = `${S.openJobs} open · ${S.activeJobs} active · ${hhmm(Date.now())}`; } catch (e) { $('#status').textContent = e.message; }
  }

  renderNav();
  draw();
  setInterval(() => { if (tab === 'floor' && !document.activeElement.matches('select,input')) draw(); else refresh(); }, 5000);
})();
</script>
</body>
</html>
