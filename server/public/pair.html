<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect · SortedWMS</title>
<script src="theme.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2f4; color: #17202a; font: 16px/1.45 system-ui, sans-serif; }
  main { width: min(420px, calc(100% - 24px)); background: #fff; border-radius: 16px; padding: 20px; }
  button { font: inherit; font-weight: 700; width: 100%; border: 0; border-radius: 10px; padding: 12px; background: #1769c2; color: #fff; }
  input { font: inherit; width: 100%; padding: 10px; margin: 8px 0 12px; }
  .err { color: #a32620; }
</style>
</head>
<body>
<main>
  <h1>Connect this device</h1>
  <p id="msg">Opening the warehouse…</p>
  <form id="secret" hidden>
    <label>Password or PIN <input name="secret" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
  </form>
  <p class="err" id="err"></p>
</main>
<script>
(function () {
  const token = location.pathname.split('/').filter(Boolean).pop();
  const err = document.getElementById('err');
  async function claim(secret) {
    const res = await fetch('/api/pairing/claim', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: token === 'pair' ? '' : token, secret: secret || null }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Could not connect');
    try { localStorage.setItem('sorted.device', body.deviceId); } catch (e) { /* the cookie still names the device */ }
    document.getElementById('msg').textContent = 'This device is connected. The queued scans on a handheld stay on the device.';
    location.assign('/handheld');
  }
  document.getElementById('secret').onsubmit = async (e) => {
    e.preventDefault();
    try { await claim(new FormData(e.target).get('secret')); } catch (e2) { err.textContent = e2.message; }
  };
  claim('').catch((e) => {
    if (/Password or PIN/.test(e.message)) { document.getElementById('secret').hidden = false; document.getElementById('msg').textContent = 'This device is shared. Enter that person\'s password or PIN.'; return; }
    err.textContent = e.message;
  });
})();
</script>
</body>
</html>
