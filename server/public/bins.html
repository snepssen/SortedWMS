<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>SortedWMS bins</title>
<script src="theme.js"></script>
<script src="/locales/en.js"></script>
<script src="/locales/nl.js"></script>
<script src="/src/i18n.js"></script>
<style>
  /* Dark unless the theme setting says light: easier on the eyes in a cold store and on a battery. */
  :root, :root[data-theme="dark"] { --bg: #101418; --card: #1b2229; --line: #2c3640; --ink: #f2f5f7; --dim: #9aa8b4; --ok: #3ccf7a; --bad: #ff5a52; --warn: #ffb020; --acc: #4aa8ff; --field: #0b0f12; --chip: #26303a; --on-acc: #04121f; --on-bad: #1a0505; }
  :root[data-theme="light"] { --bg: #f4f6f8; --card: #fff; --line: #d5dde4; --ink: #17202a; --dim: #5d6b76; --ok: #0f7a45; --bad: #b42318; --warn: #8a5a00; --acc: #1769c2; --field: #fff; --chip: #e6ebef; --on-acc: #fff; --on-bad: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 48px; cursor: pointer; }
  button.primary { background: var(--acc); border-color: var(--acc); color: var(--on-acc); font-weight: 700; }
  button.bad { border-color: var(--bad); color: var(--bad); }
  input { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header b { font-size: 18px; }
  header .who { color: var(--dim); font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header a { color: var(--acc); font-size: 14px; }
  .modes { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; }
  .modes button { min-height: 40px; padding: 8px 12px; white-space: nowrap; }
  .modes button.on { background: var(--ink); color: var(--bg); font-weight: 700; }
  main { flex: 1; padding: 0 12px 12px; display: grid; gap: 10px; align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .kicker { color: var(--dim); font-size: 14px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .kicker .code { text-transform: none; letter-spacing: 0; }
  .big { font-size: 30px; font-weight: 800; line-height: 1.1; margin: 4px 0; overflow-wrap: anywhere; }
  .mid { font-size: 20px; font-weight: 700; }
  .dim { color: var(--dim); }
  .steps { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .steps span { font-size: 14px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); color: var(--dim); }
  .steps span.done { border-color: var(--ok); color: var(--ok); }
  .steps span.now { border-color: var(--acc); color: var(--ink); font-weight: 700; }
  form.scan { display: flex; gap: 8px; align-items: center; }
  form.scan label { flex: 1; display: block; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .qty { display: flex; gap: 8px; align-items: center; }
  .qty input { font-size: 26px; font-weight: 800; text-align: center; }
  .qty button { min-width: 56px; font-size: 22px; }
  .msg { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
  .msg.ok { border-color: var(--ok); color: var(--ok); }
  .msg.bad { border-color: var(--bad); color: var(--bad); }
  #net { padding: 6px 12px; font-size: 14px; border-bottom: 1px solid var(--line); display: none; }
  #net.off { display: block; background: rgba(255, 176, 32, .18); color: var(--warn); }
  #net.bad { display: block; background: rgba(255, 90, 82, .16); color: var(--bad); }
  #net button { min-height: 32px; padding: 4px 10px; font-size: 14px; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
</style>
<script src="camera.js"></script>
<script src="src/offline-queue.js"></script>
</head>
<body>
<header><b>Bins</b><span class="who" id="who"></span><select data-theme-picker></select><a href="app" id="back">App</a></header>
<div id="net" aria-live="polite"></div>
<nav class="modes" id="modes"></nav>
<main>
  <div class="card" id="job"></div>
  <form class="scan" id="scanForm" autocomplete="off"><label><input id="scanIn" placeholder="Scan…" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters"></label><button class="primary">Enter</button></form>
  <div id="extra"></div>
  <div id="say"></div>
</main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let me = null;
  let MODS = null;
  let mode = null;
  let st = {};

  // A failure to reach the server, as opposed to the server saying no.
  const offline = (msg) => Object.assign(new Error(msg || 'No connection'), { network: true });
  async function api(method, path, body, requestId = null) {
    if (window.SortedLocal) {
      const r = await window.SortedLocal.fetch(method, path, body, { operator: (me && me.username) || 'picker', requestId });
      if (r.status >= 400) throw new Error((r.body && r.body.error) || 'Refused');
      return r.body;
    }
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    let res;
    try {
      res = await fetch(path, { method, signal: ctl.signal, headers: { 'content-type': 'application/json', ...(requestId ? { 'x-request-id': requestId } : {}) }, body: body ? JSON.stringify(body) : undefined });
    } catch (e) {
      throw offline();
    } finally {
      clearTimeout(timer);
    }
    if (res.status === 401) { location.assign('/login?next=' + encodeURIComponent('/bins')); throw new Error('Sign in required'); }
    if (res.status >= 502) throw offline(`The server is not answering (${res.status})`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  // ---- Working offline ----------------------------------------------------------
  // Changes made without a connection wait on the phone and go out in order when
  // it is back; a refusal stops the rest so nothing runs on the wrong stock.
  // Lookups use the copy below, refreshed while online.
  let queue = null;
  let seq = 0;
  let cache = { at: null, items: [], bins: {}, tasks: [] };
  const CACHE_KEY = () => `sorted.bins.cache.${(me && me.username) || 'anyone'}`;
  function saveCache() { try { localStorage.setItem(CACHE_KEY(), JSON.stringify(cache)); } catch (e) { /* storage optional */ } }
  function loadCache() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY()) || 'null'); if (c && c.bins) cache = c; } catch (e) { /* storage optional */ } }
  async function refreshCache() {
    if (window.SortedLocal || (queue && queue.snapshot().pending.length)) return;
    try {
      const [items, bins, tasks] = await Promise.all([
        can('items.read') || can('stock.read') ? api('GET', '/api/items') : [],
        api('GET', '/api/bins'),
        can('picks.execute') && modOn('waves') ? api('GET', '/api/waves/tasks?kind=bin&mine=1') : [],
      ]);
      cache = {
        at: Date.now(),
        items: items.map((i) => ({ itemNo: i.itemNo, name: i.name, unit: i.uom || null, gtin: i.gtin || null, unitGtin: i.unitGtin || null, codes: i.codes || [], barcodes: (i.barcodes || []).map((b) => b.value), packs: i.packs || [], serialized: Boolean(i.serialized) })),
        bins: Object.fromEntries((bins.bins || []).map((b) => [b.code, b])),
        tasks,
      };
      saveCache();
    } catch (e) { /* keep the copy we have */ }
  }
  function findItem(code) {
    const k = String(code || '').trim().toUpperCase();
    for (const i of cache.items) {
      const pack = i.packs.find((p) => same(p.barcode, k));
      if (pack || same(i.itemNo, k) || same(i.gtin, k) || same(i.unitGtin, k) || i.codes.some((c) => same(c, k)) || i.barcodes.some((b) => same(b, k))) return { itemNo: i.itemNo, name: i.name, unit: i.unit, packs: i.packs, serialized: i.serialized, pack: pack || null };
    }
    return null;
  }
  function cachedBin(code) {
    const key = Object.keys(cache.bins).find((c) => same(c, code));
    return key ? cache.bins[key] : null;
  }
  // Keep the copy in step with what was just done, until the next refresh.
  function cacheChange(loc, itemNo, delta, set = null) {
    const bin = cachedBin(loc) || (cache.bins[loc] = { code: loc, mixed: true, lines: [] });
    let line = bin.lines.find((l) => l.itemNo === itemNo);
    if (!line) { const i = cache.items.find((x) => x.itemNo === itemNo) || {}; line = { itemNo, name: i.name || '', qty: 0, unit: i.unit || null }; bin.lines.push(line); }
    line.qty = set != null ? set : Math.max(0, line.qty + delta);
    bin.lines = bin.lines.filter((l) => l.qty > 0);
    saveCache();
  }
  /** A change: sent now when possible, else kept on the phone. Returns the answer, or { queued: true }. */
  async function write(method, path, body) {
    const id = `${(me && me.username) || 'bins'}-${Date.now().toString(36)}-${++seq}`;
    if (!queue || window.SortedLocal) return api(method, path, body);
    if (queue.snapshot().pending.length) { queue.enqueue({ method, path, body, id }); showNet(); flush(); return { queued: true }; }
    try {
      return await api(method, path, body, id);
    } catch (e) {
      if (!e.network) throw e;
      queue.enqueue({ method, path, body, id });
      showNet();
      return { queued: true };
    }
  }
  let flushing = false;
  async function flush() {
    if (!queue || flushing || !queue.snapshot().pending.length) return showNet();
    flushing = true;
    try {
      const r = await queue.flush((item) => api(item.method, item.path, item.body, item.id));
      if (r.stopped === null) { await refreshCache(); if (r.sent) say(`Back online: ${r.sent} saved scan${r.sent === 1 ? '' : 's'} sent`); }
    } finally {
      flushing = false;
      showNet();
    }
  }
  // A saved change in words, for the list of ones the warehouse did not accept.
  function describe(item) {
    const b = item.body || {};
    const task = (item.path.match(/tasks\/([^/]+)\//) || [])[1];
    if (/\/confirm$/.test(item.path)) return `Pick ${decodeURIComponent(task)}`;
    if (/\/short$/.test(item.path)) return `Not enough for ${decodeURIComponent(task)}`;
    if (/\/(claim|release)$/.test(item.path)) return `${/claim$/.test(item.path) ? 'Taking' : 'Leaving'} ${decodeURIComponent(task)}`;
    if (item.path.endsWith('/bins/put')) return `Put ${b.qty} ${b.code || b.itemNo} in ${b.loc}`;
    if (item.path.endsWith('/bins/take')) return `Take ${b.qty} ${b.itemNo} from ${b.loc}`;
    if (item.path.endsWith('/bins/move')) return `Move ${b.qty} ${b.itemNo} from ${b.from} to ${b.to}`;
    if (item.path.endsWith('/bins/count')) return `Count of ${b.itemNo} in ${b.loc}`;
    return item.path;
  }
  function showNet() {
    const el = $('net');
    if (!queue) return;
    const { pending, conflicts } = queue.snapshot();
    if (conflicts.length) {
      el.className = 'bad';
      el.innerHTML = `${conflicts.length} saved scan${conflicts.length === 1 ? ' was' : 's were'} not accepted${pending.length ? `; ${pending.length} more wait behind ${conflicts.length === 1 ? 'it' : 'them'}` : ''}: ${conflicts.map((c, i) => `<div>${esc(describe(c))}: ${esc(c.error)} <button type="button" data-drop="${i}">Discard</button></div>`).join('')}${pending.length ? '<button type="button" id="retry">Send the rest</button>' : ''}`;
    } else if (pending.length) {
      el.className = 'off';
      el.innerHTML = `Offline: ${pending.length} scan${pending.length === 1 ? '' : 's'} saved on this phone, sent when the connection is back. <button type="button" id="retry">Try now</button>`;
    } else {
      el.className = '';
      el.innerHTML = '';
    }
  }
  const queuedNote = () => { const n = queue ? queue.snapshot().pending.length : 0; return `Saved on this phone (${n} waiting). It goes to the warehouse when the connection is back`; };
  const can = (p) => !me || !me.permissions || me.permissions.includes(p);
  const modOn = (id) => !MODS || (MODS.modules.find((m) => m.id === id) || {}).on !== false;
  const say = (text, ok = true) => { $('say').innerHTML = text ? `<div class="msg ${ok ? 'ok' : 'bad'}">${esc(text)}</div>` : ''; if (navigator.vibrate) navigator.vibrate(ok ? 40 : [80, 60, 80]); };
  const same = (a, b) => String(a || '').trim().toUpperCase() === String(b || '').trim().toUpperCase();

  const MODES = [
    ['pick', 'Pick', () => can('picks.execute')],
    ['put', 'Put away', () => can('inbound.write')],
    ['move', 'Move', () => can('moves.execute')],
    ['count', 'Count', () => can('counts.execute')],
    ['check', 'Check', () => can('stock.read')],
  ];

  function steps(list, at) {
    return `<div class="steps">${list.map((s, i) => `<span class="${i < at ? 'done' : i === at ? 'now' : ''}">${esc(s)}</span>`).join('')}</div>`;
  }
  function qtyBox(value, label = 'How many') {
    return `<div class="kicker" style="margin-top:10px">${esc(label)}</div><div class="qty"><button type="button" data-step="-1">−</button><input id="qty" inputmode="numeric" value="${esc(value)}"><button type="button" data-step="1">+</button></div>`;
  }
  const qty = () => Number(($('qty') || {}).value || 0);
  // What a scanned code is: an item (or one of its boxes), a bin, or nothing known.
  async function itemOf(code) {
    try { const f = await api('GET', '/api/bins?item=' + encodeURIComponent(code)); return { itemNo: f.itemNo, name: f.name, unit: f.unit, packs: f.packs, serialized: f.serialized }; } catch (e) { return e.network ? findItem(code) : null; }
  }
  // Traced items: one serial number scanned per piece. st.sns collects them, st.need is how many.
  function serialBox() {
    return `<div class="kicker" style="margin-top:10px">Serial numbers: ${st.sns.length} of ${st.need}</div><div class="dim">${st.sns.map(esc).join(' · ') || 'Scan the serial number on each piece'}</div>${st.sns.length ? '<p><button type="button" id="undoSn">Undo the last serial</button></p>' : ''}`;
  }
  function addSerial(code, itemNo) {
    const sn = String(code).trim().toUpperCase();
    if (same(sn, itemNo)) { say('That is the item barcode. Scan the serial number', false); return false; }
    if (st.sns.includes(sn)) { say(`${sn} is already scanned`, false); return false; }
    if (st.sns.length >= st.need) { say(`All ${st.need} serials are scanned`, false); return false; }
    st.sns.push(sn);
    say('');
    return true;
  }
  async function binOf(code) {
    try { return await api('GET', '/api/bins/' + encodeURIComponent(code)); } catch (e) {
      if (!e.network) return null;
      // Offline: the copy, or a bin we have no copy of (empty as far as we know).
      return cachedBin(code) || (findItem(code) ? null : { code: String(code).trim(), mixed: true, lines: [], unknown: true });
    }
  }

  // ---- Pick ------------------------------------------------------------------
  const pick = {
    async start() {
      st = {};
      if (!modOn('waves')) return pick.byOrder();
      let tasks;
      try { tasks = await api('GET', '/api/waves/tasks?kind=bin&mine=1'); cache.tasks = tasks; saveCache(); } catch (e) {
        if (!e.network) throw e;
        tasks = cache.tasks || [];
      }
      const t = tasks[0];
      if (!t) {
        $('job').innerHTML = '<div class="kicker">Pick</div><div class="mid">No bin picks right now</div><div class="dim">The next pick wave brings them. Scan an order number to pick it by hand.</div>';
        st.step = 'order';
        return;
      }
      if (t.claimedBy !== me.username) { try { await write('POST', `/api/waves/tasks/${encodeURIComponent(t.id)}/claim`, {}); t.claimedBy = me.username; } catch (e) { cache.tasks = (cache.tasks || []).filter((x) => x.id !== t.id); return pick.start(); } }
      st = { task: t, step: 'bin' };
      pick.draw();
    },
    draw() {
      const t = st.task;
      $('job').innerHTML = `<div class="kicker">Pick for <span class="code">${esc(t.orderId)}</span></div>
        <div class="dim">Go to</div><div class="big">${esc(t.loc)}</div>
        <div class="mid">${esc(t.qty)} ${esc(t.unit || '')} · ${esc(t.itemNo)}</div><div class="dim">${esc(t.name)}${t.batch ? ` · batch <b>${esc(t.batch)}</b>` : ''}${t.expiry ? ` · best before <b>${esc(t.expiry)}</b>` : ''}</div>
        ${st.step === 'serials' || (t.serialized && st.step === 'take') ? serialBox() : ''}
        ${t.serialized ? steps(['Scan the bin', 'Scan the item', 'Serial numbers', 'Take them'], { bin: 0, item: 1, serials: 2, take: 3 }[st.step]) : steps(['Scan the bin', 'Scan the item', 'Take them'], { bin: 0, item: 1, take: 2 }[st.step])}`;
      $('extra').innerHTML = `<div class="row"><button type="button" id="short" class="bad">Not enough here</button><button type="button" id="skip">Later</button></div>${st.step === 'take' ? `<p><button type="button" class="primary" id="took" style="width:100%">Took ${esc(t.qty)}</button></p>` : ''}`;
      st.redraw = pick.draw;
      $('short').onclick = pick.short;
      $('skip').onclick = async () => { await write('POST', `/api/waves/tasks/${encodeURIComponent(t.id)}/release`, {}).catch(() => {}); cache.tasks = (cache.tasks || []).filter((x) => x.id !== t.id).concat({ ...t, claimedBy: null }); saveCache(); say(`${t.loc} left for later`); pick.start(); };
      if ($('took')) $('took').onclick = pick.take;
    },
    async scan(code) {
      if (st.step === 'order') return pick.order(code);
      if (st.byOrder) return pick.orderScan(code);
      const t = st.task;
      if (st.step === 'bin') {
        if (!same(code, t.loc)) return say(`That is ${code}. Go to ${t.loc}`, false);
        st.step = 'item';
        say('');
        return pick.draw();
      }
      if (st.step === 'item') {
        const found = await itemOf(code);
        if (!found || found.itemNo !== t.itemNo) return say(`${found ? found.itemNo : code} is not ${t.itemNo}. Check the bin`, false);
        if (t.serialized) Object.assign(st, { step: 'serials', sns: [], need: t.qty });
        else st.step = 'take';
        say('');
        return pick.draw();
      }
      if (st.step === 'serials') {
        if (addSerial(code, t.itemNo) && st.sns.length === st.need) st.step = 'take';
        return pick.draw();
      }
      if (st.step === 'take') return pick.take();
    },
    async take() {
      const t = st.task;
      const r = await write('POST', `/api/waves/tasks/${encodeURIComponent(t.id)}/confirm`, { scan: t.loc, serials: t.serialized ? st.sns : null });
      cache.tasks = (cache.tasks || []).filter((x) => x.id !== t.id);
      cacheChange(t.loc, t.itemNo, -t.qty);
      say(r.queued ? `Took ${t.qty} ${t.itemNo}. ${queuedNote()}` : `Took ${t.qty} ${t.itemNo} from ${t.loc}. Drop at ${t.dropTo || 'the post-pick lane'}`);
      pick.start();
    },
    async short() {
      const t = st.task;
      const found = prompt(`How many ${t.itemNo} are there? (empty if none)`, '');
      if (found === null) return;
      const r = await write('POST', `/api/waves/tasks/${encodeURIComponent(t.id)}/short`, { found: found === '' ? null : Number(found) });
      cache.tasks = (cache.tasks || []).filter((x) => x.id !== t.id && x.loc !== t.loc);
      saveCache();
      say(r.queued ? `${t.loc} reported. ${queuedNote()}` : `${t.loc} is held for a stock check. The pick is planned again from other stock.`, false);
      pick.start();
    },
    // Without pick waves: scan an order and pick its piece lines from the bins.
    byOrder() {
      st = { step: 'order' };
      $('job').innerHTML = '<div class="kicker">Pick an order</div><div class="mid">Scan the order number</div>';
      $('extra').innerHTML = '';
    },
    async order(code) {
      let orders;
      try { orders = await api('GET', '/api/orders'); } catch (e) { if (e.network) return say('Picking an order by its number needs the connection', false); throw e; }
      const order = orders.find((o) => same(o.id, code));
      if (!order) return say(`No order ${code}`, false);
      st = { byOrder: true, order: order.id, lines: [] };
      for (const l of order.lines.filter((x) => x.kind === 'each' && (x.picked || 0) < x.units)) {
        const where = await api('GET', '/api/bins?item=' + encodeURIComponent(l.itemNo));
        st.lines.push({ itemNo: l.itemNo, name: where.name, unit: where.unit, serialized: where.serialized, need: l.units - (l.picked || 0), bins: where.bins });
      }
      pick.nextLine();
    },
    nextLine() {
      const line = st.lines.find((l) => l.need > 0);
      if (!line) { say(`Order ${st.order} is picked`); return pick.start(); }
      const bin = line.bins.find((b) => b.qty > 0);
      st.line = line;
      st.bin = bin ? bin.loc : null;
      st.step2 = 'bin';
      $('job').innerHTML = `<div class="kicker">Order <span class="code">${esc(st.order)}</span></div>${bin ? `<div class="dim">Go to</div><div class="big">${esc(bin.loc)}</div>` : '<div class="mid">Not in any bin</div>'}
        <div class="mid">${esc(Math.min(line.need, bin ? bin.qty : line.need))} ${esc(line.unit || '')} · ${esc(line.itemNo)}</div><div class="dim">${esc(line.name)}</div>${steps(['Scan the bin', 'Scan the item', 'Take them'], 0)}`;
      $('extra').innerHTML = '';
    },
    async orderScan(code) {
      const line = st.line;
      if (st.step2 === 'bin') {
        if (!st.bin || !same(code, st.bin)) return say(`Go to ${st.bin || 'the office: it is not in a bin'}`, false);
        st.step2 = 'item';
        $('job').querySelector('.steps').outerHTML = steps(['Scan the bin', 'Scan the item', 'Take them'], 1);
        return say('');
      }
      const bin = line.bins.find((b) => b.loc === st.bin);
      const take = Math.min(line.need, bin.qty);
      if (st.step2 === 'serials') {
        if (!addSerial(code, line.itemNo)) return;
        $('job').querySelector('.sn').innerHTML = serialBox();
        if (st.sns.length < st.need) return;
      } else {
        const found = await itemOf(code);
        if (!found || found.itemNo !== line.itemNo) return say(`${found ? found.itemNo : code} is not ${line.itemNo}`, false);
        if (line.serialized) {
          Object.assign(st, { step2: 'serials', sns: [], need: take });
          st.redraw = () => { $('job').querySelector('.sn').innerHTML = serialBox(); };
          $('job').insertAdjacentHTML('beforeend', `<div class="sn">${serialBox()}</div>`);
          return say('');
        }
      }
      const r = await write('POST', '/api/bins/take', { loc: st.bin, itemNo: line.itemNo, qty: take, orderId: st.order, serials: line.serialized ? st.sns : null });
      line.need -= take;
      bin.qty -= take;
      cacheChange(st.bin, line.itemNo, -take);
      say(r.queued ? `Took ${take} ${line.itemNo}. ${queuedNote()}` : `Took ${take} ${line.itemNo} from ${st.bin}`);
      pick.nextLine();
    },
  };

  // ---- Put away ----------------------------------------------------------------
  const put = {
    start() {
      st = { step: 'item' };
      $('job').innerHTML = `<div class="kicker">Put away</div><div class="mid">Scan the item or its box</div>${steps(['Item', 'How many', 'Scan the bin'], 0)}`;
      $('extra').innerHTML = '';
    },
    async scan(code) {
      if (st.step === 'item') {
        let found;
        try { found = await api('GET', '/api/bins/suggest?item=' + encodeURIComponent(code)); } catch (e) {
          const known = e.network && findItem(code);
          if (!known) return say(`${code} is not an item or a box barcode`, false);
          const holding = Object.values(cache.bins).find((b) => b.lines.some((l) => l.itemNo === known.itemNo));
          found = { itemNo: known.itemNo, name: known.name, unit: known.unit, serialized: known.serialized, best: holding ? { loc: holding.code, why: `held ${known.itemNo} when last online` } : null, others: [] };
        }
        const box = await itemOf(code);
        const pack = box && (box.packs || []).find((p) => same(p.barcode, code));
        st = { step: 'qty', code, itemNo: found.itemNo, pack, hint: found, serialized: found.serialized, sns: [], need: 0 };
        $('job').innerHTML = `<div class="kicker">Put away</div><div class="mid">${esc(found.itemNo)}</div><div class="dim">${esc(found.name)}</div>
          ${found.best ? `<div class="dim" style="margin-top:8px">Put it in</div><div class="big">${esc(found.best.loc)}</div><div class="dim">${esc(found.best.why)}${found.others.length ? ` · or ${found.others.map((o) => esc(o.loc)).join(', ')}` : ''}</div>` : '<div class="msg bad">No bin has room. Scan any bin</div>'}
          ${qtyBox(1, pack ? `How many ${pack.unit} (of ${pack.per})` : `How many ${found.unit || ''}`)}
          ${found.lots ? '<div class="row" style="margin-top:8px"><label class="dim">Batch<input id="lotBatch" autocomplete="off"></label><label class="dim">Best before<input id="lotExpiry" type="date"></label></div>' : ''}<div class="sn"></div>${steps(found.serialized ? ['Item', 'How many', 'Serial numbers', 'Scan the bin'] : ['Item', 'How many', 'Scan the bin'], 2)}`;
        $('extra').innerHTML = found.serialized ? '<p class="dim">Scan the serial number on each piece, then the bin. <button type="button" id="noSn">No serials this time</button></p>' : '';
        if ($('noSn')) $('noSn').onclick = () => { st.serialized = false; $('extra').innerHTML = '<p class="dim">Without serials: scan the bin.</p>'; $('job').querySelector('.sn').innerHTML = ''; };
        st.redraw = () => { $('job').querySelector('.sn').innerHTML = serialBox(); };
        return say('');
      }
      const n = qty();
      if (!(n > 0)) return say('Enter how many', false);
      if (st.serialized) {
        st.need = n * (st.pack ? st.pack.per : 1);
        if (st.sns.length < st.need) {
          if (addSerial(code, st.itemNo)) st.redraw();
          return;
        }
      }
      const lot = { batch: ($('lotBatch') || {}).value || null, expiry: ($('lotExpiry') || {}).value || null };
      const done = await write('POST', '/api/bins/put', { loc: code, code: st.pack ? st.code : st.itemNo, qty: n, ...lot, serials: st.serialized ? st.sns : null });
      const pieces = n * (st.pack ? st.pack.per : 1);
      cacheChange(code, st.itemNo, pieces);
      say(done.queued ? `Put ${pieces} ${st.itemNo} in ${code}. ${queuedNote()}` : `Put ${done.qty} ${done.unit || ''} ${done.itemNo} in ${done.loc}`);
      put.start();
    },
  };

  // ---- Move --------------------------------------------------------------------
  const move = {
    start() {
      st = { step: 'from' };
      $('job').innerHTML = `<div class="kicker">Move</div><div class="mid">Scan the bin it comes from</div>${steps(['From bin', 'Item', 'How many', 'To bin'], 0)}`;
      $('extra').innerHTML = '';
    },
    async scan(code) {
      if (st.step === 'from') {
        const bin = await binOf(code);
        if (!bin) return say(`${code} is not a bin`, false);
        if (!bin.lines.length) return say(`${bin.code} is empty`, false);
        st = { step: 'item', from: bin.code, bin };
        $('job').innerHTML = `<div class="kicker">Move from <span class="code">${esc(bin.code)}</span></div><div class="mid">Scan the item</div>${table(bin)}${steps(['From bin', 'Item', 'How many', 'To bin'], 1)}`;
        return say('');
      }
      if (st.step === 'item') {
        const found = await itemOf(code);
        const line = found && st.bin.lines.find((l) => l.itemNo === found.itemNo);
        if (!line) return say(`${found ? found.itemNo : code} is not in ${st.from}`, false);
        st.step = 'to';
        st.itemNo = line.itemNo;
        Object.assign(st, { serialized: Boolean(found.serialized), sns: [], need: 0 });
        $('job').innerHTML = `<div class="kicker">Move from <span class="code">${esc(st.from)}</span></div><div class="mid">${esc(line.itemNo)}</div><div class="dim">${esc(line.name)} · ${esc(line.qty)} here</div>${qtyBox(found.serialized ? 1 : line.qty)}<div class="sn"></div><div class="dim" style="margin-top:8px">${found.serialized ? 'Scan the serial number on each piece, then the bin it goes to' : 'Then scan the bin it goes to'}</div>${steps(['From bin', 'Item', 'How many', 'To bin'], 3)}`;
        st.redraw = () => { $('job').querySelector('.sn').innerHTML = serialBox(); };
        return say('');
      }
      const n = qty();
      if (!(n > 0)) return say('Enter how many', false);
      if (st.serialized) {
        st.need = n;
        if (st.sns.length < st.need) {
          if (addSerial(code, st.itemNo)) st.redraw();
          return;
        }
      }
      const done = await write('POST', '/api/bins/move', { from: st.from, to: code, itemNo: st.itemNo, qty: n, serials: st.serialized ? st.sns : null });
      cacheChange(st.from, st.itemNo, -n);
      cacheChange(code, st.itemNo, n);
      say(done.queued ? `Moved ${n} ${st.itemNo} to ${code}. ${queuedNote()}` : `Moved ${done.qty} ${done.itemNo} from ${done.from} to ${done.to}`);
      move.start();
    },
  };

  // ---- Count (blind) -----------------------------------------------------------
  const count = {
    async start() {
      if (modOn('abc')) {
        try {
          const mine = await api('GET', '/api/abc/mine');
          if (mine.line) {
            st = { step: 'abc', line: mine.line };
            $('job').innerHTML = `<div class="kicker">Cycle count · class ${esc(mine.line.class)}</div><div class="big">${esc(mine.line.loc)}</div><div class="mid">${esc(mine.line.itemNo)}</div><div class="dim">${esc(mine.line.name || '')}. ${mine.line.status === 'recount' ? 'Recount.' : 'Blind count.'} The booked quantity is not shown. Scan the location, then enter how many.</div><p><input id="abcQty" inputmode="numeric" placeholder="Quantity" style="font-size:20px;padding:10px;width:8em"></p><p><button type="button" class="primary" id="abcSave">${mine.line.status === 'recount' ? 'Submit recount' : 'Submit count'}</button></p>`;
            $('extra').innerHTML = '';
            $('abcSave').onclick = async () => {
              const raw = ($('#abcQty') || {}).value;
              if (raw === '') return say('Enter the count', false);
              const path = mine.line.status === 'recount' ? 'recount' : 'count';
              const out = await write('POST', '/api/abc/' + encodeURIComponent(mine.line.id) + '/' + path, { qty: Number(raw), reason: Number(raw) === 0 ? 'missing' : null });
              if (out.queued) return say('Count saved on this phone until the connection returns');
              say(out.status === 'recount' ? 'Over the threshold. Someone else recounts it before stock changes.' : out.status === 'approval' ? 'Recount saved. A supervisor approves it before stock changes.' : 'Count accepted.');
              count.start();
            };
            return;
          }
        } catch (e) { /* no list yet: the ordinary bin count */ }
      }
      st = { step: 'bin' };
      $('job').innerHTML = '<div class="kicker">Count</div><div class="mid">Scan the bin</div><div class="dim">You count first; the screen does not say what should be there.</div>';
      $('extra').innerHTML = '';
    },
    draw() {
      const counting = st.itemNo && st.serialized
        ? `<div class="dim">${esc(st.name || '')}</div><div class="kicker" style="margin-top:10px">Serial numbers scanned: ${st.sns.length}</div><div class="dim">${st.sns.map(esc).join(' · ') || 'Scan the serial number on every piece in the bin'}</div>${st.sns.length ? '<p><button type="button" id="undoSn">Undo the last serial</button></p>' : ''}<p><button type="button" class="primary" id="save" style="width:100%">Save count: ${st.sns.length}</button></p>`
        : st.itemNo ? `<div class="dim">${esc(st.name || '')}</div>${qtyBox('', `How many ${st.unit || ''} are there`)}<p><button type="button" class="primary" id="save" style="width:100%">Save count</button></p>` : '';
      $('job').innerHTML = `<div class="kicker">Counting <span class="code">${esc(st.loc)}</span></div><div class="mid">${st.itemNo ? esc(st.itemNo) : 'Scan an item in the bin'}</div>${counting}
        ${st.done.length ? `<div class="dim" style="margin-top:8px">Counted: ${st.done.map((d) => `${esc(d.itemNo)} ${esc(d.after)}${d.difference ? ` (was ${esc(d.before)})` : ''}`).join(' · ')}</div>` : ''}`;
      $('extra').innerHTML = '<p><button type="button" id="binDone" style="width:100%">Bin done</button></p>';
      if ($('save')) $('save').onclick = count.save;
      $('binDone').onclick = count.finish;
      if ($('qty')) $('qty').focus();
      st.redraw = count.draw;
    },
    async scan(code) {
      if (st.step === 'abc') {
        if (code !== st.line.loc) return say(`This count is at ${st.line.loc}`, false);
        say(`${code} confirmed. Enter the quantity.`);
        const q = $('#abcQty');
        if (q) q.focus();
        return;
      }
      if (st.step === 'bin') {
        const bin = await binOf(code);
        if (!bin) return say(`${code} is not a bin`, false);
        st = { step: 'item', loc: bin.code, done: [] };
        say('');
        return count.draw();
      }
      if (st.itemNo && st.serialized) {
        if (!code) return count.save();
        st.need = Infinity;
        if (addSerial(code, st.itemNo)) count.draw();
        return;
      }
      if (st.itemNo && ($('qty') || {}).value) return count.save();
      const found = await itemOf(code);
      if (!found) return say(`${code} is not an item`, false);
      Object.assign(st, { itemNo: found.itemNo, name: found.name, unit: found.unit, serialized: Boolean(found.serialized), sns: [] });
      say('');
      count.draw();
    },
    async save() {
      let r;
      let n;
      if (st.serialized) { n = st.sns.length; r = await write('POST', '/api/bins/count', { loc: st.loc, itemNo: st.itemNo, serials: st.sns }); }
      else {
        const raw = ($('qty') || {}).value;
        if (raw === '' || raw == null) return say('Enter the count', false);
        n = Number(raw);
        r = await write('POST', '/api/bins/count', { loc: st.loc, itemNo: st.itemNo, counted: n });
      }
      cacheChange(st.loc, st.itemNo, 0, n);
      if (r.queued) {
        st.done.push({ itemNo: st.itemNo, after: n, before: null, difference: 0 });
        st.itemNo = null;
        st.serialized = false;
        say(`${st.done[st.done.length - 1].itemNo}: ${n}. ${queuedNote()}`);
        return count.draw();
      }
      st.done.push(r);
      st.itemNo = null;
      st.serialized = false;
      const lost = r.serials && r.serials.missing.length ? ` Missing: ${r.serials.missing.join(', ')}` : '';
      say(r.difference || lost ? `${r.itemNo} was ${r.before}, now ${r.after}.${lost}` : `${r.itemNo}: ${r.after}, as booked`, !r.difference && !lost);
      count.draw();
    },
    async finish() {
      const bin = await binOf(st.loc);
      const missed = bin.lines.filter((l) => !st.done.some((d) => d.itemNo === l.itemNo));
      if (!missed.length) {
        const changed = st.done.filter((d) => d.difference).map((d) => `${d.itemNo} ${d.before} → ${d.after}`);
        say(changed.length ? `${st.loc} counted. Corrected: ${changed.join(', ')}` : `${st.loc} counted, all as booked`, !changed.length);
        return count.start();
      }
      $('job').innerHTML = `<div class="kicker"><span class="code">${esc(st.loc)}</span>: not counted yet</div><div class="dim">These are booked in this bin. Count them, or say they are not here.</div>
        ${missed.map((l) => `<div class="row" style="margin-top:8px;align-items:center"><div><b>${esc(l.itemNo)}</b> <span class="dim">${esc(l.name)}</span></div><button type="button" class="bad" data-zero="${esc(l.itemNo)}">Not here</button></div>`).join('')}`;
      $('extra').innerHTML = '<p class="dim">Or scan one of them to count it.</p>';
      $('job').onclick = async (e) => {
        const b = e.target.closest('[data-zero]');
        if (!b) return;
        const r = await write('POST', '/api/bins/count', { loc: st.loc, itemNo: b.dataset.zero, counted: 0, serials: [] });
        cacheChange(st.loc, b.dataset.zero, 0, 0);
        st.done.push(r.queued ? { itemNo: b.dataset.zero, after: 0, before: null, difference: 0 } : r);
        $('job').onclick = null;
        count.finish();
      };
    },
  };

  // ---- Check -------------------------------------------------------------------
  function table(bin) {
    return `<table><tr><th>Item</th><th>Qty</th><th>Batch</th></tr>${bin.lines.map((l) => `<tr><td><b>${esc(l.itemNo)}</b> <span class="dim">${esc(l.name)}</span></td><td>${esc(l.qty)}${l.packs ? `<div class="dim">${esc(l.packs)}</div>` : ''}</td><td>${esc(l.batch || '')}</td></tr>`).join('') || '<tr><td colspan="3" class="dim">Empty</td></tr>'}</table>`;
  }
  const check = {
    start() {
      st = {};
      $('job').innerHTML = '<div class="kicker">Check</div><div class="mid">Scan a bin or an item</div>';
      $('extra').innerHTML = '';
    },
    async scan(code) {
      const bin = await binOf(code);
      if (bin) { $('job').innerHTML = `<div class="kicker">Bin</div><div class="big">${esc(bin.code)}</div>${bin.mixed ? '' : '<div class="dim">One item only</div>'}${table(bin)}`; return say(''); }
      try {
        const f = await api('GET', '/api/bins?item=' + encodeURIComponent(code));
        $('job').innerHTML = `<div class="kicker">Item</div><div class="mid">${esc(f.itemNo)}</div><div class="dim">${esc(f.name)} · ${esc(f.total)} ${esc(f.unit || '')} in bins</div>
          <table><tr><th>Bin</th><th>Qty</th><th>Best before</th></tr>${f.bins.map((b) => `<tr><td><b>${esc(b.loc)}</b></td><td>${esc(b.qty)}</td><td>${esc(b.expiry || '')}</td></tr>`).join('') || '<tr><td colspan="3" class="dim">Not in any bin</td></tr>'}</table>`;
        say('');
      } catch (e) {
        const known = e.network && findItem(code);
        if (!known) return say(`${code} is not a bin or an item`, false);
        const where = Object.values(cache.bins).flatMap((b) => b.lines.filter((l) => l.itemNo === known.itemNo).map((l) => ({ loc: b.code, qty: l.qty })));
        $('job').innerHTML = `<div class="kicker">Item, as last seen online</div><div class="mid">${esc(known.itemNo)}</div><div class="dim">${esc(known.name)}</div>
          <table><tr><th>Bin</th><th>Qty</th></tr>${where.map((b) => `<tr><td><b>${esc(b.loc)}</b></td><td>${esc(b.qty)}</td></tr>`).join('') || '<tr><td colspan="2" class="dim">Not in any bin</td></tr>'}</table>`;
        say('');
      }
    },
  };

  const HANDLERS = { pick, put, move, count, check };

  function drawModes() {
    const allowed = MODES.filter(([, , ok]) => ok());
    $('modes').innerHTML = allowed.map(([id, label]) => `<button type="button" data-mode="${id}" class="${id === mode ? 'on' : ''}">${label}</button>`).join('');
  }
  async function setMode(next) {
    mode = next;
    try { sessionStorage.setItem('binsMode', mode); } catch (e) { /* storage optional */ }
    drawModes();
    say('');
    try { await HANDLERS[mode].start(); } catch (e) { say(e.message, false); }
    $('scanIn').focus();
  }
  $('modes').onclick = (e) => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); };
  document.addEventListener('click', (e) => {
    if (e.target.id === 'undoSn' && st.sns && st.sns.length) { st.sns.pop(); if (st.step === 'take') st.step = 'serials'; if (st.redraw) st.redraw(); return; }
    const b = e.target.closest('[data-step]');
    if (!b || !$('qty')) return;
    $('qty').value = Math.max(0, (Number($('qty').value) || 0) + Number(b.dataset.step));
  });
  $('scanForm').onsubmit = async (e) => {
    e.preventDefault();
    const code = $('scanIn').value.trim();
    $('scanIn').value = '';
    if (!code && !(mode === 'count' && st.itemNo)) return;
    try { await HANDLERS[mode].scan(code); } catch (err) { say(err.message, false); }
    $('scanIn').focus();
  };

  async function start() {
    try {
      if (window.SortedLocal) { // the browser demo: ?as=P1 works as that picker
        const as = (new URLSearchParams(location.search).get('as') || '').toUpperCase().slice(0, 20);
        me = { username: as || 'demo', displayName: as ? `Picker ${as}` : 'Demo', permissions: null };
      }
      else {
        me = (await api('GET', '/api/session')).user;
        try { localStorage.setItem('sorted.bins.me', JSON.stringify(me)); } catch (e) { /* storage optional */ }
      }
    } catch (e) {
      // Offline when the page opens: work as the person last signed in on this phone.
      let last = null;
      try { last = JSON.parse(localStorage.getItem('sorted.bins.me') || 'null'); } catch (x) { last = null; }
      if (!e.network || !last) { $('job').innerHTML = `<div class="mid">${esc(e.network ? 'No connection, and nobody has signed in on this phone yet.' : e.message)}</div>`; return; }
      me = last;
    }
    try { MODS = await api('GET', '/api/modules'); } catch (e) { MODS = null; }
    window.sortedModuleOn = (id) => modOn(id);
    window.dispatchEvent(new Event('sorted-modules'));
    if (MODS && !modOn('bins')) { $('job').innerHTML = '<div class="mid">Bins are switched off for this warehouse.</div>'; return; }
    if (window.SortedOffline && !window.SortedLocal) {
      queue = window.SortedOffline.createOfflineQueue(localStorage, `sorted.bins.queue.${me.username}`);
      loadCache();
      showNet();
      flush().then(refreshCache);
      window.addEventListener('online', () => flush());
      setInterval(() => { if (queue.snapshot().pending.length) flush(); else refreshCache(); }, 30000);
      $('net').onclick = async (e) => {
        if (e.target.id === 'retry') return flush();
        const d = e.target.closest('[data-drop]');
        if (d) { queue.discardConflict(d.dataset.drop); showNet(); await refreshCache(); }
      };
    }
    $('who').textContent = me.displayName ? `${me.displayName} · ${me.username}` : me.username;
    if (window.SortedLocal) $('back').href = 'app.html';
    let saved = null;
    try { saved = sessionStorage.getItem('binsMode'); } catch (e) { /* storage optional */ }
    const allowed = MODES.filter(([, , ok]) => ok()).map(([id]) => id);
    if (!allowed.length) { $('job').innerHTML = '<div class="mid">This account has no bin work.</div>'; return; }
    setMode(allowed.includes(saved) ? saved : allowed[0]);
  }
  start();
})();
</script>
<script src="/i18n-boot.js"></script>
</body>
