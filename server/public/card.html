<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortedWMS command card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #eef1f4; border-bottom: 1px solid #cfd6dd; }
  .bar button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid #1769c2; background: #1769c2; color: #fff; cursor: pointer; }
  .bar .hint { color: #4d5965; flex: 1 1 300px; }
  .sheet { width: 190mm; margin: 0 auto; padding: 8mm 0; }
  h1 { font-size: 18px; margin: 0 0 1mm; }
  .sub { color: #333; margin: 0 0 4mm; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 5mm 0 2mm; border-bottom: 1.5px solid #000; padding-bottom: 1mm; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 6mm; }
  .cmd { border: 1px solid #000; border-radius: 3mm; padding: 2.5mm 3mm 2mm; break-inside: avoid; display: flex; flex-direction: column; align-items: center; gap: 1mm; }
  .cmd .name { font-size: 20px; font-weight: 800; align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; }
  .cmd .twice { font-size: 11px; font-weight: 700; border: 1.5px solid #000; border-radius: 2mm; padding: 0 1.5mm; }
  .cmd .code { font: 600 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
  .cmd svg { display: block; max-width: 100%; }
  @media screen and (max-width: 760px) { .sheet { width: auto; padding: 16px; } .grid { grid-template-columns: minmax(0, 1fr); } }
  @media print {
    .bar { display: none; }
    .sheet { padding: 0; }
    @page { size: A4; margin: 10mm; }
  }
</style>
</head>
<body>
<div class="bar">
  <button id="print">Print</button>
  <span class="hint">Print on A4, laminate, and fix one to each truck within reach of the scanner. Every button on the handheld has a barcode here. Reports marked <b>2×</b> are confirmed by scanning them again.</span>
</div>
<div class="sheet" id="sheet"></div>
<script src="src/gs1.js"></script>
<script src="src/labels.js"></script>
<script src="src/engine.js"></script>
<script src="src/barcode.js"></script>
<script>
(function () {
  'use strict';
  const { SCAN_COMMANDS, COMMAND_PREFIX } = window.SortedWMS;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const groups = {};
  for (const [key, c] of Object.entries(SCAN_COMMANDS)) (groups[c.group] = groups[c.group] || []).push({ key, ...c });
  // 0.4 mm per module and 14 mm tall: easy for a handheld imager at arm's length.
  const card = (c) => `<div class="cmd"><div class="name"><span>${esc(c.label)}</span>${c.confirm ? '<span class="twice">2×</span>' : ''}</div>
    ${SortedBarcode.svg(COMMAND_PREFIX + c.key, { module: 0.4, height: 14, unit: 'mm' })}
    <div class="code">${esc(COMMAND_PREFIX + c.key)}</div></div>`;
  document.getElementById('sheet').innerHTML = `<h1>SortedWMS command card</h1>
    <p class="sub">Scan instead of tapping. CANCEL undoes anything half-done.</p>
    ${Object.entries(groups).map(([g, list]) => `<h2>${esc(g)}</h2><div class="grid">${list.map(card).join('')}</div>`).join('')}`;
  document.getElementById('print').onclick = () => window.print();
})();
</script>
</body>
</html>
